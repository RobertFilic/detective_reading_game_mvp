<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Detektiv">
<meta name="theme-color" content="#fdf6e9">
<title>Igre</title>
<style>
:root { --bg: #fdf6e9; --ink: #2b2a33; --muted: #6b6876; --card: #fff; --line: #e6dcc8; --accent: #3d6fd8; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
main {
  min-height: 100%; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); text-align: center;
}
h1 { font-size: 40px; margin: 0; }
.games { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; width: 100%; }
.game {
  display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(320px, 100%);
  background: var(--card); border: 3px solid var(--line); border-radius: 24px; padding: 28px 20px;
  color: inherit; text-decoration: none;
}
.game:active { border-color: var(--accent); }
.game .icon { font-size: 80px; line-height: 1; }
.game .name { font-size: 30px; font-weight: 700; color: var(--accent); }
.game .who { color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>Izberi igro</h1>
  <div class="games">
    <a class="game" href="solo/">
      <span class="icon">🕵️</span>
      <span class="name">Igraj sam</span>
      <span class="who">en detektiv</span>
    </a>
    <a class="game" href="za-dva/">
      <span class="icon">🕵️🕵️</span>
      <span class="name">Igrajta v dvoje</span>
      <span class="who">dva detektiva, en iPad</span>
    </a>
    <a class="game" href="pekarna/">
      <span class="icon">🥐</span>
      <span class="name">Pekarna</span>
      <span class="who">štej, plačaj, vrni drobiž</span>
    </a>
  </div>
</main>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
