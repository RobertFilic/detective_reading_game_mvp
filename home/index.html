<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<title>Bralni detektivi</title>
<!-- The manifest's start_url: every launch from the Home Screen icon passes here, so Cloudflare counts it
     as a visit to /home/, then the start page opens. A visit in the browser never comes through this page. -->
<style>html, body { margin: 0; height: 100%; background: #faf6ef; }</style>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "43f23b7bd5c7498597842d9997dcc64d"}'></script>
</head>
<body>
<script>
// Leave once the beacon has run (it sends its visit on the way out); offline it fails at once, and 1.5 s is the most anyone waits.
const go = () => location.replace('../');
addEventListener('load', () => setTimeout(go, 300));
setTimeout(go, 1500);
</script>
</body>
</html>
