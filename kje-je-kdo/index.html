<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b4d36">
<meta name="description" content="Skrivnostne sobe: uganka Bralnih detektivov. preberi stavke, postavi ljudi na pravo mesto in najdi, kdo je bil.">

<title>Skrivnostne sobe · Bralni detektivi</title>
<style>
/* »Skrivnostne sobe« (kje-je-kdo/): a Murdoku-style side game (docs/KJE_JE_KDO.md), in the start page's tokens. */
@font-face { font-family: Lexend; src: url('../solo/fonts/lexend-sl.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
:root {
  --season: #164b33; --season-mid: #3b825f; --season-soft: #def5e8;
  --bg: #faf6ef; --paper: #fffdfa; --ink: #1b222e; --ink-2: #4f5661; --line: #dfdad1;
  --glow: #f8ca65; --stamp: #c83a35; --stamp-paper: #fefbf6; --wall: #3a3229;
  --font: Lexend, Verdana, system-ui, sans-serif;
  --bs: min(calc(100vw - 32px), 440px);   /* the board's side */
}
@supports (color: oklch(0 0 0)) {
  :root { --season: oklch(0.37 0.07 160); --season-mid: oklch(0.55 0.09 160); --season-soft: oklch(0.95 0.03 160); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.45 var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

header.top { position: sticky; top: 0; z-index: 10; background: rgba(250, 246, 239, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
header.top .in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.back { min-width: 48px; min-height: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); display: grid; place-items: center; font-size: 20px; text-decoration: none; color: var(--ink); }
.ttl { flex: 1; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.ttl small { font: 600 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--season-mid); }
.ttl b { font: 700 19px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { min-width: 48px; min-height: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); font-size: 20px; }

main { max-width: 960px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

/* the level list */
.intro { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.intro h1 { font: 700 clamp(30px, 7vw, 44px)/1.1 var(--font); letter-spacing: -.01em; }
.intro p { color: var(--ink-2); }
.levels { display: grid; gap: 12px; }
.group { font: 700 20px var(--font); margin: 22px 0 10px; }
.lvl.locked { opacity: .55; }
.lvl.no { animation: shake 360ms; }
.lvl { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; min-height: 88px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 22px; background: var(--paper);
  box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(60, 50, 20, .05); }
.lvl i { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 30px; font-style: normal; background: var(--season-soft); transform: rotate(-4deg); }
.lvl span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.lvl small { font: 600 13px var(--font); color: var(--season-mid); letter-spacing: .06em; text-transform: uppercase; }
.lvl b { font: 600 19px/1.25 var(--font); }
.lvl em { font-style: normal; font-size: 15px; color: var(--ink-2); }
.lvl .done { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--season); color: #fff; display: grid; place-items: center; font-size: 18px; }
.me { display: flex; align-items: center; gap: 12px; }
.me p { flex: 1; }
.me-pic { position: relative; width: 60px; height: 60px; flex: none; border-radius: 50%; background: var(--season-soft); display: grid; place-items: center; font-size: 34px; }
.me-pic i { position: absolute; right: -6px; bottom: -4px; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 17px; font-style: normal; }
.home-link { display: inline-flex; align-items: center; min-height: 48px; margin-top: 18px; color: var(--season); font-weight: 500; }

/* the detective's ID card, the same one as in the main game */
.make { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; text-align: center; }
.make h1 { font: 700 clamp(26px, 6vw, 36px)/1.15 var(--font); }
.make .lead { color: var(--ink-2); }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--season); }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.picks.two { grid-template-columns: repeat(2, 1fr); }
.picks button { min-height: 96px; border: 2px solid var(--line); border-radius: 22px; background: var(--paper); font-size: 52px; line-height: 1; box-shadow: 0 2px 0 var(--line); }
.picks button.on { border-color: var(--season); box-shadow: 0 0 0 3px var(--season); }
.make input { min-height: 60px; border: 2px solid var(--line); border-radius: 18px; background: var(--paper); padding: 0 16px; font: 600 24px var(--font); text-align: center; color: var(--ink); width: 100%; }
.make input:focus { outline: none; border-color: var(--season); }
.make .btns { display: flex; flex-direction: column; gap: 8px; }
.idcard { align-self: center; display: flex; align-items: center; gap: 16px; text-align: left; background: var(--paper); border: 3px solid var(--season); border-radius: 22px; padding: 18px 22px;
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4.5px var(--season), 0 12px 30px rgba(22, 75, 51, .18); transform: rotate(-2deg); animation: rise 300ms ease-out both; }
.idcard .me-pic { width: 84px; height: 84px; font-size: 50px; }
.idcard small { display: block; font: 600 13px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--season-mid); }
.idcard b { font: 700 26px var(--font); }

/* the case */
.play { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ask { align-self: stretch; background: var(--season); color: #fff; border-radius: 20px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font: 600 17px/1.3 var(--font); }
.ask i { width: 34px; height: 34px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 18px; font-style: normal; }
.board { width: var(--bs); height: var(--bs); display: grid; border: 4px solid var(--wall); border-radius: 14px; overflow: hidden; background: var(--wall); flex: none; touch-action: manipulation; }
.cell { position: relative; border: 0; border-right: 1px solid rgba(58, 50, 41, .16); border-bottom: 1px solid rgba(58, 50, 41, .16); display: grid; place-items: center; padding: 0; background: var(--room); min-width: 0; min-height: 0; }
.cell > * { grid-area: 1 / 1; }
.cell.has .obj { position: absolute; top: 2px; right: 3px; font-size: calc(var(--bs) / var(--n) * .26); z-index: 2; }
.cell.has .obj svg { width: calc(var(--bs) / var(--n) * .3); }
.cell.has .rug { width: 86%; height: 86%; }
.cell .obj { font-size: calc(var(--bs) / var(--n) * .52); line-height: 1; pointer-events: none; }
.cell .obj svg { width: calc(var(--bs) / var(--n) * .62); height: auto; display: block; }
.cell .obj.gone { opacity: .35; filter: grayscale(1); outline: 2px dashed rgba(58, 50, 41, .45); outline-offset: 3px; border-radius: 8px; }
.cell .rug { width: 70%; height: 62%; border-radius: 6px; background: #b8433a; box-shadow: inset 0 0 0 3px #b8433a, inset 0 0 0 5px #f2c66d; pointer-events: none; }
.cell .lab { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); max-width: 94%; background: rgba(255, 253, 250, .92); border-radius: 6px; padding: 1px 4px;
  font: 600 clamp(10px, 2.6vw, 13px)/1.15 var(--font); text-align: center; pointer-events: none; z-index: 2; }
.cell .x { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(var(--bs) / var(--n) * .42) var(--font); color: rgba(58, 50, 41, .28); pointer-events: none; }
.cell .x.mine { color: #d23b33; }
.cell .tok { position: relative; z-index: 1; width: 78%; height: 78%; border-radius: 50%; background: var(--paper); border: 3px solid var(--season); display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .2); animation: pop 260ms cubic-bezier(.3, 1.6, .5, 1) both; pointer-events: none; }
.cell .tok span { font-size: calc(var(--bs) / var(--n) * .34); line-height: 1; }
.cell .tok b { font: 600 clamp(9px, calc(var(--bs) / var(--n) * .15), 13px)/1.2 var(--font); }
/* pencil notes: small faces of the people who could be here (the child's own marks, any number per cell) */
.cell .notes { position: absolute; inset: 3px 3px 18% 3px; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 1px; pointer-events: none; z-index: 1; }
.cell .notes i { font-style: normal; font-size: calc(var(--bs) / var(--n) * .24); line-height: 1.05; background: rgba(255, 253, 250, .85); border-radius: 50%; padding: 1px; }
.cell.can { outline: 4px solid var(--glow); outline-offset: -4px; animation: pulse 1.4s ease-in-out infinite; z-index: 3; }
.cell.room-hl { outline: 4px solid var(--stamp); outline-offset: -4px; z-index: 3; }
.cell.no { animation: shake 360ms; }
.tools { width: var(--bs); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool { min-height: 60px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--paper); font: 600 14px/1.15 var(--font); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; }
.tool i { font-style: normal; font-size: 20px; line-height: 1; }
.tool.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.helper { align-self: stretch; display: flex; gap: 10px; align-items: flex-start; }
.helper b { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 22px; font-weight: 400; }
.helper span { flex: 1; background: var(--paper); border: 2px solid var(--glow); border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 16px; line-height: 1.4; min-height: 46px; }
.side { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 520px; }
.clues { display: flex; flex-direction: column; gap: 8px; }
.clue { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 60px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 18px; background: var(--paper); }
.clue .face { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 26px; }
.clue .txt { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.clue .txt small { font: 600 14px var(--font); color: var(--season-mid); }
.clue .txt span { font-size: 18px; line-height: 1.35; }
.clue .ok { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: transparent; border: 2px dashed var(--line); }
.clue.sel { border-color: var(--season); box-shadow: 0 0 0 2px var(--season); }
.clue.placed { background: var(--bg); }
.clue.placed .ok { background: var(--season); border: 0; color: #fff; }
.clue.glow { animation: glow 1.2s ease-in-out 3; }
.who { align-self: stretch; background: var(--paper); border: 3px solid var(--season); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4.5px var(--season), 0 12px 30px rgba(22, 75, 51, .18); animation: rise 300ms ease-out both; }
.who h3 { font: 700 20px/1.3 var(--font); }
.faces { display: flex; flex-wrap: wrap; gap: 10px; }
.faces button { flex: 1 1 72px; min-height: 84px; border: 2px solid var(--line); border-radius: 18px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 15px var(--font); }
.faces button span { font-size: 32px; line-height: 1.1; }
.faces button.no { animation: shake 360ms; border-color: var(--stamp); }

/* sheets: rules and the reward */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(26, 30, 40, .45); display: flex; align-items: flex-end; justify-content: center; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); overflow-y: auto; }
.sheet { width: min(520px, 100%); margin-top: auto; background: var(--paper); border: 3px solid var(--season); border-radius: 28px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4.5px var(--season), 0 -10px 50px rgba(40, 30, 10, .28); animation: rise 280ms ease-out both; }
.sheet h3 { font: 700 23px/1.2 var(--font); }
.sheet .story { font-size: 18px; line-height: 1.45; }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.rules li { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 17px; line-height: 1.35; }
.rules li i { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--paper); display: grid; place-items: center; font-size: 22px; font-style: normal; }
.mini { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); border: 2.5px solid var(--wall); border-radius: 8px; overflow: hidden; flex: none; }
.mini span { display: grid; place-items: center; background: #f3ede2; border: 1px solid #e0d8ca; font-size: 15px; color: var(--ink-2); }
.mini .y { background: var(--season-mid); color: #fff; }
.big { min-height: 58px; border: 0; border-radius: 18px; background: var(--season); color: #fff; font: 600 18px var(--font); padding: 0 20px; }
.big.alt { background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); }
.win { align-items: center; text-align: center; }
.win .stamp { display: inline-flex; align-items: center; gap: 8px; color: var(--stamp); background: var(--stamp-paper); border: 3px solid var(--stamp); border-radius: 14px;
  box-shadow: inset 0 0 0 2px var(--stamp-paper), inset 0 0 0 3.5px var(--stamp); padding: 5px 14px 5px 5px; font: 700 22px var(--font); transform: rotate(-6deg);
  animation: stamp 420ms 120ms cubic-bezier(.3, 1.5, .5, 1) both; }
.win .stamp i { width: 32px; height: 32px; border-radius: 50%; background: var(--stamp); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 17px; }
.win .heart { background: #fbe6a4; border-radius: 16px; padding: 12px 14px; font-size: 17px; line-height: 1.45; text-align: left; transform: rotate(-1deg); }
.win .bravo { font: 600 18px var(--font); color: var(--season); }
.win .who-face { font-size: 64px; line-height: 1; }
.win .btns { display: flex; flex-direction: column; gap: 8px; align-self: stretch; }

@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 0%, 100% { outline-width: 3px; outline-offset: -3px; } 50% { outline-width: 7px; outline-offset: -7px; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 3px var(--glow); } 50% { box-shadow: 0 0 0 6px var(--glow), 0 0 22px 6px rgba(248, 202, 101, .5); } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes stamp { 0% { transform: scale(1.9) rotate(-12deg); opacity: 0; } 75% { transform: scale(.97) rotate(-6deg); opacity: 1; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }

/* side by side when the screen is wide or lying down */
@media (min-width: 700px) and (orientation: landscape), (min-width: 900px) {
  :root { --bs: min(calc(100dvh - 120px), 460px, calc(55vw - 40px)); }
  .play { display: grid; grid-template-columns: auto 1fr; align-items: start; column-gap: 20px; }
  .play > .board, .play > .tools { grid-column: 1; }
  .play > .ask { grid-column: 1 / -1; }
  .play > .side { grid-column: 2; grid-row: 2 / span 2; }
}
@media (min-width: 700px) { .levels { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<body>
<header class="top"><div class="in">
  <a class="back" id="back" href="../" aria-label="Nazaj">←</a>
  <span class="ttl"><small>Bralni detektivi · uganka</small><b id="title">Skrivnostne sobe</b></span>
  <button class="icon-btn" id="rulesBtn" aria-label="Pravila" hidden>?</button>
</div></header>

<main>
  <section id="list">
    <div class="intro">
      <h1>Skrivnostne sobe</h1>
      <div class="me"><span class="me-pic" id="mePic"></span><p><b id="meName"></b>, preberi, kje je bil kdo. Postavi vse na pravo mesto. Tako najdeš, kdo je bil.</p></div>
    </div>
    <div id="levels"></div>
    <a class="home-link" href="../">← Na začetno stran</a>
  </section>

  <section id="make" class="make" hidden></section>

  <section id="game" class="play" hidden>
    <div class="ask"><i>❓</i><span id="ask"></span></div>
    <div class="board" id="board"></div>
    <div class="tools">
      <button class="tool" id="noteBtn" aria-pressed="false"><i>✏️</i>Zapiski</button>
      <button class="tool" id="crossBtn" aria-pressed="false"><i>✕</i>Prečrtaj</button>
      <button class="tool" id="undoBtn"><i>↩️</i>Nazaj</button>
      <button class="tool" id="hintBtn"><i>💡</i>Pomoč</button>
    </div>
    <div class="side">
      <div class="helper"><b id="helperPic">🦉</b><span id="say"></span></div>
      <div class="clues" id="clues"></div>
      <div class="who" id="who" hidden><h3 id="whoQ"></h3><div class="faces" id="whoFaces"></div></div>
    </div>
  </section>
</main>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" id="sheetBody" role="dialog"></div></div>

<script>
// ---- The levels. Each person's `at` is the one solution and `rule` is their sentence as logic;
// solo/tools/kjekdo.mjs proves that the rules give exactly `at` and that no sentence is spare.
// Rules: {on: obj} | {notOn: obj} | {room: r} | {notRoom: r} | {beside: obj} | {notBeside: obj} | {} (no clue).
// Objects: e = emoji or svg = a drawing; block = nobody can stand there; gone = the missing thing's place (drawn faded).
const SVG = {
  klop: '<svg viewBox="0 0 40 30" aria-hidden="true"><rect x="3" y="4" width="34" height="6" rx="2" fill="#a0673a"/><rect x="3" y="13" width="34" height="6" rx="2" fill="#b97a45"/><rect x="6" y="19" width="4" height="10" rx="1" fill="#6b4425"/><rect x="30" y="19" width="4" height="10" rx="1" fill="#6b4425"/></svg>',
  tabla: '<svg viewBox="0 0 40 32" aria-hidden="true"><rect x="2" y="2" width="36" height="25" rx="3" fill="#2f5d46" stroke="#8a5a32" stroke-width="3"/><path d="M20 22c-6-4-9-7-9-10a4 4 0 0 1 9-2 4 4 0 0 1 9 2c0 3-3 6-9 10z" fill="#ff8fb1"/><rect x="14" y="27" width="12" height="3" fill="#8a5a32"/></svg>',
  stozec: '<svg viewBox="0 0 30 32" aria-hidden="true"><path d="M15 2 26 27H4z" fill="#f28c28"/><path d="M10 15h10l2 5H8z" fill="#fff"/><rect x="2" y="26" width="26" height="4" rx="1.5" fill="#e0701a"/></svg>',

// ---- State
const $ = (id) => document.getElementById(id);
const KEY = 'dp_kjekdo_v1';   // solved puzzles; solo/ keeps one copy per detective (KID_KEYS) and exports it
let solved = [];
try { solved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('kjekdo_solved') || '[]'); } catch (e) {}

// ---- The detective: the main game's ID card (solo/, same site, same key), so a child is one detective
// everywhere. Without a card, the puzzles start with the same steps: detective → helper → name → card.
const PROFILE_KEY = 'dp_profile_v1';
const AVATARS = [
  { e: '🕵🏻‍♂️', g: 'm' }, { e: '🕵🏽‍♂️', g: 'm' }, { e: '🕵🏿‍♂️', g: 'm' },
  { e: '🕵🏻‍♀️', g: 'f' }, { e: '🕵🏽‍♀️', g: 'f' }, { e: '🕵🏿‍♀️', g: 'f' },
];
const SIDEKICKS = ['🐶', '🐱', '🦉', '🦊'];
let me = null;
try { me = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); } catch (e) {}
const detTitle = (p) => (p && p.g === 'f' ? 'Detektivka' : 'Detektiv');
const detName = (p) => detTitle(p) + (p && p.name ? ' ' + p.name : '');
const cleanName = (v) => v.replace(/[^\p{L}\p{N} '-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 12)
  .replace(/^\p{L}/u, ch => ch.toUpperCase());
const esc = (t) => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const mePic = (p) => `${p.av}<i>${p.sk}</i>`;
let mk = null;   // the card being made: {step, av, g, sk, name, then}
let L = null, S = null;   // the level and its state: {pos: {id: [r,c]}, crosses: Set, notes: {'r,c': [ids]}, sel, mode: place|cross|note, history, hint}

const k = (r, c) => r + ',' + c;
const objAt = (r, c) => L.objects[k(r, c)];
const blocked = (r, c) => { const o = objAt(r, c); return !!(o && OBJ[o].block); };
const roomAt = (r, c) => L.rooms[r][c];
const near = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < L.n && b < L.n);
const fits = (rule, r, c) => {
  if (rule.on) return objAt(r, c) === rule.on;
  if (rule.notOn) return objAt(r, c) !== rule.notOn;
  if (rule.room) return roomAt(r, c) === rule.room;
  if (rule.notRoom) return roomAt(r, c) !== rule.notRoom;
  if (rule.beside) return near(r, c).some(([a, b]) => objAt(a, b) === rule.beside);
  if (rule.notBeside) return !near(r, c).some(([a, b]) => objAt(a, b) === rule.notBeside);
  return true;
};
const person = (id) => L.people.find(p => p.id === id);
const whoAt = (r, c) => L.people.find(p => S.pos[p.id] && S.pos[p.id][0] === r && S.pos[p.id][1] === c);
const inRow = (r) => L.people.find(p => S.pos[p.id] && S.pos[p.id][0] === r);
const inCol = (c) => L.people.find(p => S.pos[p.id] && S.pos[p.id][1] === c);
const allPlaced = () => L.people.every(p => S.pos[p.id]);
const say = (html) => { $('say').innerHTML = html; };

// ---- The level list
function showList() {
  L = null; mk = null;
  if (!me) return makeCard();
  $('list').hidden = false; $('game').hidden = true; $('make').hidden = true; $('rulesBtn').hidden = true;
  $('title').textContent = 'Skrivnostne sobe';
  $('back').setAttribute('href', '../');
  $('mePic').innerHTML = mePic(me);
  $('meName').textContent = detName(me);
  // each puzzle opens when the one before it is solved
  const open = (l) => l.id === LEVELS[0].id || solved.includes(LEVELS[LEVELS.indexOf(l) - 1].id);
  const card = (l) => {
    const n = l.rooms.length, lock = !open(l);
    return `<button class="lvl${lock ? ' locked' : ''}" data-level="${l.id}"${lock ? ' aria-disabled="true"' : ''}><i>${lock ? '🔒' : l.icon}</i><span><small>Uganka ${l.id} · ${n}\u00a0×\u00a0${n}</small><b>${l.title}</b><em aria-hidden="true">${l.people.map(p => p.face).join(' ')}</em></span>${solved.includes(l.id) ? '<span class="done" aria-label="rešeno">✓</span>' : ''}</button>`;
  };
  $('levels').innerHTML = GROUPS.map(([g, label]) => `<h2 class="group">${label}</h2><div class="levels">${LEVELS.filter(l => l.group === g).map(card).join('')}</div>`).join('');
  document.querySelectorAll('.lvl').forEach(b => b.onclick = () => {
    if (b.classList.contains('locked')) { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); return; }
    start(+b.dataset.level);
  });
  scrollTo(0, 0);
}

// ---- A new detective's ID card (the main game's steps, in short)
function makeCard(then) {
  mk = { step: 1, av: null, g: null, sk: null, name: '', then: then || null };
  drawMake();
}

function drawMake() {
  $('list').hidden = true; $('game').hidden = true; $('make').hidden = false; $('rulesBtn').hidden = true;
  $('title').textContent = 'Detektivska izkaznica';
  $('back').setAttribute('href', mk.step > 1 ? '#' : '../');
  const dots = `<div class="dots" aria-hidden="true">${[1, 2, 3, 4].map(i => `<span class="${i === mk.step ? 'on' : ''}"></span>`).join('')}</div>`;
  let html = '';
  if (mk.step === 1) {
    html = `<h1>Izberi svojega detektiva</h1><p class="lead">Pred prvo uganko si naredi detektivsko izkaznico.</p>
      <div class="picks">${AVATARS.map((a, i) => `<button data-av="${i}" aria-label="${a.g === 'f' ? 'detektivka' : 'detektiv'}">${a.e}</button>`).join('')}</div>`;
  } else if (mk.step === 2) {
    html = `<h1>Izberi pomočnika</h1><p class="lead">Pomočnik ti bo pomagal pri ugankah.</p>
      <div class="picks two">${SIDEKICKS.map(e => `<button data-sk="${e}">${e}</button>`).join('')}</div>`;
  } else if (mk.step === 3) {
    html = `<h1>Kako ti je ime?</h1><span class="me-pic" style="align-self:center">${mePic(mk)}</span>
      <input id="mkName" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Ime" value="${esc(mk.name)}">
      <div class="btns"><button class="big" id="mkNext">Naprej</button><button class="big alt" id="mkSkip">Preskoči</button></div>`;
  } else {
    html = `<h1>To si ti!</h1><div class="idcard"><span class="me-pic">${mePic(mk)}</span><span><small>Bralni detektivi</small><b>${esc(detName(mk))}</b></span></div>
      <div class="helper"><b>${mk.sk}</b><span>${mk.g === 'f' ? 'Postala si detektivka!' : 'Postal si detektiv!'}</span></div>
      <div class="btns"><button class="big" id="mkDone">Začni 🔍</button></div>`;
  }
  $('make').innerHTML = dots + html;
  $('make').querySelectorAll('[data-av]').forEach(b => b.onclick = () => { const a = AVATARS[+b.dataset.av]; Object.assign(mk, { av: a.e, g: a.g, step: 2 }); drawMake(); });
  $('make').querySelectorAll('[data-sk]').forEach(b => b.onclick = () => { Object.assign(mk, { sk: b.dataset.sk, step: 3 }); drawMake(); });
  if (mk.step === 3) {
    $('mkNext').onclick = () => { mk.name = cleanName($('mkName').value || ''); mk.step = 4; drawMake(); };
    $('mkSkip').onclick = () => { mk.name = ''; mk.step = 4; drawMake(); };
  }
  if (mk.step === 4) $('mkDone').onclick = () => {
    me = { av: mk.av, g: mk.g, sk: mk.sk, name: mk.name, id: String(1000 + Math.floor(Math.random() * 9000)) };
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(me)); } catch (e) {}
    const then = mk.then;
    mk = null;
    if (then) start(then); else showList();
  };
  scrollTo(0, 0);
}

// ---- A level
function start(id) {
  if (!me) return makeCard(id);
  L = LEVELS.find(l => l.id === id); L.n = L.rooms.length;
  S = { pos: {}, crosses: new Set(), notes: {}, sel: L.people[0].id, mode: 'place', history: [], hint: null, shown: new Set() };
  $('list').hidden = true; $('game').hidden = false; $('make').hidden = true; $('rulesBtn').hidden = false;
  $('helperPic').textContent = me.sk;
  $('title').textContent = L.title;
  $('back').setAttribute('href', '#');
  $('ask').textContent = L.ask;
  $('who').hidden = true;
  $('board').style.setProperty('--n', L.n);
  document.documentElement.style.setProperty('--n', L.n);
  $('board').style.gridTemplateColumns = `repeat(${L.n}, 1fr)`;
  $('board').style.gridTemplateRows = `repeat(${L.n}, 1fr)`;
  setMode('place');
  say('Tapni stavek, nato polje, kjer je bil ta človek.');
  draw();
  scrollTo(0, 0);
  showRules();
}

function showRules() {
  const stops = [...new Set(Object.values(L.objects))].filter(o => OBJ[o].block).map(o => `${OBJ[o].e || ''} ${OBJ[o].name}`.trim());
  const usesBeside = L.people.some(p => p.rule.beside || p.rule.notBeside);
  const rules = [
    ['↔️', 'V vsaki <b>vrsti</b> je samo en človek.'],
    ['↕️', 'V vsakem <b>stolpcu</b> je samo en človek.'],
    ['🚫', `Kjer ${OBJ[Object.values(L.objects).find(o => OBJ[o].block)].pl ? 'so' : 'je'} ${stops.join(', ').replace(/, ([^,]*)$/, ' ali $1')}, ne more stati nihče.`],
  ];
  const beside = usesBeside ? `<li><span class="mini" aria-hidden="true"><span>✕</span><span class="y">✓</span><span>✕</span><span class="y">✓</span><span>🌳</span><span class="y">✓</span><span>✕</span><span class="y">✓</span><span>✕</span></span><span><b>Ob</b> pomeni levo, desno, zgoraj ali spodaj. Poševno ne velja.</span></li>` : '';
  openSheet(`<h3>${L.icon} ${L.title}</h3><p class="story">${L.story}</p>
    <ul class="rules">${rules.map(([i, t]) => `<li><i>${i}</i><span>${t}</span></li>`).join('')}${beside}</ul>
    <button class="big" id="go">Začnimo!</button>`);
  $('go').onclick = closeSheet;
}

function draw() {
  const n = L.n, b = $('board');
  let html = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const room = roomAt(r, c), o = objAt(r, c), p = whoAt(r, c);
    // a wall between two rooms: each side draws half of it, so every cell keeps the same size
    const wall = (a, bb) => a >= 0 && bb >= 0 && a < n && bb < n && roomAt(a, bb) !== room;
    const walls = [[r - 1, c, '0 2px'], [r + 1, c, '0 -2px'], [r, c - 1, '2px 0'], [r, c + 1, '-2px 0']].filter(([a, bb]) => wall(a, bb)).map(([, , d]) => `inset ${d} 0 var(--wall)`);
    const style = `--room:${ROOM_COLORS[L.names[room]] || '#eee9e0'};${walls.length ? `box-shadow:${walls.join(',')};` : ''}${c === n - 1 ? 'border-right:0;' : ''}${r === n - 1 ? 'border-bottom:0;' : ''}`;
    let inner = '';
    if (o) inner += OBJ[o].rug ? '<span class="rug"></span>' : `<span class="obj${OBJ[o].gone ? ' gone' : ''}">${OBJ[o].svg || OBJ[o].e}</span>`;
    if (p) inner += `<span class="tok"><span>${p.face}</span><b>${p.name}</b></span>`;
    else if (!blocked(r, c) && (S.crosses.has(k(r, c)))) inner += '<span class="x mine">✕</span>';
    else if (!blocked(r, c) && (inRow(r) || inCol(c))) inner += '<span class="x">✕</span>';
    else if ((S.notes[k(r, c)] || []).length) inner += `<span class="notes">${S.notes[k(r, c)].map(id => `<i>${person(id).face}</i>`).join('')}</span>`;
    const lab = L.labels[room];
    if (lab[0] === r && lab[1] === c) inner += `<span class="lab">${L.names[room]}</span>`;
    const noted = (S.notes[k(r, c)] || []).map(id => person(id).name);
    const what = p ? p.name : o ? OBJ[o].name : noted.length ? 'zapisek: ' + noted.join(', ') : 'prazno';
    html += `<button class="cell${p ? ' has' : ''}" data-r="${r}" data-c="${c}" style="${style}" aria-label="${L.names[room]}, vrsta ${r + 1}, stolpec ${c + 1}: ${what}">${inner}</button>`;
  }
  b.innerHTML = html;
  b.querySelectorAll('.cell').forEach(el => el.onclick = () => tap(+el.dataset.r, +el.dataset.c, el));
  $('clues').innerHTML = L.people.map(p => `<button class="clue${S.sel === p.id && S.mode !== 'cross' ? ' sel' : ''}${S.pos[p.id] ? ' placed' : ''}" data-p="${p.id}"><span class="face">${p.face}</span><span class="txt"><small>${p.name}</small><span>${p.clue}</span></span><span class="ok">✓</span></button>`).join('');
  $('clues').querySelectorAll('.clue').forEach(el => el.onclick = () => pick(el.dataset.p));
  $('undoBtn').disabled = !S.history.length;
}

function pick(id) {
  if (allPlaced()) return;
  if (S.mode === 'cross') setMode('place');
  S.sel = id; S.hint = null;
  const p = person(id);
  say(S.pos[id] ? `${p.name} že stoji na svojem mestu. Izberi drug stavek.`
    : S.mode === 'note' ? `Kje bi lahko bil${p.she ? 'a' : ''} ${p.name}? Tapni ta polja.` : `Kje je bil${p.she ? 'a' : ''} ${p.name}? Tapni polje.`);
  draw();
}

function nope(el, text) {
  el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
  say(text);
}

function tap(r, c, el) {
  if (allPlaced()) return;
  const here = whoAt(r, c);
  if (S.mode === 'note') return note(r, c, el);
  if (S.mode === 'cross') {
    if (here || blocked(r, c)) return nope(el, 'Tega polja ne moreš prečrtati.');
    const key = k(r, c);
    S.history.push({ cross: key });
    S.crosses.has(key) ? S.crosses.delete(key) : S.crosses.add(key);
    return draw();
  }
  if (here) return nope(el, `Tu že stoji ${here.name}.`);
  if (blocked(r, c)) return nope(el, `Tu ${OBJ[objAt(r, c)].pl ? 'so' : 'je'} ${OBJ[objAt(r, c)].name}. Tu ne more stati nihče.`);
  const p = person(S.sel);
  if (!p || S.pos[p.id]) return nope(el, 'Najprej tapni stavek nekoga, ki še nima mesta.');
  const row = inRow(r), col = inCol(c);
  if (row) return nope(el, `V tej vrsti že stoji ${row.name}. V vsaki vrsti je samo en človek.`);
  if (col) return nope(el, `V tem stolpcu že stoji ${col.name}. V vsakem stolpcu je samo en človek.`);
  if (p.at[0] !== r || p.at[1] !== c) {
    nope(el, fits(p.rule, r, c) ? `Morda, a to še ni gotovo. Preberi še druge stavke.` : `Preberi še enkrat: »${p.clue}«`);
    const row = document.querySelector(`.clue[data-p="${p.id}"]`);
    row.classList.remove('glow'); void row.offsetWidth; row.classList.add('glow');
    return;
  }
  place(p);
}

// A pencil note: the selected person might be here. A second tap rubs it out. Notes never place anyone.
function note(r, c, el) {
  const here = whoAt(r, c), p = person(S.sel);
  if (here) return nope(el, `Tu že stoji ${here.name}.`);
  if (blocked(r, c)) return nope(el, `Tu ${OBJ[objAt(r, c)].pl ? 'so' : 'je'} ${OBJ[objAt(r, c)].name}. Tu ne more stati nihče.`);
  if (!p || S.pos[p.id]) return nope(el, 'Najprej tapni stavek nekoga, ki še nima mesta.');
  const row = inRow(r), col = inCol(c);
  if (row) return nope(el, `V tej vrsti že stoji ${row.name}.`);
  if (col) return nope(el, `V tem stolpcu že stoji ${col.name}.`);
  const key = k(r, c);
  S.history.push({ note: key, id: p.id });
  toggleNote(key, p.id);
  draw();
}
function toggleNote(key, id) {
  const l = S.notes[key] || [];
  S.notes[key] = l.includes(id) ? l.filter(x => x !== id) : L.people.map(q => q.id).filter(x => x === id || l.includes(x));
}

function place(p) {
  S.pos[p.id] = p.at.slice();
  // the person's own notes and every note in their row and column are no longer needed (undo brings them back)
  const rubbed = [];
  for (const [key, ids] of Object.entries(S.notes)) {
    const [r, c] = key.split(',').map(Number);
    for (const id of ids) if (id === p.id || r === p.at[0] || c === p.at[1]) rubbed.push([key, id]);
  }
  for (const [key, id] of rubbed) toggleNote(key, id);
  S.history.push({ placed: p.id, rubbed });
  S.hint = null;
  const next = L.people.find(q => !S.pos[q.id]);
  if (next) { S.sel = next.id; say(`Bravo! ${p.name} je na svojem mestu.`); }
  draw();
  if (!next) ask();
}

function undo() {
  const last = S.history.pop();
  if (!last) return;
  if (last.placed) { delete S.pos[last.placed]; S.sel = last.placed; $('who').hidden = true; for (const [key, id] of last.rubbed) toggleNote(key, id); }
  if (last.note) toggleNote(last.note, last.id);
  if (last.cross) S.crosses.has(last.cross) ? S.crosses.delete(last.cross) : S.crosses.add(last.cross);
  say('Korak nazaj.');
  draw();
}

function setMode(m) {
  S.mode = m;
  for (const [id, on] of [['crossBtn', m === 'cross'], ['noteBtn', m === 'note']]) { $(id).classList.toggle('on', on); $(id).setAttribute('aria-pressed', on); }
}

// Help, one honest step at a time; the child always taps the cell. It reasons like a child (as
// solo/tools/kjekdo.mjs does) from the people already placed, and shows the first step not yet shown:
// - a sentence leaves one cell: (1) read this sentence, (2) the cells it allows, (3) the one cell;
// - a row or column has room for only one person, and so one cell: (1) this line needs someone,
//   (2) only they fit, (3) the cell;
// - a row or column has room for only one person, but they have several cells in it: (1) this line needs
//   someone, (2) only they fit, so they are on one of these cells (a pencil note). The next press goes on
//   from there. The help never shows a cell before the reason for it.
const cellsFor = (p) => {
  const out = [];
  for (let r = 0; r < L.n; r++) for (let c = 0; c < L.n; c++) if (!blocked(r, c) && !inRow(r) && !inCol(c) && fits(p.rule, r, c)) out.push([r, c]);
  return out;
};
function nextStep() {
  const left = L.people.filter(p => !S.pos[p.id]), cand = {};
  for (const p of left) cand[p.id] = cellsFor(p);
  for (let guard = 0; guard < 50; guard++) {
    const one = left.find(p => cand[p.id].length === 1);
    if (one) return { id: one.id, cells: cand[one.id] };
    let moved = false;
    lines: for (const axis of [0, 1]) for (let x = 0; x < L.n; x++) {
      if (axis ? inCol(x) : inRow(x)) continue;
      const who = left.filter(p => cand[p.id].some(q => q[axis] === x));
      if (who.length !== 1) continue;
      const p = who[0], there = cand[p.id].filter(q => q[axis] === x);
      if (there.length === cand[p.id].length) continue;   // nothing new
      if (there.length === 1) return { id: p.id, axis, x };
      if (!S.shown.has(`${p.id}:${axis}:${x}`)) return { id: p.id, axis, x, narrow: there };
      cand[p.id] = there; moved = true;
      break lines;
    }
    if (!moved) break;
  }
  return { id: left[0].id };
}

function hint() {
  if (allPlaced()) return;
  setMode('place');
  if (S.hint && S.hint.narrow && S.hint.step >= 2) { S.shown.add(`${S.hint.id}:${S.hint.axis}:${S.hint.x}`); S.hint = null; }
  if (!S.hint || S.pos[S.hint.id]) S.hint = { ...nextStep(), step: 0 };
  S.hint.step = Math.min(S.hint.step + 1, 3);
  const h = S.hint, p = person(h.id);
  S.sel = p.id;
  draw();
  const row = document.querySelector(`.clue[data-p="${p.id}"]`);
  const light = (cells) => cells.forEach(([r, c]) => document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`).classList.add('can'));
  const line = h.axis === 1 ? 'tem stolpcu' : 'tej vrsti';
  const lineCells = () => { const out = []; for (let i = 0; i < L.n; i++) { const [r, c] = h.axis === 1 ? [i, h.x] : [h.x, i]; if (!blocked(r, c) && !inRow(r) && !inCol(c)) out.push([r, c]); } return out; };
  if (h.axis !== undefined && h.step === 1) {
    light(lineCells());
    say(`V ${line} mora stati nekdo. Preberi stavke. Kdo lahko stoji tukaj?`);
  } else if (h.narrow) {
    row.classList.add('glow');
    light(h.narrow);
    say(`Samo ${p.name} lahko stoji v ${line}: »${p.clue}« Torej je na enem od svetlih polj. Zapiši si to s svinčnikom ✏️ in tapni Pomoč še enkrat.`);
  } else if (h.axis !== undefined && h.step === 2) {
    row.classList.add('glow');
    light(lineCells());
    say(`Samo ${p.name} lahko stoji v ${line}: »${p.clue}« Za druge tu ni prostora.`);
  } else if (h.step === 1) {
    row.classList.add('glow');
    say(`Preberi ta stavek: »${p.clue}«`);
  } else if (h.step === 2) {
    const can = h.cells || cellsFor(p);
    light(can);
    say(can.length === 1 ? 'Samo eno polje ustreza. Tapni ga!' : `${p.name} je lahko na svetlih poljih. Preberi še druge stavke.`);
  } else {
    light([p.at]);
    say(`Tukaj je bil${p.she ? 'a' : ''} ${p.name}. Tapni svetlo polje.`);
  }
}

// ---- The question and the reward
function ask() {
  say('Vsi so na svojih mestih! Zdaj odgovori na vprašanje.');
  $('whoQ').textContent = L.ask;
  $('whoFaces').innerHTML = L.people.map(p => `<button data-p="${p.id}"><span>${p.face}</span>${p.name}</button>`).join('');
  $('whoFaces').querySelectorAll('button').forEach(el => el.onclick = () => answer(el.dataset.p, el));
  $('who').hidden = false;
  $('who').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function answer(id, el) {
  if (id !== L.culprit) {
    el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
    document.querySelectorAll('.cell').forEach(c => c.classList.toggle('room-hl', roomAt(+c.dataset.r, +c.dataset.c) === L.room));
    say(`Ni še prav. Poglej rdeči prostor (${L.names[L.room].toLowerCase()}). Kdo stoji v njem?`);
    return;
  }
  if (!solved.includes(L.id)) solved.push(L.id);
  try { localStorage.setItem(KEY, JSON.stringify(solved)); localStorage.removeItem('kjekdo_solved'); } catch (e) {}
  const p = person(id), next = LEVELS.find(l => l.id === L.id + 1);
  openSheet(`<div class="win sheet-inner" style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <span class="stamp"><i>✓</i>Primer rešen!</span>
    <p class="bravo">${me.sk} Bravo, ${esc(detName(me).replace(/^D/, 'd'))}!</p>
    <span class="who-face">${p.face}</span>
    <h3>${L.win}</h3><p class="story">${L.why}</p>
    <p class="heart"><b>Zakaj?</b> ${L.heart}</p>
    <div class="btns">${next ? `<button class="big" id="next">Naslednja uganka ${next.icon}</button>` : ''}<button class="big ${next ? 'alt' : ''}" id="toList">Vse uganke</button><a class="big alt" href="../" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Na začetno stran</a></div></div>`);
  if (next) $('next').onclick = () => { closeSheet(); start(next.id); };
  $('toList').onclick = () => { closeSheet(); showList(); };
}

function openSheet(html) { $('sheetBody').innerHTML = html; $('sheet').hidden = false; }
function closeSheet() { $('sheet').hidden = true; }

$('crossBtn').onclick = () => { setMode(S.mode === 'cross' ? 'place' : 'cross'); say(S.mode === 'cross' ? 'Tapni polje, kjer zagotovo ni bilo nikogar.' : 'Tapni stavek, nato polje.'); draw(); };
$('noteBtn').onclick = () => {
  setMode(S.mode === 'note' ? 'place' : 'note');
  const p = person(S.sel);
  say(S.mode === 'note' ? `Zapiski: tapni polja, kjer bi lahko bil${p && p.she ? 'a' : ''} ${p && !S.pos[p.id] ? p.name : 'nekdo'}. Lahko jih je več. Še en tap zapisek zbriše.` : 'Tapni stavek, nato polje.');
  draw();
};
$('undoBtn').onclick = undo;
$('hintBtn').onclick = hint;
$('rulesBtn').onclick = () => showRules();
$('back').onclick = (e) => {
  if (mk && mk.step > 1) { e.preventDefault(); mk.step--; drawMake(); }
  else if (L) { e.preventDefault(); showList(); }
};

const q = new URLSearchParams(location.search).get('uganka');
if (q && LEVELS.some(l => l.id === +q)) start(+q); else showList();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
}
</script>
