        : '<button class="btn" data-act="filmNext">Naprej ▶</button>'}</div></div>`;
}

// After case f.guess.after the child guesses what is in the vent (kept per detective).
// With guess.again, after that case the child may keep the guess or change it, once (S.reguess = choosing again).
function guessHTML(f, pinned) {
  if (!f.guess || pinned < f.guess.after) return '';
  if (f.answer && fileDone(f.id)) return answerHTML(f);
  const g = f.guess, all = store.read(GUESS_KEY, {}), mine = all[f.id];
  const pick = g.options.find(o => o[0] === mine);
  const again = pick && g.again && pinned >= g.again && !all[f.id + ':again'];
  const opts = (q, clip) => `<div class="guess asking"><div class="row" data-act="say" data-clip="${clip}">🤔 ${esc(q)}</div>
    <div class="guess-opts">${g.options.map(([id, e, t]) =>
      `<button class="btn secondary ${id === mine ? 'before' : ''}" data-act="ventGuess" data-id="${id}">${e} ${esc(t)}${id === mine ? ' <small>(prej)</small>' : ''}</button>`).join('')}</div></div>`;
  if (again && S.reguess) return opts(g.q, f.id + '_gq');
  if (again) return `<div class="guess asking"><div class="row" data-act="say" data-clip="${f.id}_gq2">🤔 ${esc(g.q2)}</div>
    <div class="gres">Tvoje ugibanje: ${pick[1]} ${esc(pick[2])}.</div>
    <div class="guess-opts"><button class="btn secondary" data-act="guessKeep">👍 Da</button><button class="btn secondary" data-act="guessChange">🔄 Spremenim</button></div></div>`;
  if (pick) return `<div class="guess done">🤔 Tvoje ugibanje: ${pick[1]} ${esc(pick[2])}. Bomo videli!</div>`;
  return opts(g.q, f.id + '_gq');
}

// The season is solved: what the answer was, and whether the child's guess was right
// (and, if the child changed it, whether the change was).
function answerHTML(f) {
  const all = store.read(GUESS_KEY, {});
  const pick = f.guess && f.guess.options.find(o => o[0] === all[f.id]);
  const first = all[f.id + ':first'], changed = pick && first && first !== pick[0];
  const right = pick && pick[0] === f.answer.id;
  const line = (k) => ['ui_' + k + ga('', 'F'), ga(UI_AUDIO[k], UI_AUDIO[k + 'F'])];
  const verdict = !pick ? null : right ? line(changed ? 'guessChanged' : 'guessRight')
    : changed && first === f.answer.id ? line('guessFirst') : ['ui_guessWrong', UI_AUDIO.guessWrong];
  return `<div class="guess done answer ${right ? 'right' : ''}">
    <div class="row" data-act="say" data-clip="${f.id}_a">${f.answer.icon} ${esc(f.answer.text)}</div>
    ${pick ? `<div class="gres">🤔 Tvoje ugibanje: ${pick[1]} ${esc(pick[2])}.
      <span data-act="say" data-clip="${verdict[0]}">${esc(verdict[1])}</span></div>` : ''}</div>`;
}

// The season's corkboard: one slot per case, a pinned card for each solved case that has one.
// S.pinNew = the case just solved: its card flies in, the string to it draws, and the
// detective thinks out loud. From 2 cards on, eyes blink in the vent.
function corkboard(f, cases) {
  const slots = cases.length + (f.soon || 0);
  const pinned = cases.filter(c => c.card && isSolved(c)).length;
  const fresh = cases.find(c => c.id === S.pinNew && c.card);
  const pins = Array.from({ length: slots }, (_, i) => {
    const c = cases[i];
    const s = c && c.card && isSolved(c) ? c.sentences.find(x => x.id === c.card.sid) : null;
    const isNew = fresh && c === fresh;
    return (i ? `<span class="string ${isNew ? 'draw' : ''}"></span>` : '')
      + (s ? `<div class="pincard ${isNew ? 'new' : ''} ${f.pages ? 'page' : ''}" data-act="say" data-clip="${c.id}_${s.id}"><span class="ci">${c.card.icon}</span>${names(s.text)}</div>`
        : '<div class="pincard empty">?</div>');
  }).join('');
  const guess = guessHTML(f, pinned);
  return `<div class="cork ${guess.includes('asking') ? 'asking' : ''}"><div class="cork-q">📌 ${esc(f.mystery)}${f.peek && pinned >= 2 ? `<button class="vent" data-act="vent" data-say="${esc(f.peek.say)}" aria-label="${esc(f.peek.label)}"><span class="eyes">${f.answer && fileDone(f.id) ? f.answer.icon : f.peek.icon}</span></button>` : ''}</div>
    <div class="pins">${pins}</div>
    ${fresh && fresh.card.think ? `<div class="think" data-act="say" data-clip="${fresh.id}_t">💭 ${esc(fresh.card.think)}</div>` : ''}
    ${guess}</div>`;
}

  </div></div>`;
}

// Step cases: what the child should do next (for hints): the alibi of the first suspect not
// crossed off yet, or, when only the culprit is left, the proof.
function elimTarget() {
  const c = S.c, r = S.run;
  const who = c.suspects.find(id => id !== c.culprit && !r.crossed.includes(id));
  if (who) return { who, sid: c.sentences.find(s => s.clears === who).id };
  return { who: c.culprit, sid: c.sentences.find(s => s.role === 'evidence' && !r.proofs.includes(s.id)).id };
}

function ladderHint(level) {
  const c = S.c;
  if (level === 1) return { key: 'h1', text: c.h1, clip: c.id + '_h1', level };
  if (level === 2) return { key: 'h2', text: UI_AUDIO.h2, clip: 'ui_h2', level };
  if (need() === 2) return { key: 'h3', text: UI_AUDIO.h3pair, clip: 'ui_h3pair', level };
  return { key: 'h3', text: UI_AUDIO.h3, clip: 'ui_h3', level };
}

function showHint(h) {
  S.run.hint = h;
  log('hint_shown', { hint: h.key, hintLevel: h.level });
  $('.screen').classList.add('locked');
  app.insertAdjacentHTML('beforeend', hintHTML(h));
  $('.footer').innerHTML = evFooter();
  refreshRows();
}

        <div class="seg"><button class="btn big" data-act="mkName">Naprej</button></div>
        <button class="btn secondary" data-act="mkSkip">Preskoči</button>`;
    } else {
      body = `<h1>To si ti!</h1>${idCard({ id: m.id, av: m.av, g: m.g, sk: m.sk, name: m.name })}
        <button class="btn big" data-act="mkDone">Začni 🔍</button>`;
    }
    return `<div class="screen center make"><div class="mk-top"><span class="steps-dots">${[1, 2, 3, 4].map(i => `<i class="${i <= m.step ? 'on' : ''}"></i>`).join('')}</span>${back}</div>${body}</div>`;
  },

  // Kdo igra? One card per detective on this device, plus a new one.
  who() {
    const cards = detectiveCards();
    return `<div class="screen center who">
      <h1>Kdo igra?</h1>
      <div class="who-list">${cards.map(x => `<button class="who-card" data-act="pickDetective" data-key="${x.key}">
        <span class="who-av">${x.p.av}</span><b>${esc(detName(x.p))}</b><span class="rank">${rankName(rankFor(x.n), x.p)}</span><span class="muted">✔ ${solvedLabel(x.n)}</span></button>`).join('')}
        <button class="who-card add" data-act="addDetective"><span class="who-av">➕</span><b>Nov detektiv</b><span class="muted">za drugega otroka</span></button></div>
      ${profile() ? '<button class="btn secondary" data-act="back">← Nazaj</button>' : ''}
    </div>`;
  },

  files() {
    const p = profile();
    return `<div class="screen files-screen">
      <div class="files-card">${idCard(p)}<button class="btn secondary edit" data-act="editCard" aria-label="Uredi izkaznico">✏️</button></div>
      <div class="board-head"><span class="q">🗺️ Izberi pustolovščino</span></div>
      <div class="file-list">${fileOrder().cards.map(([f, hero]) => {
        const cs = casesIn(f.id), done = cs.filter(isSolved).length, all = cs.length + (f.soon || 0);
        const tags = [done ? '' : 'NOVO', f.season ? '🔎 skrivnost' : ''].filter(Boolean).join(' · ');
        return `<button class="file-card ${hero ? 'hero' : ''} ${f.season ? 'season' : ''}" data-act="openFile" data-file="${f.id}">
          <span class="fi">${f.icon}</span>
          <span class="ft">${tags ? `<span class="new-tag">${tags}</span>` : ''}<b>${esc(f.title)}</b><span class="cast">${f.cast.map(id => CHARACTERS[id].animal).join(' ')}</span>
            ${hero ? `<span class="go">${done ? '▶ Nadaljuj' : '▶ Začni'}</span>` : ''}</span>
          ${done ? `<span class="fp">✔ ${done} / ${all}</span>` : ''}</button>`;
      }).join('')}
        ${shelfHTML(fileOrder().shelf)}
        ${teasersHTML()}</div>
      <div class="footer"><button class="btn secondary" data-act="tutorial">❓ Kako igram?</button>
        <button class="btn secondary" data-act="toWho" aria-label="Kdo igra?">👥</button>
        <span class="grow"></span><button class="btn secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>`;
  },

  board() {
    const f = FILES.find(x => x.id === S.file);
    const cases = casesIn(S.file);
    const done = cases.filter(isSolved).length;
    const p = profile();
    const soon = f.soon || 0;
    const letter = letterDue(S.file);
    return `<div class="screen">
      <div class="board-head"><span class="q">${f.icon} ${esc(f.title)}</span>
        <span class="count">✔ ${done} / ${cases.length + soon}</span></div>
      ${fileDone(S.file) ? `<div class="trophy">🏅 Pustolovščina rešena! Bravo, ${esc(detName(p))}!${f.book ? ' <button class="btn secondary" data-act="openBook">📖 Moja knjiga</button>' : f.cup ? ' <button class="btn secondary" data-act="openBook">🏆 Moj pokal</button>' : ''}</div>` : ''}
      ${S.toast && S.toast !== 'soon' ? `<div class="toast">${esc(S.toast)}</div>` : ''}
      ${soon && done === cases.length ? `<div class="waiting ${S.toast === 'soon' ? 'flash' : ''}"><span>⏳ Primer ${cases.length + 1} pride kmalu! Medtem reši druge pustolovščine.</span>
        <button class="btn" data-act="toFiles">🗺️ Pojdi</button></div>` : ''}
      ${f.season ? corkboard(f, cases) : ''}
      <div class="board">${cases.map(c => {
        const solved = isSolved(c), locked = isLocked(c);
        return `<button class="folder ${solved ? 'solved' : ''} ${locked ? 'locked' : ''} ${c.final ? 'final' : ''} ${c.no === S.suggest ? 'suggest' : ''}" data-act="${locked ? 'lockedCase' : 'openCase'}" data-no="${c.no}">
          <span class="no">${c.no}</span>${solved ? '<span class="tick">✔</span>' : ''}
          <span class="stk">${locked ? '🔒' : c.sticker}</span>${c.final ? '<span class="place">⭐ Veliki primer</span>' : c.place ? `<span class="place">${esc(c.place)}</span>` : ''}
          <span class="fq">${!locked ? esc(c.question) : isSeason(c) ? `Odpre se po primeru ${c.no - 1}.` : 'Odpre se, ko rešiš ostale primere.'}</span>
          <span class="lvl">${'🔍'.repeat(c.rung)}</span></button>`;
      }).join('')}${Array.from({ length: soon }, (_, i) => `<button class="folder soon" data-act="soonCase">
          <span class="no">${cases.length + i + 1}</span><span class="stk">❓</span><span class="fq">Kmalu nov primer</span></button>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="toFiles">← 🗺️ Pustolovščine</button>
        <span class="grow"></span><button class="btn secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>${letter ? letterHTML(letter) : ''}`;
  },

  // Step 1 of a step case: the phone rings, the client asks for help.
  call() {
    const c = S.c, r = S.run, cl = CHARACTERS[c.client];
    if (!r.answered) {
      return `<div class="screen center call">
        <div class="case-no">Primer ${c.no}${c.place ? ' · ' + esc(c.place) : ''}</div>
        <div class="phone">📞</div>
        <h1>Zvoni!</h1>
        <div class="suspect">${avatar(c.client)}<span>${esc(cl.name)}</span></div>
        <button class="btn big" data-act="answer">Javi se</button>
        ${backTarget() === 'stay' ? '' : '<button class="btn secondary" data-act="back">← Nazaj</button>'}
      </div>`;
    }
    return `<div class="screen center call">
      <div class="caller">${avatar(c.client, 'sm')}<div class="bubble">${c.call.map((t, i) =>
        `<div class="row" data-act="say" data-clip="${c.id}_c${i + 1}">${esc(t)}</div>`).join('')}</div></div>
      ${qbar(c.question, c.id + '_q', 'big')}
      <div class="suspects mini">${c.suspects.map(id => suspectCard(id, false)).join('')}</div>
      ${c.film ? filmHTML(c, r) : `<button class="btn big" data-act="toScene">${stepLabel()}</button>`}
    </div>`;
  },

  // A puzzle step: 🔤 word search. Tap the first letter, then the last; the found words name
  // the places to search in the scene.
  // A puzzle step: 🔐 code lock. Turn the wheels ▲▼, then »Odpri«; nothing checks while turning.
  lock() {
    const c = S.c, r = S.run, k = c.lock;
    r.wheels = r.wheels || [...k.code].map(() => 0);
    return `<div class="screen center lockstep ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      <div class="row wnote" data-act="brief">🚪 ${esc(k.note)}</div>
      <div class="padlock ${r.open ? 'open' : ''}">
        <div class="shackle"></div>
        <div class="lockbody">${r.wheels.map((d, i) => `<div class="wheel">
          <button class="wbtn" data-act="wheel" data-i="${i}" data-d="1" aria-label="gor" ${r.open ? 'disabled' : ''}>▲</button>
          <span class="digit">${d}</span>
          <button class="wbtn" data-act="wheel" data-i="${i}" data-d="-1" aria-label="dol" ${r.open ? 'disabled' : ''}>▼</button></div>`).join('')}</div>
      </div>
      ${r.open ? `<div class="toast good">🔓 ${UI_AUDIO.lockOpen}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        ${r.open ? `<button class="btn big" data-act="toScene">${stepLabel()}</button>` : '<button class="btn big" data-act="tryLock">Odpri 🔓</button>'}</div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // A puzzle step: 🕐 timeline. Tap a card to put it in the next slot (tap it again to take it
  // back), then »Preveri«: the right ones stay, the others go back. From the 4th check on the
  // card for the first empty slot pulses.
  order() {
    const c = S.c, r = S.run, o = c.order, n = o.cards.length;
    if (!r.deck) {
      do r.deck = o.cards.map((_, i) => i).sort(() => Math.random() - .5); while (r.deck.every((k, i) => k === i));
      r.slots = Array(n).fill(null);
    }
    const placed = new Set(r.slots.filter(k => k !== null)), full = placed.size === n;
    const next = r.owrong >= 4 && !r.ordered ? r.slots.indexOf(null) : -1;
    const card = (k, act, more) => `<button class="tcard ${k === next ? 'pulse' : ''}" data-act="${act}" ${more}><span class="te">${o.cards[k][0]}</span><span>${esc(o.cards[k][1])}</span></button>`;
    return `<div class="screen center orderstep ${o.cards.length > 4 ? 'many' : ''} ${r.ordered ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      <div class="row wnote" data-act="brief">📸 ${esc(o.note)}</div>
      <div class="twrap ${placed.size ? 'started' : ''}">
        <ol class="tslots">${r.slots.map((k, i) => `<li class="tslot ${k === null ? 'empty' : ''} ${r.ordered || r.good.includes(i) ? 'good' : ''}">
          <span class="tn">${i + 1}</span>${k === null ? '' : card(k, 'unplace', `data-i="${i}" ${r.ordered ? 'disabled' : ''}`)}</li>`).join('')}</ol>
        ${full ? '' : `<div class="tdeck">${r.deck.filter(k => !placed.has(k)).map(k => card(k, 'place', `data-k="${k}"`)).join('')}</div>`}
      </div>
      ${r.ordered ? `<div class="toast good" data-act="say" data-clip="${c.id}_od">✅ ${esc(o.done)}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        ${r.ordered ? `<button class="btn big" data-act="toScene">${stepLabel()}</button>` : `<button class="btn big" data-act="checkOrder" ${full ? '' : 'disabled'}>Preveri ✔</button>`}</div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  words() {
    const c = S.c, r = S.run, w = c.words, spots = wordSpots(w);
    const done = r.words.length === w.find.length;
    const next = w.find.map(f => f[1]).find(x => !r.words.includes(x));
    const look = !done && r.wwrong >= 4 ? spots[next] : null;
    const line = look ? (look.down ? (i) => i % look.n === look.cells[0] % look.n : (i) => Math.floor(i / look.n) === Math.floor(look.cells[0] / look.n)) : () => false;
    const ends = look && r.wwrong >= 6 ? [look.cells[0], look.cells[look.cells.length - 1]] : [];
    const got = new Set(r.words.flatMap(x => spots[x].cells));
    const letters = w.grid.flatMap(row => [...row]);
    // the geslo: once every word is found, the letters left over glow and spell a sentence, in order
    const geslo = done && w.geslo;
    // riddles: the list shows a riddle and a dash per letter; the word shows only when found
    const riddles = w.find.every(f => f[2]);
    let k = 0;
    const strip = geslo && `<div class="geslo">${sent(w.geslo).text.toUpperCase().split(' ').map(x => `<span class="gw">${[...x].map(ch =>
      /\p{L}/u.test(ch) ? `<span class="gl" style="animation-delay:${k++ * 80}ms">${ch}</span>` : `<span>${esc(ch)}</span>`).join('')}</span>`).join('')}${spk(c.id + '_' + w.geslo)}</div>`;
    let j = 0;
    return `<div class="screen scene wordsearch ${geslo ? 'gesloed' : ''} ${riddles ? 'riddled' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      <div class="row wnote" data-act="brief">📃 ${esc(w.note)}</div>
      <div class="wwrap">
        <div class="wgrid" style="--n:${[...w.grid[0]].length}">${letters.map((ch, i) => `<button class="wcell
          ${got.has(i) ? 'got' : geslo ? 'left' : ''} ${r.wsel === i ? 'sel' : ''} ${line(i) ? 'hl' : ''} ${ends.includes(i) ? 'pulse' : ''}" data-act="wordTap" data-i="${i}"
          ${geslo && !got.has(i) ? `style="animation-delay:${j++ * 80}ms"` : ''}>${ch}</button>`).join('')}</div>
        ${strip || (riddles ? `<div class="wlist riddles">${w.find.map(([e, x, q], i) => `<div class="wword riddle ${r.words.includes(x) ? 'got' : ''}" data-act="say" data-clip="${c.id}_wc${i + 1}">
          <span class="wq">${esc(q)}</span><span class="wd">${r.words.includes(x) ? `${e} ${x}` : [...x].map(() => '_').join(' ')}</span></div>`).join('')}</div>`
          : `<div class="wlist">${w.find.map(([e, x]) => `<span class="wword ${r.words.includes(x) ? 'got' : ''}">${e} ${x}</span>`).join('')}</div>`)}
      </div>
      ${geslo ? `<div class="toast good">🔤 ${UI_AUDIO.geslo}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="grow"></span><button class="btn big" data-act="toScene" ${done ? '' : 'disabled'}>${stepLabel()}</button></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // A puzzle step: ✉️ coded note. The ringed cell takes the tapped letter; a right letter fills every
  // cell with its symbol. The key may hide one pair (?) that the word gives away; extra tiles are decoys.
  cipher() {
    const c = S.c, r = S.run, k = c.cipher, words = cipherCells(k), flat = words.flat();
    const done = flat.every(x => !x.e || r.cgot.includes(x.ch));
    const open = (i) => flat[i] && flat[i].e && !r.cgot.includes(flat[i].ch);
    r.cring = done ? null : open(r.cring) ? r.cring : flat.findIndex((x, i) => open(i));
    const want = done ? null : flat[r.cring];
    const tiles = [...new Set([...flat.filter(x => x.e).map(x => x.ch), ...(k.extra || [])])].sort((a, b) => a.localeCompare(b, 'sl'));
    const lit = want && r.cwrong >= 4 && want.e !== k.missing ? want.e : null;
    const pulse = want && (r.cwrong >= 6 || (want.e === k.missing && r.cmiss >= 3)) ? want.ch : null;
    let i = 0;
    const msg = words.map(w => `<span class="cword">${w.map(x => {
      const n = i++;
      return x.e ? `<button class="ccell ${r.cgot.includes(x.ch) ? 'got' : ''} ${n === r.cring ? 'ring' : ''}" data-act="cipherCell" data-i="${n}"><span class="cs">${x.e}</span><span class="cl">${r.cgot.includes(x.ch) ? x.ch : ''}</span></button>`
        : `<span class="cplain">${esc(x.ch)}</span>`;
    }).join('')}</span>`).join('');
    return `<div class="screen center cipherstep ${done ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      <div class="row wnote" data-act="brief">✉️ ${esc(k.note)}</div>
      <div class="ckey">${Object.entries(k.key).map(([e, l]) => `<span class="cchip ${e === lit ? 'hl' : ''}"><span>${e}</span><b>${e === k.missing ? '?' : l}</b></span>`).join('')}</div>
      <div class="cmsg">${msg}</div>
      ${done ? `<div class="row cdone" data-act="listenClue" data-sid="${k.gives}">📃 ${sayHTML(sent(k.gives))}</div>`
        : `<div class="ctiles">${tiles.map(l => `<button class="ctile ${l === pulse ? 'pulse' : ''}" data-act="cipherTile" data-l="${l}" ${r.cgot.includes(l) ? 'disabled' : ''}>${l}</button>`).join('')}</div>`}
      ${done ? `<div class="toast good">✅ ${UI_AUDIO.cipherDone}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        <button class="btn big" data-act="toScene" ${done ? '' : 'disabled'}>${stepLabel()}</button></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // A puzzle step: 📜 torn note. Like the timeline (place, unplace, checkOrder), but the strips make one
  // sentence along a line; when it is whole it goes into the pocket.
  torn() {
    const c = S.c, r = S.run, t = c.torn, n = t.parts.length;
    if (!r.deck) {
      do r.deck = t.parts.map((_, i) => i).sort(() => Math.random() - .5); while (r.deck.every((k, i) => k === i));
      r.slots = Array(n).fill(null);
    }
    const placed = new Set(r.slots.filter(k => k !== null)), full = placed.size === n;
    const next = r.owrong >= 4 && !r.ordered ? r.slots.indexOf(null) : -1;
    const strip = (k, act, more) => `<button class="strip ${k === next ? 'pulse' : ''}" data-act="${act}" ${more}>${esc(t.parts[k])}</button>`;
    return `<div class="screen center tornstep ${r.ordered ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      <div class="row wnote" data-act="brief">📜 ${esc(t.note)}</div>
      ${r.ordered ? `<div class="row tdone" data-act="listenClue" data-sid="${t.gives}">🩹 ${sayHTML(sent(t.gives))}</div>`
        : `<div class="pslots">${r.slots.map((k, i) => `<span class="pslot ${k === null ? 'empty' : ''} ${r.good.includes(i) ? 'good' : ''}">${
          k === null ? i + 1 : strip(k, 'unplace', `data-i="${i}"`)}</span>`).join('')}</div>
        ${full ? '' : `<div class="pdeck">${r.deck.filter(k => !placed.has(k)).map(k => strip(k, 'place', `data-k="${k}"`)).join('')}</div>`}`}
      ${r.ordered ? `<div class="toast good">✅ ${UI_AUDIO.tornDone}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        ${r.ordered ? `<button class="btn big" data-act="toScene">${stepLabel()}</button>` : `<button class="btn big" data-act="checkOrder" ${full ? '' : 'disabled'}>Preveri ✔</button>`}</div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // ❗ UGOVOR: tap a claim (💬), then the sentence that shows it isn't true. The stamp slams onto the
  // claim, the liar blushes and tells the truth, which goes into the pocket. Then on to solve.
  lie() {
    const c = S.c, r = S.run, L = c.lie;
    if (r.lcoach === undefined) r.lcoach = store.read(UGOVOR_KEY, false) ? 0 : 1;
    const breakers = new Set(L.breaks.flat()), look = !r.caught && (r.llook || r.lassisted);
    const rows = c.sentences.filter(s => !L.claims.includes(s.id) && s.id !== L.truth);
    // the claims show in a new order each time, so the lie is not always the top bubble
    if (!r.lorder) r.lorder = [...L.claims].sort(() => Math.random() - .5);
    const shown = r.caught ? [L.claim] : r.lorder;
    const stamped = r.caught && r.lphase !== 'shout';
    const bubble = (s) => {
      const liar = stamped && s.id === L.claim;
      return `<button class="claim ${!r.caught && r.lclaim === s.id ? 'selected' : ''} ${liar ? 'caught' : ''} ${r.lassisted && !r.caught && s.id === L.claim ? 'pulse' : ''}" data-act="lieClaim" data-sid="${s.id}">
        <span class="cav">${avatar(s.who, 'sm')}${liar ? `<span class="blush ${r.lphase === 'stamp' ? 'pop' : ''}">😳</span>` : ''}</span>
        <span class="ctx"><b class="who">${esc(CHARACTERS[s.who].name)} <i>💬 trdi</i></b>${names(s.text)}</span>
        ${liar ? `<span class="stamp lstamp ${r.lphase === 'stamp' ? 'slam' : ''}">${UI_AUDIO.lieStamp}</span>` : ''}</button>`;
    };
    const tr = sent(L.truth), trWho = CHARACTERS[tr.who];
    const truth = r.lphase === 'stamp' ? `<div class="msg them"><span class="mav">${trWho.animal}</span><span class="mtxt typing"><i></i><i></i><i></i></span></div>`
      : r.lphase === 'done' ? `<div class="msg them ltruth"><span class="mav">${trWho.animal}</span><span class="mtxt" data-act="listenClue" data-sid="${tr.id}">${names(unq(tr.text))}</span></div>` : '';
    const note = r.lphase === 'stamp' ? UI_AUDIO.lieTruth : r.lphase === 'done' ? UI_AUDIO.lieDone : null;
    return `<div class="screen liestep ${r.caught ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${note ? `<div class="toast lnote ${r.lphase === 'done' ? 'good' : ''}">${esc(note)}</div>` : qbarB(UI_AUDIO.lie, 'ui_lie')}
      <div class="lwrap">
        <div class="lleft"><div class="claims">${shown.map(sid => bubble(sent(sid))).join('')}</div>${truth}</div>
        <div class="rows">${rows.map(s => `<div class="row ${r.lrows.includes(s.id) ? 'selected' : ''} ${look && !breakers.has(s.id) ? 'dim' : ''}
          ${r.lassisted && !r.caught && breakers.has(s.id) && !r.lrows.includes(s.id) ? 'pulse' : ''} ${stamped && r.lbroke.includes(s.id) ? 'broke' : ''}" data-act="lieRow" data-sid="${s.id}">${sayHTML(s)}</div>`).join('')}</div>
      </div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        <button class="btn big" data-act="toScene" ${r.lphase === 'done' && r.truthOk ? '' : 'disabled'}>Vem, kdo je bil!</button></div>
    </div>${r.lphase === 'shout' ? `<div class="shout-wrap"><div class="shout">
      <div class="row" data-act="say" data-clip="ui_lieShout">${esc(UI_AUDIO.lieShout)}</div>
      <button class="btn ugovor" data-act="lieShout"><span>❕</span>UGOVOR!</button></div></div>` : ''}${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // 🧭 Preveri sled: each pointing clue is a card with an arrow to a face. The child taps a clue, then the
  // sentence that says why it doesn't count: the card flips, »NAPAČNA SLED!« lands and the arrow bends away.
  herring() {
    const c = S.c, r = S.run, H = c.herring;
    const wrong = Object.keys(H.explains), done = wrong.every(x => r.hdone.includes(x));
    const expl = new Set(Object.values(H.explains).flat(2));
    const look = !done && (r.hlook || r.hassisted);
    const rows = c.sentences.filter(s => !H.clues.includes(s.id));
    // the clue cards show in a new order each time, so the misleading one is not always on top
    if (!r.horder) r.horder = [...H.clues].sort(() => Math.random() - .5);
    const card = (s) => {
      const flipped = r.hdone.includes(s.id), who = H.points[s.id];
      const back = flipped && r.hby[s.id].map(sent);
      return `<button class="hclue ${r.hclue === s.id && !flipped ? 'selected' : ''} ${flipped ? 'flipped' : ''} ${r.hjust === s.id ? 'flip' : ''}
        ${r.hassisted && !flipped && wrong.includes(s.id) && (!r.hclue || r.hclue === s.id) ? 'pulse' : ''}" data-act="herClue" data-sid="${s.id}">
        <span class="htxt">${flipped ? back.map(b => names(unq(b.text))).join(' ') : names(s.text)}</span>
        <span class="harrow ${flipped ? 'bent' : ''}">👉</span><span class="hface">${avatar(who, 'sm')}${flipped ? '<span class="phew">😮‍💨</span>' : ''}</span>
        ${flipped ? `<span class="stamp hstamp ${r.hjust === s.id ? 'slam' : ''}">${UI_AUDIO.herringStamp}</span>` : ''}</button>`;
    };
    return `<div class="screen herringstep ${done ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbarB(UI_AUDIO.herring, 'ui_herring')}
      <div class="lwrap">
        <div class="lleft"><div class="hclues">${r.horder.map(sid => card(sent(sid))).join('')}</div></div>
        <div class="rows">${rows.map(s => `<div class="row ${r.hrows.includes(s.id) ? 'selected' : ''} ${look && !expl.has(s.id) ? 'dim' : ''}
          ${r.hassisted && !done && expl.has(s.id) && !Object.values(r.hby).flat().includes(s.id) ? 'pulse' : ''}" data-act="herRow" data-sid="${s.id}">${sayHTML(s)}</div>`).join('')}</div>
      </div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        <button class="btn big" data-act="toScene" ${done ? '' : 'disabled'}>${stepLabel()}</button></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // Step 2 (instead of the scene): question the suspects. Every question gives one answer.
  ask() {
    const c = S.c, r = S.run;
    const mine = own('ask'), all = mine.length;
    const got = mine.filter(s => r.found.includes(s.id)).length, done = got === all;
    const qs = r.who ? mine.filter(s => s.who === r.who) : [];
    const chat = r.found.map(sent).filter(s => s.ask && s.who === r.who);
    const open = qs.filter(s => !r.found.includes(s.id));
    const me = profile() ? profile().av : '🕵️';
    return `<div class="screen scene ask">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbarB(done ? UI_AUDIO[doneKey('askDone')] : UI_AUDIO.ask, done ? 'ui_' + doneKey('askDone') : 'ui_ask')}
      <div class="suspects mini">${[...c.suspects, ...(c.witnesses || [])].map(id => {
        const left = mine.filter(s => s.who === id && !r.found.includes(s.id)).length, eye = (c.witnesses || []).includes(id);
        return `<button class="suspect ${r.who === id ? 'on' : ''} ${eye ? 'witness' : ''}" data-act="askWho" data-id="${id}">
          ${avatar(id)}<span>${CHARACTERS[id].name}</span>${eye ? '<span class="eye" title="priča">👁️</span>' : ''}${left ? '' : '<span class="ok">✔</span>'}</button>`;
      }).join('')}</div>
      <div class="chat">${r.who ? `<div class="chat-head">💬 ${CHARACTERS[r.who].name}</div>` : ''}${chat.map(s => `
        <div class="msg me"><span class="mtxt">${esc(s.ask)}</span><span class="mav">${me}</span></div>
        ${r.typing === s.id ? `<div class="msg them"><span class="mav">${CHARACTERS[s.who].animal}</span><span class="mtxt typing"><i></i><i></i><i></i></span></div>`
          : `<div class="msg them"><span class="mav">${CHARACTERS[s.who].animal}</span><span class="mtxt" data-act="listenClue" data-sid="${s.id}">${names(unq(s.text))}</span></div>`}`).join('')}
      </div>
      ${open.length && !r.typing ? `<div class="qs">${open.map(s => `<button class="qbtn" data-act="askQ" data-sid="${s.id}">${esc(s.ask)}</button>`).join('')}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="pocket-count">👝 ${got} / ${all}</span>
        <span class="grow"></span><button class="btn big" data-act="toSolve" ${done ? '' : 'disabled'}>${done ? stepLabel() : leftLabel(all - got, ['vprašanje', 'vprašanji', 'vprašanja', 'vprašanj'], '💬')}</button></div>
    </div>`;
  },

  // ⏰ Kdaj?: the deed's time is the middle band. The child taps a sentence, then PREJ, TAKRAT or POTEM; one
  // from before or after gets the referee's yellow card »NAPAČEN ČAS!« and won't count in solve.
  when() {
    const c = S.c, r = S.run, W = c.when, ids = Object.keys(W.cards);
    // the cards show in a new order each time, so the one that counts is not always first
    if (!r.worder) r.worder = [...ids].sort(() => Math.random() - .5);
    const open = r.worder.filter(x => !r.wplaced[x]), done = !open.length;
    const look = !done && (r.wlook || r.wassisted);
    const target = r.wassisted && !done ? r.wcard || open[0] : null;
    const card = (sid) => {
      const s = sent(sid), at = r.wplaced[sid];
      return `<div class="row wcard ${r.wcard === sid ? 'selected' : ''} ${at ? 'put ' + at : ''} ${r.wjust === sid ? 'flip' : ''} ${target === sid && !r.wcard ? 'pulse' : ''}"
        data-act="whenCard" data-sid="${sid}">${look && !at ? timeMark(sayHTML(s)) : sayHTML(s)}${at === 'during' ? `<span class="wok">${UI_AUDIO.whenCounts}</span>`
        : at ? `<span class="ycard">🟨</span><span class="stamp wstamp ${r.wjust === sid ? 'slam' : ''}">${UI_AUDIO.whenStamp}</span>` : ''}</div>`;
    };
    const band = (k, icon) => `<div class="wband ${k} ${r.wcard ? 'armed' : ''} ${target && r.wcard === target && W.cards[target] === k ? 'pulse' : ''}" data-act="whenBand" data-band="${k}">
      <span class="wlab">${icon} ${UI_AUDIO['when_' + k]}${k === 'during' ? ` · <span class="wdeed">${esc(W.deed)}</span>` : ''}</span>
      ${r.worder.filter(x => r.wplaced[x] === k).map(card).join('')}</div>`;
    return `<div class="screen whenstep ${done ? 'done' : ''} ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbarB(UI_AUDIO.when, 'ui_when')}
      <div class="kdwrap">
        <div class="wbands">${band('before', '⏪')}${band('during', '⏰')}${band('after', '⏩')}</div>
        ${done ? '' : `<div class="wdeck">${open.map(card).join('')}</div>`}
      </div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span>
        <button class="btn big" data-act="toScene" ${done ? '' : 'disabled'}>${stepLabel()}</button></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // Step 2: search the scene. Every object hides one sentence; the dark one needs the torch, a pressed page the pencil.
  scene() {
    const c = S.c, r = S.run;
    const mine = own('scene'), all = mine.length;
    const found = r.found.filter(sid => stepOf(sent(sid)) === 'scene'), done = found.length === all;
    return `<div class="screen scene">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbarB(done ? UI_AUDIO[doneKey('sceneDone')] : UI_AUDIO.scene, done ? 'ui_' + doneKey('sceneDone') : 'ui_scene')}
      <div class="toolbar-kid">
        <button class="tool ${r.torch ? 'on' : ''}" data-act="torch">🔦 Svetilka</button>
        ${mine.some(s => s.rub) ? `<button class="tool ${r.pencil ? 'on' : r.rubMiss >= 2 ? 'pulse' : ''}" data-act="pencil">🖍️ Svinčnik</button>` : ''}
        <span class="pocket-count">👝 ${found.length} / ${all}</span>
      </div>
      <div class="objs ${r.torch ? 'torch' : ''} ${r.pencil ? 'pencil' : ''}">${mine.map(s => {
        const got = r.found.includes(s.id);
        return `<button class="obj ${got ? 'got' : ''} ${s.dark && !got ? 'dark' : ''} ${s.rub && !got ? 'rub' : ''} ${r.rubbing === s.id ? 'rubbing' : ''} ${!got && all - found.length <= 2 ? 'pulse' : ''}" data-act="openClue" data-sid="${s.id}">
          <span class="oe">${s.dark && !got ? '🌑' : s.obj}</span><span class="ol">${esc(s.label)}</span>${got ? '<span class="ok">✔</span>' : ''}</button>`;
      }).join('')}</div>
      <div class="rows pocket">${found.slice().reverse().map((sid, i) =>
        `<div class="row ${i === 0 && r.fresh ? 'fresh' : ''} ${sent(sid).rub ? 'rubbed' : ''}" data-act="listenClue" data-sid="${sid}">${sayHTML(sent(sid))}</div>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="grow"></span><button class="btn big" data-act="toSolve" ${done ? '' : 'disabled'}>${done ? stepLabel() : leftLabel(all - found.length, ['stvar', 'stvari', 'stvari', 'stvari'], '👆')}</button></div>
    </div>`;
  },

  // Step 3: cross off everyone with an alibi (sentence + face), then prove it.
  solve() {
    const c = S.c, r = S.run;
    const left = c.suspects.filter(id => !r.crossed.includes(id));
    const t = r.assisted || r.highlight ? elimTarget() : null;
    return `<div class="screen solve ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${left.length === 1 ? qbarB(UI_AUDIO.lastOne, 'ui_lastOne') : qbarB(UI_AUDIO.solve, 'ui_solve')}
      <div class="suspects mini">${c.suspects.map(id => {
        const x = r.crossed.includes(id);
        return `<button class="suspect ${x ? 'crossed' : ''} ${r.assisted && t && t.who === id ? 'pulse' : ''}" data-act="cross" data-id="${id}">
          ${avatar(id)}<span>${CHARACTERS[id].name}</span>${x ? '<span class="xmark">✖</span>' : ''}</button>`;
      }).join('')}</div>
      <div class="rows">${c.sentences.map(s => `<div class="row ${r.sel === s.id ? 'selected' : ''} ${r.proofs.includes(s.id) ? 'proof' : ''} ${r.used.includes(s.id) ? 'used' : ''}
        ${t && t.sid !== s.id ? 'dim' : ''} ${r.assisted && t && t.sid === s.id ? 'pulse' : ''}" data-act="pickClue" data-sid="${s.id}">${sayHTML(s)}${
        c.lie && r.caught && s.id === c.lie.claim ? '<span class="ltag">UGOVOR!</span>' : c.lie && s.id === c.lie.truth ? '<span class="ltag truth">✨</span>'
          : r.hdone.includes(s.id) ? '<span class="ltag herr">NAPAČNA SLED</span>' : r.wplaced[s.id] && wrongTime(s) ? '<span class="ltag ytag">🟨</span>' : ''}</div>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  intro() {
    const c = S.c;
    return `<div class="screen center">
      <div class="case-no">${S.c.no ? 'Primer ' + S.c.no : '🎓 Vaja'}${c.place ? ' · ' + esc(c.place) : ''}</div>
      <div class="sticker">${c.sticker}</div>
      ${qbar(c.question, c.id + '_q', 'big')}
      <div class="suspects">${c.suspects.map(id => suspectCard(id, false)).join('')}</div>
      <button class="btn big" data-act="toStory">Beri zgodbo</button>
      ${backTarget() === 'stay' ? '' : '<button class="btn secondary" data-act="back">← Nazaj</button>'}
    </div>`;
  },

  story() {
    return `<div class="screen">
      ${qbar(S.c.question, S.c.id + '_q')}
      <div class="rows">${rowsHTML('listen')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="grow"></span><button class="btn big" data-act="know">Vem, kdo je bil!</button></div>
    </div>`;
  },

  accuse() {
    return `<div class="screen center">
      ${qbar(UI_AUDIO.accuse, 'ui_accuse', 'big')}
      <div class="suspects">${S.c.suspects.map(id => suspectCard(id, true)).join('')}</div>
      <button class="btn secondary" data-act="reread">📖 Še enkrat preberi</button>
    </div>`;
  },

  evidence() {
    const r = S.run;
    return `<div class="screen ${r.hint ? 'locked' : ''}">
      <div class="qbar">${avatar(r.suspect, 'sm')}${need() === 2
        ? `<span class="q">${UI_AUDIO.evidencePair}</span>${spk('ui_evidencePair')}`
        : `<span class="q">${UI_AUDIO.evidence}</span>${spk('ui_evidence')}`}</div>
      <div class="rows">${rowsHTML('select')}</div>
      <div class="footer">${evFooter()}</div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // Solved: a newspaper with the case closed, the culprit's excuse, the explanation, and for a
  // season the new card for the corkboard.
  reveal() {
    const c = S.c, r = S.run, p = profile();
    const f = FILES.find(x => x.id === c.file);
    const me = p && S.orderMode === 'board';
    const sub = me ? (c.caught ? `${detName()} je ${ga('ujel', 'ujela')} ${c.caught}!` : `Bravo, ${detName()}!`) : '';
    const card = c.card && sent(c.card.sid);
    // the season's mystery guest shows its real face, and the child's guess is checked
    const real = CHARACTERS[c.culprit].real, who = { ...CHARACTERS[c.culprit], ...real };
    return `<div class="screen center reveal ${c.final && f && f.answer ? 'final' : ''}">
      <div class="paper">
        <div class="mast">${esc(f ? f.paper : 'DETEKTIVSKE NOVICE')}</div>
        <div class="qbar"><span class="stamp slam">${UI_AUDIO.solved}</span>${spk('ui_solved')}</div>
        <div class="pic">${me ? `<span class="avatar sm" style="background:#fff">${p.av}</span>` : ''}${real
          ? `<span class="unmask">${avatar(c.culprit, 'sm mask')}${avatar(c.culprit, 'sm caught real', who)}</span>` : avatar(c.culprit, 'sm caught')}<b>${esc(who.name)}</b></div>
        ${me ? `<div class="kudos">${esc(sub)}</div>` : ''}
      </div>
      ${r && r.rankUp ? `<div class="rankup">${ga('Napredoval', 'Napredovala')} si! Zdaj si ${esc(rankName(r.rankUp))}.</div>` : ''}
      ${c.final && f && f.answer ? answerHTML(f) : ''}
      ${c.excuse ? `<div class="excuse" data-act="say" data-clip="${c.id}_x">${avatar(c.culprit, 'sm', who)}<span>»${esc(c.excuse)}«</span></div>` : ''}
      <div class="rows reveal-rows">${c.reveal.map((t, i) => `<div class="row" data-act="say" data-clip="${c.id}_r${i + 1}">${names(t)}</div>`).join('')}</div>
      ${card ? `<div class="pinned" data-act="say" data-clip="ui_newCard"><span class="pin">📌</span><span class="ci">${c.card.icon}</span>
        <span><b>${UI_AUDIO.newCard}</b><br>${esc(card.text)}</span></div>` : `<div class="sticker">${c.sticker}</div>`}
      <button class="btn big" data-act="next">Naprej</button>
    </div>`;
  },

  // After the final of a season with a book: the author asks to write about the detective, and on
  // »Da« the cover shows the child's ID picture and name (from the ID card, on this device only).
  book() {
    const c = S.c, f = FILES.find(x => x.id === c.file), p = profile() || {};
    const yes = S.run && S.run.bookYes;
    // 🏆 the cup (a season with cup instead of a book): the cloth comes off, the names light up, the child's last
    if (f.cup) return `<div class="screen center bookstep">
      <div class="caller">${avatar(c.culprit, 'sm')}<div class="bubble"><div class="row" data-act="say" data-clip="${f.id}_${yes ? 'uc' : 'uq'}">${esc(yes ? f.cup.cheer : f.cup.q)}</div></div></div>
      ${yes ? `<div class="cup"><span class="cupi">🏆</span>${[...f.cup.names, (p.name || detName()).toUpperCase()].map((n, i, a) =>
          `<span class="cname ${i === a.length - 1 ? 'me' : ''}" style="animation-delay:${.4 + i * .6}s">${i === a.length - 1 ? '⭐ ' : ''}${esc(n)}</span>`).join('')}</div>
        <button class="btn big" data-act="next">Naprej</button>`
        : `<div class="cup"><span class="cupi" style="filter:grayscale(1) brightness(.6)">🏆</span><span class="cloth">🧺 ${esc(f.cup.cloth)}</span></div>
          <button class="btn big" data-act="bookYes">${esc(f.cup.btn)}</button>`}
    </div>`;
    return `<div class="screen center bookstep">
      <div class="caller">${avatar(c.culprit, 'sm')}<div class="bubble"><div class="row" data-act="say" data-clip="${f.id}_bq">${esc(f.book.q)}</div></div></div>
      ${yes ? `<div class="bcover"><span class="bstar">⭐</span><span class="bav">${p.av || '🕵️'}</span>
          <b class="btitle">${esc(detName())}</b><span class="bsub">${esc(f.book.title)}</span><span class="bby">${esc(f.book.by)}</span></div>
        <button class="btn big" data-act="next">Naprej</button>`
        : `<div class="sticker">📖</div><button class="btn big" data-act="bookYes">Da! 📖</button>`}
    </div>`;
  },

  more() {
    return `<div class="screen center">
      ${qbar(UI_AUDIO.more, 'ui_more', 'big')}
      <div class="seg"><button class="btn big" data-act="moreYes">Da!</button>
      <button class="btn big secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>`;
  },

  soon() {
    return `<div class="screen center">
      <div class="sticker">🚧</div>
      ${qbar(UI_AUDIO.soon, 'ui_soon', 'big')}
      <button class="btn big" data-act="toThanks">V redu</button>
    </div>`;
  },

  thanks() {
    return `<div class="screen center">
      <div class="sticker">🏅</div>
      ${qbar(UI_AUDIO.thanks, 'ui_thanks', 'big')}
      ${KID_MODE ? '<button class="btn secondary" data-act="backToBoard">🗂️ Nazaj na primere</button>' : ''}
    </div>`;
  },

  debrief() {
    const sessions = analyzeAll();
    const counted = sessions.filter(s => !s.pilot);
    return `<div class="screen adult">
      <div class="toolbar">
        <h1>Pregled</h1><span class="grow"></span>
        ${S.session && S.resume && !S.ended ? '<button class="btn" data-act="resume">Nadaljuj igro</button>' : ''}
        <button class="btn secondary" data-act="toSetup">Nova seja</button>
        <button class="btn secondary" data-act="exportLog">Izvozi JSON</button>
        <button class="btn danger" data-act="wipe">Izbriši vse</button>
      </div>
      ${storeOk ? '' : '<p class="warn-text">Shranjevanje na napravo ne deluje – takoj izvozi JSON.</p>'}
      <h2>Povzetek po starosti</h2>
      ${['6-7', '8-9'].map(age => groupHTML(age, counted.filter(s => s.age === age))).join('')}
      <h2>Seje (${sessions.length})</h2>
      ${sessions.slice().reverse().map(sessionHTML).join('') || '<p class="muted">Ni podatkov.</p>'}
      <p class="muted">Ponovno branje = ponovno poslušanje stavka, pomik nazaj gor ali »Še enkrat preberi«.
      Ugibanje = potrditev manj kot 4 s po vstopu/namigu ali 3 potrditve v 15 s.
      Izid: rešeno = največ 1 namig; s pomočjo = 2–3 namigi; vodeno = 4. napačen poskus.</p>
    </div>`;
  },
};

// ---------------------------------------------------------------------------
// Actions (all taps go through data-act)
// ---------------------------------------------------------------------------
const ACTIONS = {
  age(el) { S.age = el.dataset.age; render(); },
  pilot(el) { S.pilot = el.checked; },
  startAt(el) { S.startAt = Number(el.dataset.n); render(); },
  orderMode(el) { S.orderMode = el.dataset.mode; render(); },
  resetBoard() {
    // clears the detective who played last; the other detectives on this device stay
    if (!confirm('Nov otrok: počistim zadnjo izkaznico in njene kljukice? Drugi detektivi in zapisi v pregledu ostanejo.')) return;
    store.write(PLAYED_KEY, []);
    store.write(TUT_KEY, false);   // a new child also gets the practice case
    store.write(PROFILE_KEY, null); // and makes their own ID card
    store.write(GUESS_KEY, {});
    store.write(UGOVOR_KEY, false);
    newPlayer();                    // and is a new anonymous player
    render();
  },
  openFile(el) {
    S.tut = null;
    S.file = el.dataset.file;
    S.toast = null;
    log('file_open', { file: S.file });
    toBoard();
  },
  toFiles() { S.toast = null; toHome(); },
  back() { goBack('button'); },
  // the waiting note says it already; without one (earlier cases unsolved) a toast does
  vent(el) {
    sfx('beep');
    el.classList.remove('peek');
    void el.offsetWidth;
    el.classList.add('peek');
    log('vent_tap');
  },
  soonCase() {
    const cases = casesIn(S.file);
    S.toast = cases.every(isSolved) ? 'soon' : '⏳ Ta primer še ni napisan. Pride kmalu!';
    render();
  },
  lockedCase(el) {
    const c = caseFor(S.file, Number(el.dataset.no));

  select(el) {
    const r = S.run;
    if (r.hint) return;
    const s = sent(el.dataset.sid);
    // tap again to take a pick back; a new pick past the limit replaces the oldest
    if (r.picks.includes(s.id)) r.picks = r.picks.filter(id => id !== s.id);
    else r.picks = [...r.picks, s.id].slice(-need());
    log('evidence_select', { sentenceId: s.id, role: s.role });
    r.heard.add(s.id);

  confirm() {
    const r = S.run, c = S.c;
    if (r.picks.length !== need() || r.hint) return;
    const ss = r.picks.map(sent);
    const hits = ss.filter(x => x.role === 'evidence');
    const isEvidence = hits.length === need();
    const rightSuspect = r.suspect === c.culprit;
    const solved = isEvidence && (rightSuspect || r.assisted);
    const miss = ss.find(x => x.role !== 'evidence');
    if (S.tut) {
      // Practice: no hint ladder and no tick on the board, just a gentle nudge.
      if (solved) { go('reveal'); return; }
      r.picks = [];
      refreshRows();
      $('.footer').innerHTML = evFooter();
      S.tut.msg = 'To ni ta stavek. Poišči, kje piše, kdo je pojedel korenček.';
      coach();
      return;
    }
    log('evidence_confirm', {
      sentenceId: (miss || ss[0]).id, sentenceIds: r.picks, role: miss ? miss.role : 'evidence',
      suspectId: r.suspect, correct: solved, suspectCorrect: rightSuspect,
    });
    if (solved) {
      log('case_done', { assisted: r.assisted, wrong: r.wrong });
      markSolved(S.c);
      go('reveal');
      return;
    }
    r.wrong++;
    // a pair with one right proof keeps that one picked, so the child looks for the other
    r.picks = isEvidence ? [] : hits.map(x => x.id);
    let h;
    if (r.assisted || r.wrong >= 4) {
      if (!r.assisted) { r.assisted = true; log('assisted'); }
      h = need() === 2 ? { key: 'assist', text: UI_AUDIO.assistPair, clip: 'ui_assistPair', level: 4 }
        : { key: 'assist', text: UI_AUDIO.assist, clip: 'ui_assist', level: 4 };
    } else if (isEvidence) {
      r.badSuspect = true;
      h = { key: 'wrongSuspect', text: UI_AUDIO.wrongSuspect, clip: 'ui_wrongSuspect', level: 0 };
    } else if (hits.length) {
      h = { key: 'pairHalf', text: UI_AUDIO.pairHalf, clip: 'ui_pairHalf', level: 0 };
    } else if (miss.role === 'partial') {
      h = c.type === 'alibi' ? { key: 'partial', text: UI_AUDIO.partialAlibi, clip: 'ui_partialAlibi', level: 0 }
        : { key: 'partial', text: UI_AUDIO.partial, clip: 'ui_partial', level: 0 };
    } else {
      r.ladder = Math.min(r.ladder + 1, 3);
      h = ladderHint(r.ladder);
      if (r.ladder >= 2) r.highlight = new Set(r.ladder === 2 ? c.h2 : c.h3);
    }
    showHint(h);
  },

  // the timeline and the torn note: the right ones stay, the others go back
  checkOrder() {
    const r = S.run, c = S.c, torn = S.screen === 'torn', o = torn ? c.torn : c.order, p = c.id + (torn ? '_p' : '_o');
    if (r.hint || r.ordered || r.slots.includes(null)) return;
    const right = r.slots.map((k, i) => k === i ? i : -1).filter(i => i >= 0);
    const ok = right.length === r.slots.length;
    log(torn ? 'puzzle_torn' : 'puzzle_order', { correct: ok, right: right.length });
    if (ok) {
      r.ordered = true;
      r.note = null;
      sfx('tada');
      log('puzzle_done', { wrong: r.owrong });
      if (torn) { deliver(o.gives); render(); return; }
      render();
      return;
    }
    r.owrong++;
    r.good = right;
    r.slots = r.slots.map((k, i) => right.includes(i) ? k : null);
    sfx('nope');
    const assist = torn ? 'tornAssist' : 'orderAssist';
    const h = r.owrong === 4 ? { key: assist, text: UI_AUDIO[assist], clip: 'ui_' + assist, level: 3 }
      : r.owrong === 3 ? { key: 'h2', text: o.h2, clip: p + 'h2', level: 2 }
      : r.owrong === 2 ? { key: 'h1', text: o.h1, clip: p + 'h1', level: 1 } : null;
    if (h) { r.hint = h; log('puzzle_hint', { hint: h.key, hintLevel: h.level }); }
    else r.note = torn ? UI_AUDIO.tornNo : UI_AUDIO.orderNo;
    render();
  },
  wordTap(el) {
    const r = S.run, w = S.c.words, i = Number(el.dataset.i);
    if (r.hint || r.words.length === w.find.length) return;
    r.note = null;
    if (r.wsel === null || r.wsel === i) { r.wsel = r.wsel === i ? null : i; sfx('click'); render(); return; }
    const [a, b] = [Math.min(r.wsel, i), Math.max(r.wsel, i)];
    r.wsel = null;
    const spots = wordSpots(w);
    const word = Object.keys(spots).find(x => !r.words.includes(x) && spots[x].cells[0] === a && spots[x].cells[spots[x].cells.length - 1] === b);
    log('puzzle_word', { correct: !!word, word: word || null, ...(w.find.every(f => f[2]) ? { clue: true } : {}) });
    if (word) {
      r.words.push(word);
      if (r.words.length === w.find.length) {
        sfx('tada');
        log('puzzle_done', { wrong: r.wwrong });
        if (w.geslo) deliver(w.geslo);
      } else sfx('pop');
      render();
      return;
    }
    r.wwrong++;
    sfx('nope');
    let h = null;
    if (r.wwrong >= 6) h = { key: 'wordAssist', text: UI_AUDIO.wordAssist, clip: 'ui_wordAssist', level: 3 };
    else if (r.wwrong === 4) h = { key: 'wordLook', text: UI_AUDIO.wordLook, clip: 'ui_wordLook', level: 2 };
    else if (r.wwrong === 2) h = { key: 'h1', text: w.h1, clip: S.c.id + '_wh', level: 1 };
    if (h && r.wwrong <= 6) { r.hint = h; log('puzzle_hint', { hint: h.key, hintLevel: h.level }); }
    else r.note = UI_AUDIO.wordNo;
    render();
  },

  // ✉️ cipher: tap a cell to ring it, a tile to fill it
  cipherCell(el) {

  cipherTile(el) {
    const r = S.run, c = S.c, k = c.cipher;
    if (r.hint) return;
    const flat = cipherCells(k).flat(), want = flat[r.cring];
    if (!want || !want.e) return;
    const ok = el.dataset.l === want.ch;
    log('puzzle_cipher', { correct: ok, n: r.cgot.length });
    r.note = null;
    if (ok) {
      r.cgot.push(want.ch);
      if (flat.every(x => !x.e || r.cgot.includes(x.ch))) { sfx('tada'); log('puzzle_done', { wrong: r.cwrong }); deliver(k.gives); } else sfx('pop');
      render();
      return;
    }
    r.cwrong++;
    sfx('nope');
    // the missing pair has its own ladder: read the word (h1), the letter (h2), then the tile pulses
    let h = null;
    if (want.e === k.missing) {
      r.cmiss++;
      h = r.cmiss === 1 ? { key: 'h1', text: k.h1, clip: c.id + '_ch1', level: 1 } : r.cmiss === 2 ? { key: 'h2', text: k.h2, clip: c.id + '_ch2', level: 2 }
        : r.cmiss === 3 ? { key: 'cipherAssist', text: UI_AUDIO.cipherAssist, clip: 'ui_cipherAssist', level: 3 } : null;
    } else if (r.cwrong === 6) h = { key: 'cipherAssist', text: UI_AUDIO.cipherAssist, clip: 'ui_cipherAssist', level: 3 };
    else if (r.cwrong === 4) h = { key: 'cipherLook', text: UI_AUDIO.cipherLook, clip: 'ui_cipherLook', level: 2 };
    else if (r.cwrong === 2) h = { key: 'h1', text: k.h1, clip: c.id + '_ch1', level: 1 };
    if (h) { r.hint = h; log('puzzle_hint', { hint: h.key, hintLevel: h.level }); }
    else r.note = UI_AUDIO.cipherNo;
    render();
    const t = document.querySelector(`.ctile[data-l="${el.dataset.l}"]`);
    if (t) t.classList.add('wobble');
  },
  // ❗ UGOVOR: a claim, then the sentence(s) that break it; checked from the first sentence on
  lieClaim(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.hint || r.caught) return;
    r.lclaim = s.id;
    r.lrows = r.lrows.filter(x => S.c.lie.breaks.some(set => set.length === 2 && set.includes(x)) && s.id === S.c.lie.claim);
    r.note = null;
    if (r.lcoach === 1) r.lcoach = 2;
    sfx('click');
    render();
  },
  lieRow(el) {
    const r = S.run, c = S.c, L = c.lie, s = sent(el.dataset.sid);
    if (r.hint) return;
    if (r.caught) { play(c.id + '_' + s.id, s.text, el); return; }
    if (!r.lclaim) {
      if (L.claims.length > 1) {
        r.note = UI_AUDIO.lieClaimFirst;
        log('lie_try', { claimId: null, sentenceIds: [s.id], correct: false, kind: 'noClaim' });
        render();
        play('ui_lieClaimFirst', UI_AUDIO.lieClaimFirst);
        return;
      }
      r.lclaim = L.claims[0];
    }
    if (r.lrows.includes(s.id)) { r.lrows = r.lrows.filter(x => x !== s.id); render(); return; }
    r.lrows.push(s.id);
    if (r.lcoach) r.lcoach = 0;
    const right = r.lclaim === L.claim;
    const same = (set) => set.length === r.lrows.length && set.every(x => r.lrows.includes(x));
    const halfOf = (x) => right && L.breaks.some(set => set.length === 2 && set.includes(x));
    const hmm = (L.hmm || []).findIndex(([cl, sid]) => cl === r.lclaim && sid === s.id);
    const kind = right && L.breaks.some(same) ? 'break' : r.lrows.length === 1 && halfOf(s.id) ? 'half' : hmm >= 0 ? 'hmm' : 'both';
    log('lie_try', { claimId: r.lclaim, sentenceIds: [...r.lrows], correct: kind === 'break', kind });
    r.note = null;
    if (kind === 'break') { lieCatch(); return; }
    if (kind === 'half') { r.note = UI_AUDIO.lieHalf; render(); return; }
    if (kind === 'hmm') {
      r.lrows = r.lrows.filter(halfOf);
      r.note = L.hmm[hmm][2];
      render();
      return;
    }
    r.lwrong++;
    r.lrows = r.lrows.filter(halfOf);   // a right half of a pair stays
    sfx('nope');
    let h = null;
    if (r.lassisted || r.lwrong >= 4) {
      if (!r.lassisted) { r.lassisted = true; log('lie_assisted'); }
      r.lclaim = L.claim;
      h = { key: 'lieAssist', text: UI_AUDIO.lieAssist, clip: 'ui_lieAssist', level: 3 };
    } else if (r.lwrong === 3) {
      r.llook = true;
      r.lclaim = L.claim;
      h = { key: 'lieLook', text: UI_AUDIO.lieLook, clip: 'ui_lieLook', level: 2 };
    } else if (r.lwrong === 2) {
      h = L.h1 ? { key: 'h1', text: L.h1, clip: c.id + '_lh1', level: 1 } : { key: 'h1', text: UI_AUDIO.lieH1, clip: 'ui_lieH1', level: 1 };
    } else r.note = UI_AUDIO.lieBoth;
    if (h) { r.hint = h; log('lie_hint', { hint: h.key, hintLevel: h.level }); }
    render();
    const x = document.querySelector(`.liestep .row[data-sid="${s.id}"]`);
    if (x) x.classList.add('wobble');
  },
  lieShout() {
    store.write(UGOVOR_KEY, true);
    log('lie_shout', { first: true });
    lieStamp();
  },
  herClue(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.hint) return;
    if (r.hdone.includes(s.id)) { play(S.c.id + '_' + s.id, s.text, el); return; }
    r.hclue = s.id;

  herRow(el) {
    const r = S.run, c = S.c, H = c.herring, s = sent(el.dataset.sid);
    if (r.hint) return;
    const wrong = Object.keys(H.explains), open = wrong.filter(x => !r.hdone.includes(x));
    if (!open.length) { play(c.id + '_' + s.id, s.text, el); return; }
    if (!r.hclue || r.hdone.includes(r.hclue)) {
      if (H.clues.length > 1) {
        r.note = UI_AUDIO.herringFirst;
        log('herring_try', { clueId: null, sentenceIds: [s.id], correct: false, kind: 'noClue' });
        render();
        play('ui_herringFirst', UI_AUDIO.herringFirst);
        return;
      }
      r.hclue = H.clues[0];
    }
    if (!wrong.includes(r.hclue)) {   // the true clue (it is the proof): not a wrong try
      r.note = UI_AUDIO.herringTrue;
      log('herring_try', { clueId: r.hclue, sentenceIds: [s.id], correct: false, kind: 'true' });
      r.hclue = null;
      render();
      return;
    }
    if (r.hrows.includes(s.id)) { r.hrows = r.hrows.filter(x => x !== s.id); render(); return; }
    r.hrows.push(s.id);
    const sets = H.explains[r.hclue];
    const same = (set) => set.length === r.hrows.length && set.every(x => r.hrows.includes(x));
    const halfOf = (x) => sets.some(set => set.length === 2 && set.includes(x));
    const hmm = (H.hmm || []).findIndex(([cl, sid]) => cl === r.hclue && sid === s.id);
    const kind = sets.some(same) ? 'explain' : r.hrows.length === 1 && halfOf(s.id) ? 'half' : hmm >= 0 ? 'hmm' : 'no';
    log('herring_try', { clueId: r.hclue, sentenceIds: [...r.hrows], correct: kind === 'explain', kind });
    r.note = null;
    if (kind === 'explain') {
      const clue = r.hclue;
      r.hdone.push(clue);
      r.hby[clue] = [...r.hrows];
      r.hrows = [];
      r.hclue = null;
      r.hjust = clue;
      const all = wrong.every(x => r.hdone.includes(x));
      log('herring_done', { clueId: clue, points: H.points[clue], wrong: r.hwrong, assisted: r.hassisted, all });
      if (all) r.note = UI_AUDIO.herringDone;
      render();
      sfx('stamp');
      play('ui_herringStamp', UI_AUDIO.herringStamp);
      setTimeout(() => { if (S.run === r && r.hjust === clue) { r.hjust = null; if (S.screen === 'herring') render(); } }, 1200);
      return;
    }
    if (kind === 'half') { render(); return; }
    if (kind === 'hmm') {
      r.hrows = r.hrows.filter(halfOf);
      r.note = H.hmm[hmm][2];
      render();
      return;
    }
    r.hwrong++;
    r.hrows = r.hrows.filter(halfOf);
    sfx('nope');
    let h = null;
    if (r.hassisted || r.hwrong >= 4) {
      if (!r.hassisted) { r.hassisted = true; log('herring_assisted'); }
      h = { key: 'herringAssist', text: UI_AUDIO.herringAssist, clip: 'ui_herringAssist', level: 3 };
    } else if (r.hwrong === 3) {
      r.hlook = true;
      h = { key: 'herringLook', text: UI_AUDIO.herringLook, clip: 'ui_herringLook', level: 2 };
    } else if (r.hwrong === 2) {
      h = H.h1 ? { key: 'h1', text: H.h1, clip: c.id + '_hh1', level: 1 } : { key: 'h1', text: UI_AUDIO.herringH1, clip: 'ui_herringH1', level: 1 };
    } else r.note = UI_AUDIO.herringNo;
    if (h) { r.hint = h; log('herring_hint', { hint: h.key, hintLevel: h.level }); }
    render();
    const x = document.querySelector(`.herringstep .row[data-sid="${s.id}"]`);
    if (x) x.classList.add('wobble');
  },
  whenCard(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.hint) return;
    // with a card picked, a placed card is part of its band (a full band has little room left to tap)
    if (r.wplaced[s.id] && r.wcard) { ACTIONS.whenBand({ dataset: { band: r.wplaced[s.id] } }); return; }
    if (r.wplaced[s.id]) { play(S.c.id + '_' + s.id, s.text, el); return; }
    r.wcard = r.wcard === s.id ? null : s.id;
    r.note = null;
    sfx('click');
    render();
  },
  whenBand(el) {
    const r = S.run, c = S.c, W = c.when, band = el.dataset.band;
    if (r.hint) return;
    const open = r.worder.filter(x => !r.wplaced[x]);
    if (!open.length) return;
    if (!r.wcard) {
      if (open.length > 1) {
        r.note = UI_AUDIO.whenFirst;
        log('when_try', { sentenceId: null, band, correct: false, kind: 'noCard' });
        render();
        play('ui_whenFirst', UI_AUDIO.whenFirst);
        return;
      }
      r.wcard = open[0];
    }
    const sid = r.wcard, right = W.cards[sid] === band;
    log('when_try', { sentenceId: sid, band, correct: right, kind: right ? band : 'no' });
    r.note = null;
    if (right) {
      r.wplaced[sid] = band;
      r.wcard = null;
      r.wjust = sid;
      const all = r.worder.every(x => r.wplaced[x]);
      if (all) { r.note = UI_AUDIO.whenDone; log('when_done', { wrong: r.wmiss, assisted: r.wassisted }); }
      render();
      if (band === 'during') { sfx('pop'); play('ui_whenCounts', UI_AUDIO.whenCounts); }
      else { sfx('whistle'); play('ui_whenStamp', UI_AUDIO.whenStamp); }
      setTimeout(() => { if (S.run === r && r.wjust === sid) { r.wjust = null; if (S.screen === 'when') render(); } }, 1200);
      return;
    }
    r.wmiss++;
    sfx('nope');
    let h = null;
    if (r.wassisted || r.wmiss >= 4) {
      if (!r.wassisted) { r.wassisted = true; log('when_assisted'); }
      h = { key: 'whenAssist', text: UI_AUDIO.whenAssist, clip: 'ui_whenAssist', level: 3 };
    } else if (r.wmiss === 3) {
      r.wlook = true;
      h = { key: 'whenLook', text: UI_AUDIO.whenLook, clip: 'ui_whenLook', level: 2 };
    } else if (r.wmiss === 2) {
      h = W.h1 ? { key: 'h1', text: W.h1, clip: c.id + '_th1', level: 1 } : { key: 'h1', text: UI_AUDIO.whenH1, clip: 'ui_whenH1', level: 1 };
    } else r.note = UI_AUDIO.whenNo;
    if (h) { r.hint = h; log('when_hint', { hint: h.key, hintLevel: h.level }); }
    render();
    const x = document.querySelector(`.whenstep .wcard[data-sid="${sid}"]`);
    if (x) x.classList.add('wobble');
  },
  askWho(el) {
    const r = S.run;
    r.who = el.dataset.id;
    r.note = null;
    sfx('click');
    render();
  },
  // the question goes out, the suspect "types" for a moment, then the answer arrives
  askQ(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.typing || r.found.includes(s.id)) return;
    r.found.push(s.id);
    r.heard.add(s.id);
    r.typing = s.id;
    sfx('click');
    log('ask_q', { suspectId: s.who, sentenceId: s.id, role: s.role, n: r.found.length });
    render();
    setTimeout(() => {
      if (S.screen !== 'ask' || r.typing !== s.id) return;

      sfx('pop');

  },
  torch() {

    r.torch = !r.torch;
    r.pencil = false;
    r.note = null;

  },
  pencil() {
    const r = S.run;
    r.pencil = !r.pencil;
    r.torch = false;
    r.note = null;
    sfx('click');
    log('tool_use', { tool: 'pencil', on: r.pencil });
    render();
  },
  openClue(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.found.includes(s.id) || r.rubbing) return;
    if (s.rub && !r.pencil) {
      r.note = UI_AUDIO.rub;
      sfx('nope');
      r.rubMiss = (r.rubMiss || 0) + 1;   // the second time, the 🖍️ button pulses
      log('clue_dark', { sentenceId: s.id, tool: 'pencil' });
      render();
      play('ui_rub', UI_AUDIO.rub);
      return;
    }
    if (s.rub && !el.dataset.rubbed) {   // grey strokes sweep over the page first, then the letters come out
      r.rubbing = s.id;
      r.note = null;
      sfx('click');
      render();
      setTimeout(() => {
        if (S.run !== r || S.screen !== 'scene') return;
        r.rubbing = null;
        ACTIONS.openClue({ dataset: { sid: s.id, rubbed: '1' } });
      }, 900);
      return;
    }
    if (s.dark && !r.torch) {
      r.note = UI_AUDIO.dark;
      sfx('nope');
      log('clue_dark', { sentenceId: s.id });
      render();
      play('ui_dark', UI_AUDIO.dark);
      return;
    }
    r.found.push(s.id);
    r.fresh = true;
    r.note = own('scene').every(x => r.found.includes(x.id)) ? UI_AUDIO[doneKey('sceneDone')] : null;
    r.heard.add(s.id);
    sfx('pop');
    log('clue_open', { sentenceId: s.id, role: s.role, n: r.found.length });
    render();
  },
  listenClue(el) {
    const s = sent(el.dataset.sid);
    play(S.c.id + '_' + s.id, s.text, el);
    log('listen', { sentenceId: s.id, role: s.role });
  },
  toSolve() {
    S.run.note = null;
    S.run.fresh = false;
    go(stepNext());
  },
  pickClue(el) {
    const r = S.run;
    if (r.hint) return;
    const s = sent(el.dataset.sid);
    r.sel = r.sel === s.id ? null : s.id;
    r.note = null;
    log('evidence_select', { sentenceId: s.id, role: s.role });
    render();
  },
  // A clue + a face: an alibi crosses the suspect off, the proof + the culprit solves the case.
  cross(el) {
    const r = S.run, c = S.c, id = el.dataset.id;
    if (r.hint || r.crossed.includes(id)) return;
    if (!r.sel) {
      r.note = UI_AUDIO.pickFirst;
      render();
      play('ui_pickFirst', UI_AUDIO.pickFirst);
      return;
    }
    const s = sent(r.sel), L = c.lie, liar = liarOf();
    // the face a misleading clue points at: a 🧭 clue, or points on a sentence (the obvious suspect)
    const pointed = c.herring && c.herring.explains[s.id] ? c.herring.points[s.id] : s.points;
    const proof = s.role === 'evidence' && id === c.culprit;
    const alibi = s.role === 'clear' && s.clears === id;
    // a two-proof case: the first proof + the culprit is half of it
    const pair = c.sentences.filter(x => x.role === 'evidence').length === 2;
    const half = proof && pair && (!r.proofs.length || r.proofs.includes(s.id));
    log('evidence_confirm', { sentenceId: s.id, sentenceIds: [s.id], role: s.role, suspectId: id, correct: proof || alibi, suspectCorrect: id === c.culprit,
      kind: half ? 'half' : proof ? 'proof' : 'cross', ...(liar && id === liar ? { liar: true } : {}), ...(wrongTime(s) ? { wrongTime: true } : {}), ...(pointed && id === pointed ? { obvious: true } : {}) });
    r.sel = null;
    // gentle notes, not counted: a misleading clue (or what explains it) against its face, a lead against the
    // culprit, and in a case with a true 🧭 clue the proof before everyone else is crossed off
    const H = c.herring;
    const needCross = proof && H && H.clues.some(x => !H.explains[x]) && c.suspects.some(x => x !== c.culprit && !r.crossed.includes(x));
    const soft = needCross ? { key: 'crossFirst', text: UI_AUDIO.crossFirst, clip: 'ui_crossFirst', level: 0 }
      : alibi || proof ? null
      : wrongTime(s) ? { key: 'wrongTime', text: UI_AUDIO.wrongTime, clip: 'ui_wrongTime', level: 0 }
      : H && Object.entries(H.explains).some(([cl, sets]) => H.points[cl] === id && sets.flat().includes(s.id))
        ? { key: 'herringExplained', text: UI_AUDIO.herringExplained, clip: 'ui_herringExplained', level: 0 }
      : pointed && id === pointed ? (H ? { key: 'herringAway', text: UI_AUDIO.herringAway, clip: 'ui_herringAway', level: 0 }
        : { key: 'tooEasy', text: UI_AUDIO.tooEasy, clip: 'ui_tooEasy', level: 0 })
      : s.lead && id === c.culprit ? { key: 'truthLead', text: UI_AUDIO.truthLead, clip: 'ui_truthLead', level: 0 } : null;
    if (soft) {
      r.hint = soft;
      log('hint_shown', { hint: soft.key, hintLevel: 0 });
      render();
      return;
    }
    if (half) {
      if (!r.proofs.includes(s.id)) r.proofs.push(s.id);
      r.hint = { key: 'pairHalf', text: UI_AUDIO.pairHalf, clip: 'ui_pairHalf', level: 0 };
      log('hint_shown', { hint: 'pairHalf', hintLevel: 0 });
      render();
      return;
    }
    if (alibi) {
      r.crossed.push(id);
      r.used.push(s.id);
      r.highlight = null;
      if (c.suspects.length - r.crossed.length === 1) r.note = UI_AUDIO.lastOne;
      sfx('stamp');
      render();
      const x = document.querySelector(`.suspect[data-id="${id}"]`);
      if (x) x.classList.add('justcrossed');
      return;
    }
    if (proof) {
      r.crossed = c.suspects.filter(x => x !== c.culprit);
      log('case_done', { assisted: r.assisted, wrong: r.wrong });
      markSolved(c);
      sfx('tada');
      go('reveal');
      return;
    }
    r.wrong++;
    sfx('nope');
    let h;
    if (r.assisted || r.wrong >= 4) {
      if (!r.assisted) { r.assisted = true; log('assisted'); }
      h = { key: 'assist', text: UI_AUDIO.elimAssist, clip: 'ui_elimAssist', level: 4 };
    } else if (r.wrong === 3) {
      r.highlight = true;
      h = { key: 'h2', text: UI_AUDIO.elimLook, clip: 'ui_elimLook', level: 2 };
    } else if (r.wrong === 2) {
      h = { key: 'h1', text: c.h1, clip: c.id + '_h1', level: 1 };
    } else if (L && id === liar && liar !== c.culprit && (s.id === L.claim || s.id === L.truth || L.breaks.flat().includes(s.id))) {
      h = { key: 'liarNotCulprit', text: UI_AUDIO.liarNotCulprit, clip: 'ui_liarNotCulprit', level: 0 };
    } else if (L && id === liar && (s.id === L.claim || L.breaks.flat().includes(s.id))) {
      h = { key: 'liarCaught', text: UI_AUDIO.liarCaught, clip: 'ui_liarCaught', level: 0 };   // right person, the lie is no proof
    } else if (L && r.caught && s.id === L.claim) {
      h = { key: 'lieBroken', text: UI_AUDIO.lieBroken, clip: 'ui_lieBroken', level: 0 };
    } else if (L && s.id === L.truth && id === c.culprit) {
      h = { key: 'truthLead', text: UI_AUDIO.truthLead, clip: 'ui_truthLead', level: 0 };
    } else if (s.who === id && s.role !== 'clear') {
      h = { key: 'selfClaim', text: UI_AUDIO.selfClaim, clip: 'ui_selfClaim', level: 0 };
    } else if (s.role === 'clear' || s.role === 'evidence') {
      h = { key: 'notWho', text: UI_AUDIO.notWho, clip: 'ui_notWho', level: 0 };
    } else {
      h = { key: 'notThis', text: UI_AUDIO.notThis, clip: 'ui_notThis', level: 0 };
    }
    r.hint = h;
    log('hint_shown', { hint: h.key, hintLevel: h.level });
    render();
  },
  letterOk(el) {
