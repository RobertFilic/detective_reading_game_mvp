<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Detektiv">
<meta name="theme-color" content="#fdf6e9">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<title>Detektivska pisarna</title>
<style>
:root {
  --bg: #fdf6e9; --ink: #2b2a33; --muted: #6b6876; --card: #fff; --line: #e6dcc8;
  --accent: #3d6fd8; --accent-ink: #fff; --heard: #eef3ff; --sel: #ffe9a8; --sel-line: #e0a800;
  --good: #dff3e6; --warn: #fff1cc; --bad: #fbe0dc; --danger: #c0392b;
  --row-font: 24px;
}
.level-A { --row-font: 30px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
}
input { -webkit-user-select: text; user-select: text; font: inherit; }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.screen {
  flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 900px; margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
/* Centred screens scroll when the content is taller than the screen (small phones), instead of cutting off the top. */
.center { justify-content: flex-start; align-items: center; text-align: center; gap: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.center > :first-child { margin-top: auto; }
.center > :last-child { margin-bottom: auto; }
h1 { font-size: 40px; margin: .2em 0; }
h2 { font-size: 28px; margin: 1em 0 .4em; }
h3 { margin: 0 0 .5em; }
.muted { color: var(--muted); }
.btn {
  appearance: none; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-size: 24px; font-weight: 600; padding: 14px 28px; min-height: 60px; cursor: pointer;
}
.btn:disabled { opacity: .35; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.btn.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: var(--card); color: var(--danger); border: 2px solid var(--danger); }
.btn.big { font-size: 32px; padding: 20px 48px; }
.spk {
  appearance: none; border: 2px solid var(--line); background: var(--card); border-radius: 50%;
  width: 56px; height: 56px; flex: none; font-size: 26px; cursor: pointer;
}
.spk.playing { border-color: var(--accent); }
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.qbar .q { font-size: 28px; font-weight: 700; }
.center .qbar { justify-content: center; }
.qbar.big .q { font-size: 40px; }
.case-no { color: var(--muted); font-weight: 600; }
.rows {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 12px;
}
.row {
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px;
  min-height: 56px; font-size: var(--row-font); line-height: 1.35; display: flex; align-items: center;
  cursor: pointer; text-align: left; transition: opacity .2s; flex: none;
}
.row.heard { background: var(--heard); }
.row.playing { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 111, 216, .25); }
.row.selected { background: var(--sel); border-color: var(--sel-line); }
.row.dim { opacity: .3; }
.pick-count { font-weight: 700; color: var(--muted); }
.row.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(224, 168, 0, .45); } }
.footer { display: flex; gap: 12px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding-top: 12px; }
.locked .rows, .locked .footer { pointer-events: none; }
.locked .footer { opacity: .4; }
.suspects { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.suspect {
  appearance: none; font: inherit; color: inherit; background: var(--card); border: 2px solid var(--line);
  border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  min-width: 140px; font-size: 24px; font-weight: 600;
}
button.suspect { cursor: pointer; }
.avatar { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; }
.avatar.sm { width: 56px; height: 56px; font-size: 32px; flex: none; }
.sticker { font-size: 88px; line-height: 1; }
.stamp {
  font-size: 40px; font-weight: 800; color: var(--danger); border: 6px solid var(--danger);
  border-radius: 12px; padding: 6px 22px; transform: rotate(-5deg);
}
.reveal-rows { flex: none; width: 100%; max-width: 720px; }
.board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.board-head .q { font-size: 30px; font-weight: 800; }
.board-head .count { margin-left: auto; font-size: 22px; font-weight: 700; color: var(--muted); }
.board {
  flex: 1; min-height: 170px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; align-content: start;
  background: #d9b48a; border: 10px solid #a8763f; border-radius: 18px;
}
.folder {
  appearance: none; font: inherit; color: inherit; cursor: pointer; position: relative; text-align: center;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 6px 16px 14px 14px; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 170px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
}
.folder .no { position: absolute; top: 6px; left: 10px; font-weight: 800; color: var(--muted); font-size: 16px; }
.folder .stk { font-size: 52px; line-height: 1.1; }
.folder .fq { font-size: 18px; font-weight: 600; line-height: 1.25; }
.folder .place { font-size: 14px; font-weight: 700; color: #1f7a8c; background: #dff4f7; border-radius: 8px; padding: 0 6px; }
.folder .lvl { font-size: 15px; letter-spacing: 1px; margin-top: auto; }
.folder.solved { background: #e9f6ec; border-color: #9fd3ad; }
.folder.solved .stk { opacity: .55; }
.folder .tick {
  position: absolute; top: 34px; right: 8px; font-size: 22px; font-weight: 900; color: var(--danger);
  border: 3px solid var(--danger); border-radius: 8px; padding: 0 6px; transform: rotate(-8deg); background: rgba(255, 255, 255, .8);
}
.folder.suggest { border-color: var(--sel-line); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(224, 168, 0, .45); } }
/* first-time tutorial: Babica (owl) coach bubble + the thing to tap glows */
.coach {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 20px)); z-index: 20;
  display: flex; gap: 12px; align-items: center; background: #fff; border: 3px solid var(--accent); border-radius: 20px;
  padding: 10px 14px; font-size: 22px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); animation: coachIn .3s ease-out;
}
.coach.top { top: calc(10px + env(safe-area-inset-top)); }
.coach.bottom { bottom: calc(10px + env(safe-area-inset-bottom)); }
.coach .owl { font-size: 44px; line-height: 1; flex: none; }
.coach .say { flex: 1; }
.coach .btn { flex: none; }
@keyframes coachIn { from { opacity: 0; transform: translateX(-50%) scale(.9); } }
.coach-target { outline: 4px solid var(--sel-line); outline-offset: 4px; border-radius: 16px; animation: pulse 1.1s ease-in-out infinite; }
/* Detective ID card */
.idcard {
  width: min(440px, 100%); background: linear-gradient(135deg, #fffaf0, #f3e6c9); border: 2px solid #d9c08f;
  border-radius: 16px; padding: 10px 14px 12px; text-align: left; box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
}
.id-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: #8a6a2f; }
.id-body { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
.id-photo { font-size: 64px; line-height: 1; background: #fff; border: 2px solid #e2cfa4; border-radius: 12px; padding: 4px 8px; }
.id-text { display: flex; flex-direction: column; gap: 2px; font-size: 17px; }
.id-text b { font-size: 24px; }
.id-stamps { display: flex; gap: 8px; }
.stamp-slot { font-size: 22px; width: 38px; height: 38px; border: 2px dashed #d9c08f; border-radius: 50%; display: flex; align-items: center; justify-content: center; filter: grayscale(1); opacity: .35; }
.stamp-slot.got { filter: none; opacity: 1; border: 2px solid var(--danger); transform: rotate(-8deg); background: #fff; }
.files-screen { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 12px; }
.files-card { position: relative; display: flex; justify-content: center; }
.files-card .edit { position: absolute; bottom: 10px; right: max(10px, calc(50% - 210px)); min-height: 40px; padding: 4px 10px; font-size: 18px; }
.file-list { display: flex; flex-direction: column; gap: 10px; }
.file-card {
  appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 18px; padding: 12px 16px; box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
}
.file-card.done { background: #e9f6ec; border-color: #9fd3ad; }
.file-card .fi { font-size: 48px; line-height: 1; }
.file-card .ft { flex: 1; display: flex; flex-direction: column; }
.file-card .ft b { font-size: 22px; }
.file-card .cast { font-size: 24px; letter-spacing: 2px; }
.file-card .fp { font-weight: 800; color: var(--muted); font-size: 18px; white-space: nowrap; }
.file-soon { color: var(--muted); text-align: center; font-size: 16px; padding: 4px; }
.folder.final { background: #fff0f6; border-color: #f0b8d0; }
.folder.locked { cursor: pointer; }
.folder.locked .stk { filter: grayscale(1); opacity: .6; }
.folder.locked .fq { color: var(--muted); font-weight: 500; }
.caseq { font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 6px; }
.toast { background: var(--warn); border: 2px solid var(--sel-line); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; }
.kudos { font-size: 22px; font-weight: 800; color: var(--accent); }
/* ID card maker */
.make { gap: 16px; }
.mk-top { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; min-height: 44px; }
.mk-back { min-height: 44px; padding: 4px 14px; font-size: 18px; }
.steps-dots { display: flex; gap: 8px; }
.steps-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.steps-dots i.on { background: var(--accent); }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(90px, 140px)); gap: 12px; justify-content: center; }
.pick-grid.four { grid-template-columns: repeat(4, minmax(70px, 120px)); }
.pick {
  appearance: none; font: inherit; color: var(--muted); cursor: pointer; background: var(--card); border: 3px solid var(--line);
  border-radius: 18px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; font-weight: 600;
}
.pick.on { border-color: var(--accent); background: var(--heard); }
.pick .pe { font-size: 56px; line-height: 1.1; }
.name-in { font-size: 28px; padding: 10px 16px; border: 3px solid var(--line); border-radius: 16px; width: min(320px, 100%); text-align: center; background: #fff; }
.name-in:focus { outline: none; border-color: var(--accent); }
.trophy { background: var(--good); border-radius: 14px; padding: 8px 14px; font-weight: 700; margin-bottom: 10px; text-align: center; }
.hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
  width: min(860px, calc(100% - 32px)); background: #fffbe9; border: 3px solid var(--sel-line); border-radius: 20px;
  padding: 14px 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
  font-size: 26px; z-index: 10;
}
.hint .txt { flex: 1; }
.hint .hi { font-size: 34px; line-height: 1; }
.hint.no { border-color: #d9534f; background: #fff1f0; }
.hint.no .hi, .hint.no .verdict { color: #c9302c; }
.hint .verdict { display: block; font-size: 1.1em; }
/* step cases: phone call, scene search, crossing off */
.phone { font-size: 96px; line-height: 1; animation: ring .5s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.caller { display: flex; gap: 12px; align-items: flex-start; width: 100%; max-width: 640px; text-align: left; }
.bubble { flex: 1; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 3px solid var(--accent); border-radius: 4px 20px 20px 20px; padding: 8px; }
.bubble .row { border: 0; min-height: 0; padding: 4px 8px; }
.suspects.mini { gap: 8px; flex-wrap: nowrap; }
.suspects.mini .suspect { min-width: 0; padding: 8px 10px; font-size: 18px; gap: 4px; position: relative; flex: 1 1 0; max-width: 150px; }
.suspects.mini .avatar { width: 60px; height: 60px; font-size: 34px; }
.suspect.crossed { opacity: .55; background: #eee; }
.suspect.crossed .avatar { filter: grayscale(1); }
.suspect .xmark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; color: var(--danger); font-weight: 900; }
.suspect.justcrossed .xmark { animation: slam .35s cubic-bezier(.2, 1.6, .4, 1); }
.suspect.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.toolbar-kid { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.tool { appearance: none; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 6px 14px; }
.tool.on { background: #fff6c2; border-color: var(--sel-line); box-shadow: 0 0 18px rgba(255, 210, 0, .7); }
.pocket-count { margin-left: auto; font-weight: 800; color: var(--muted); }
.ask .suspect.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.ask .suspect .ok { position: absolute; top: 4px; right: 6px; color: #2e9d57; font-weight: 800; }
.ask .suspect { position: relative; }
.chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px; }
.chat-head { text-align: center; color: var(--muted); font-weight: 700; font-size: 16px; }
.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.me { justify-content: flex-end; }
.msg .mav { font-size: 28px; line-height: 1; flex: none; }
.msg .mtxt { max-width: 75%; padding: 8px 14px; border-radius: 20px; font-size: var(--row-font, 24px); }
.msg:last-child .mtxt { animation: fadein .25s both; }
.msg.me .mtxt { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.them .mtxt { background: #fff; border: 2px solid var(--line); border-bottom-left-radius: 4px; cursor: pointer; }
.typing i { display: inline-block; width: 8px; height: 8px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-5px); opacity: .4; } }
.qs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin: 4px 0 8px; flex: none; }
.qbtn { appearance: none; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer; background: #fff; color: var(--accent); border: 3px solid var(--accent); border-radius: 20px; padding: 8px 14px; }
.row .who { font-weight: 700; color: var(--muted); }
.objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 8px; flex: none; }
.obj {
  appearance: none; font: inherit; color: inherit; cursor: pointer; position: relative; background: #fff3cf; border: 2px solid #e2c98f;
  border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
}
.obj .oe { font-size: 40px; line-height: 1.1; }
.obj .ol { font-size: 14px; font-weight: 700; color: var(--muted); }
.obj.got { background: #e9f6ec; border-color: #9fd3ad; }
.obj .ok { position: absolute; top: 2px; right: 6px; color: #2e8b57; font-weight: 900; }
.obj.dark { background: #2b2a33; border-color: #111; }
.obj.dark .ol { color: #aaa; }
.objs.torch .obj.dark { box-shadow: 0 0 0 4px rgba(255, 220, 0, .8), 0 0 24px rgba(255, 220, 0, .8); }
.pocket .row.fresh { animation: drop .4s ease-out; }
@keyframes drop { from { transform: translateY(-16px) scale(1.05); background: var(--sel); } }
/* solved: newspaper + stamp slam, excuse, rank-up, pinned card */
.paper { background: #fbf8f1; border: 2px solid #cfc6b0; border-radius: 6px; padding: 8px 16px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(520px, 100%); animation: spin-in .6s ease-out; }
@keyframes spin-in { from { transform: rotate(-200deg) scale(.1); opacity: 0; } }
.paper .mast { font-family: Georgia, "Times New Roman", serif; font-weight: 900; letter-spacing: 2px; font-size: 20px; border-bottom: 3px double #2b2a33; width: 100%; text-align: center; }
.paper .qbar { margin: 4px 0 0; }
.paper .pic { display: flex; align-items: center; gap: 8px; font-size: 20px; }
.stamp.slam { animation: slam .45s .25s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { from { transform: rotate(-8deg) scale(3); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
.avatar.caught { animation: blush 1.2s ease-in-out .9s 2; }
@keyframes blush { 25% { transform: rotate(-10deg); box-shadow: 0 0 0 6px #ffb3b3; } 75% { transform: rotate(10deg); } }
.rankup { background: #fff0c2; border: 3px solid var(--sel-line); border-radius: 14px; padding: 6px 14px; font-weight: 800; animation: slam .45s 1s both; }
.excuse { display: flex; align-items: center; gap: 10px; font-style: italic; font-size: 20px; cursor: pointer; }
.pinned { display: flex; align-items: center; gap: 10px; background: #e8c9a0; border: 3px solid #a8763f; border-radius: 12px; padding: 8px 14px; text-align: left; position: relative; cursor: pointer; animation: drop .5s 1.2s both; }
.pinned .pin, .pincard::before { font-size: 22px; }
.pinned .ci { font-size: 36px; }
/* season corkboard + letters */
.cork { background: #d9b48a; border: 6px solid #a8763f; border-radius: 14px; padding: 6px 10px 10px; margin-bottom: 10px; flex: none; }
.cork-q { font-weight: 800; font-size: 20px; margin-bottom: 6px; }
.pins { display: flex; align-items: center; overflow-x: auto; }
.pincard { flex: none; width: 120px; min-height: 76px; background: #fffdf3; border-radius: 4px; padding: 14px 8px 6px; font-size: 14px; position: relative;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transform: rotate(-2deg); cursor: pointer; }
.pincard::before { content: '📌'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
.pincard .ci { display: block; font-size: 24px; }
.pincard.empty { background: rgba(255, 255, 255, .35); border: 2px dashed #8a6a2f; box-shadow: none; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #8a6a2f; transform: none; cursor: default; }
.pincard.empty::before { content: none; }
.string { flex: none; width: 16px; height: 3px; background: var(--danger); }
.string.draw { transform-origin: left; animation: draw .5s .5s ease-out both; }
.pincard.new { animation: flyin .7s ease-out both; }
@keyframes draw { from { transform: scaleX(0); } }
@keyframes flyin { from { transform: translateY(-120px) rotate(-25deg) scale(1.4); opacity: 0; } }
.think { margin-top: 8px; background: #fff; border-radius: 16px; padding: 6px 12px; font-weight: 600; font-size: 18px; animation: fadein .4s 1s both; cursor: pointer; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
.cork-q { display: flex; align-items: center; gap: 8px; }
.vent { appearance: none; margin-left: auto; width: 54px; height: 30px; border-radius: 6px; border: 3px solid #6b5333; cursor: pointer; position: relative;
  background: repeating-linear-gradient(0deg, #3b2f22 0 4px, #6b5333 4px 8px); }
.vent .eyes { font-size: 16px; animation: blink 4s infinite; display: inline-block; }
@keyframes blink { 0%, 60%, 100% { opacity: 0; } 66%, 90% { opacity: 1; } 93% { opacity: .2; } }
.vent.peek .eyes { animation: none; opacity: 1; }
.vent.peek::after { content: 'pip-pip!'; position: absolute; top: -26px; right: -6px; background: #fff; border-radius: 10px; padding: 0 6px; font-size: 14px; font-weight: 700; animation: fadein .2s both; }
.waiting { background: var(--good); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex: none; }
.waiting span { flex: 1; }
.waiting .btn { padding: 8px 14px; font-size: 18px; }

  for (const c of [TUTORIAL, ...CASES]) {
    out.push([c.id + '_q', c.question]);

    for (const s of c.sentences) if (s.ask) out.push([`${c.id}_${s.id}q`, s.ask]);

    c.reveal.forEach((t, i) => out.push([`${c.id}_r${i + 1}`, t]));

    (c.letter || []).forEach((t, i) => out.push([`${c.id}_l${i + 1}`, t]));

  return out;

const SAVE_VERSION_KEY = 'dp_save_version';

function newPlayerId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function newPlayer() {
  const p = { id: newPlayerId(), created: new Date().toISOString() };
  store.write(PLAYER_KEY, p);

}
const playerInfo = () => store.read(PLAYER_KEY, null) || newPlayer();

function migrateSave() {
  const from = store.read(SAVE_VERSION_KEY, 1);
  if (from < 2) {
    // forest case numbers → "gozd:N"
    const played = store.read('dp_played_v1', []);
    store.write('dp_played_v1', played.map(k => typeof k === 'number' ? `gozd:${k}` : k));
  }
  if (from < 3) {
    // the adventures were rewritten as a reasoning ladder: keep ticks of cases that kept their
    // story and number, drop the rest (the forest cases were removed; their keys stay unused)
    const keep = ['vesolje:1', 'vesolje:2', 'vesolje:4', 'kmetija:1', 'kmetija:2', 'kmetija:4'];
    const played = store.read('dp_played_v1', []);
    store.write('dp_played_v1', played.filter(k => keep.includes(k) || String(k).startsWith('gozd:')));
  }
  if (from !== SAVE_VERSION) store.write(SAVE_VERSION_KEY, SAVE_VERSION);
  playerInfo(); // make sure this device has an anonymous player id
}

// ---------------------------------------------------------------------------
// Audio: embedded clip → audio/<id>.m4a → Slovenian speechSynthesis voice
// ---------------------------------------------------------------------------
const player = new Audio();
let playToken = 0;
let playingEl = null;
let slVoice = null;

function loadVoices() {
  const had = !!slVoice;
  try { slVoice = speechSynthesis.getVoices().find(v => /^sl/i.test(v.lang)) || null; } catch (e) { slVoice = null; }
  if (S.screen === 'setup' || had !== !!slVoice) render();
}

// 🔊 buttons only when something can actually be heard (recordings or a Slovenian voice).
const canSpeak = () => Object.keys(AUDIO).length > 0 || !!slVoice;

function markPlaying(el) {
  if (playingEl) playingEl.classList.remove('playing');
  playingEl = el;
  if (el) el.classList.add('playing');
}

function stopAudio() {
  playToken++;
  try { player.pause(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  markPlaying(null);
}

function play(id, text, el) {
  stopAudio();
  const tok = playToken;
  let fellBack = false;
  markPlaying(el);
  const done = () => { if (tok === playToken) markPlaying(null); };
  const speak = () => {
    if (tok !== playToken || fellBack) return;
    fellBack = true;
    if (!slVoice) { setTimeout(done, 800); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = slVoice; u.lang = slVoice.lang; u.rate = 0.9;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  };
  // Without an embedded recording, speak right away: iPad Safari only allows speech inside the tap itself.
  if (!AUDIO[id] && slVoice) { speak(); return; }
  player.onended = done;
  player.onerror = speak;
  player.src = AUDIO[id] || `audio/${id}.m4a`;
  const p = player.play();
  if (p && p.catch) p.catch(speak);
}

    // step cases: call answered, clues found (in order), torch on, crossed-off suspects, selected clue
    answered: false, found: [], who: null, typing: null, torch: false, crossed: [], sel: null, note: null,
  };
}

// The case to play for file + number: the child's level, or level A when a themed file
// has only one version.
function caseFor(file, no) {
  return CASES.find(c => c.file === file && c.no === no && c.level === S.level)
    || CASES.find(c => c.file === file && c.no === no && c.level === 'A');
}
const casesIn = (file) => [...new Set(CASES.filter(c => c.file === file).map(c => c.no))].sort((a, b) => a - b).map(no => caseFor(file, no));
const caseKey = (c) => `${c.file}:${c.no}`;

// "Po vrsti": every case of every adventure in order ("file:no"), from the chosen one on.
function caseOrder() {
  return ALL_KEYS.slice(S.startAt);
}

// Solved cases on this device, as "file:no" (migrateSave converts older saves).
function solvedKeys() {
  return store.read(PLAYED_KEY, []);
}
const isSolved = (c) => solvedKeys().includes(caseKey(c));
// A final case opens when the rest of its file is solved.
const isLocked = (c) => !!c.final && casesIn(c.file).some(x => !x.final && !isSolved(x));
// A season with cases still to come is not done yet.
const fileDone = (file) => !(FILES.find(f => f.id === file).soon > 0) && casesIn(file).every(isSolved);
const ALL_KEYS = FILES.flatMap(f => casesIn(f.id).map(caseKey));

// Case board: the child picks any case of the file. Solved cases get a tick, and one
// unsolved case glows as a suggestion: a random one among the easiest still open.
function pickSuggestion() {
  const open = casesIn(S.file).filter(c => !isSolved(c) && !isLocked(c));
  if (!open.length) return null;
  const easiest = Math.min(...open.map(c => c.rung));
  const pool = open.filter(c => c.rung === easiest);
  return pool[Math.floor(Math.random() * pool.length)].no;
}

function playCase(no) {
  S.caseNo = S.started++;
  S.c = caseFor(S.file, no);
  S.run = newRun();
  log('case_pick', { file: S.file, no, suggested: no === S.suggest, solvedBefore: isSolved(S.c) });
  openCaseScreen();
}

// A step case starts with the client's phone call, every other case with the intro.
const openCaseScreen = () => go(S.c.steps ? 'call' : 'intro');

// Bookkeeping when a case is solved: the tick, a rank-up to celebrate, the client's letter.
function markSolved(c) {
  const played = solvedKeys();
  const before = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  if (!played.includes(caseKey(c))) store.write(PLAYED_KEY, [...played, caseKey(c)]);
  const after = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  if (rankFor(after) !== rankFor(before)) S.run.rankUp = rankFor(after);
  const mail = store.read(LETTER_KEY, { pending: [], read: [] });
  if (c.letter && !mail.read.includes(c.id) && !mail.pending.some(x => x.id === c.id)) {
    store.write(LETTER_KEY, { ...mail, pending: [...mail.pending, { id: c.id, session: S.session }] });
  }
}

// ---------- Ranks: earned by solved cases, never lost
const RANKS = [
  { n: 0, i: '🔰', m: 'Vajenec', f: 'Vajenka' },
  { n: 3, i: '🕵️', m: 'Detektiv', f: 'Detektivka' },
  { n: 6, i: '⭐', m: 'Višji detektiv', f: 'Višja detektivka' },
  { n: 10, i: '🎖️', m: 'Inšpektor', f: 'Inšpektorica' },
  { n: 15, i: '👑', m: 'Glavni inšpektor', f: 'Glavna inšpektorica' },
];
const rankFor = (n) => RANKS.filter(r => n >= r.n).pop();
const rankName = (r, p = profile()) => `${r.i} ${p && p.g === 'f' ? r.f : r.m}`;
// verb forms for the child: ga('ujel', 'ujela')
const ga = (m, f) => (profile() || {}).g === 'f' ? f : m;

// ---------- Letters: a client's thank-you arrives on the next visit (a later session)
const LETTER_KEY = 'dp_letters_v1';
function letterDue(file) {
  const mail = store.read(LETTER_KEY, { pending: [], read: [] });
  const due = mail.pending.find(x => x.session !== S.session && caseById(x.id) && caseById(x.id).file === file);
  return due ? caseById(due.id) : null;
}

// ---------- Little sounds made on the fly (no files): ring, pop, stamp, nope, tada
let actx = null;
let ringTimer = null;
function sfx(name) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const tone = (freq, start, dur, type = 'sine', vol = 0.12) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0 + start);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
    };
    if (name === 'ring') [0, .18, .5, .68].forEach(s => tone(880, s, .14, 'square', .05));
    if (name === 'pop') tone(660, 0, .12, 'triangle');
    if (name === 'click') tone(1400, 0, .05, 'square', .06);
    if (name === 'stamp') { tone(90, 0, .25, 'sine', .35); tone(140, 0, .12, 'triangle', .15); }
    if (name === 'nope') { tone(220, 0, .15, 'sine', .1); tone(180, .12, .2, 'sine', .1); }
    if (name === 'beep') { tone(1760, 0, .08, 'square', .05); tone(1760, .14, .08, 'square', .05); }
    if (name === 'tada') [523, 659, 784, 1047].forEach((f, i) => tone(f, .12 + i * .1, .3, 'triangle', .1));
  } catch (e) { /* no sound is fine */ }
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; }

// ---------- Detective ID card: avatar (also sets detektiv / detektivka), sidekick, optional name
const PROFILE_KEY = 'dp_profile_v1';
const AVATARS = [
  { e: '🕵🏻‍♂️', g: 'm' }, { e: '🕵🏽‍♂️', g: 'm' }, { e: '🕵🏿‍♂️', g: 'm' },
  { e: '🕵🏻‍♀️', g: 'f' }, { e: '🕵🏽‍♀️', g: 'f' }, { e: '🕵🏿‍♀️', g: 'f' },
];
const SIDEKICKS = ['🐶', '🐱', '🦉', '🦊'];
const profile = () => store.read(PROFILE_KEY, null);
const detTitle = (p = profile()) => (p && p.g === 'f' ? 'Detektivka' : 'Detektiv');
const detName = (p = profile()) => detTitle(p) + (p && p.name ? ' ' + p.name : '');
// Slovenian plural after a number: 1 rešen primer, 2 rešena primera, 3–4 rešeni primeri, 5+ rešenih primerov.
const solvedLabel = (n) => n % 100 === 1 ? `${n} rešen primer` : n % 100 === 2 ? `${n} rešena primera`
  : (n % 100 === 3 || n % 100 === 4) ? `${n} rešeni primeri` : `${n} rešenih primerov`;
const cleanName = (v) => v.replace(/[^\p{L} '-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 12)
  .replace(/^\p{L}/u, ch => ch.toUpperCase());

function idCard(p) {
  const n = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  return `<div class="idcard">
    <div class="id-top"><span>🔍 DETEKTIVSKA IZKAZNICA</span><span>št. ${esc(p.id)}</span></div>
    <div class="id-body">
      <span class="id-photo">${p.av}</span>
      <div class="id-text"><b>${esc(detName(p))}</b>
        <span class="rank">${rankName(rankFor(n), p)}</span>
        <span>Pomočnik: ${p.sk} · ✔ ${solvedLabel(n)}</span></div>
    </div>
    <div class="id-stamps">${FILES.map(f => `<span class="stamp-slot ${fileDone(f.id) ? 'got' : ''}" title="${esc(f.title)}">${f.icon}</span>`).join('')}</div>
  </div>`;
}

// ---- First-time tutorial: a guided practice case before the board ----
const TUT_KEY = 'dp_tutorial_done';

function startTutorial() {
  S.c = TUTORIAL;
  S.run = newRun();
  S.tut = { read: false, msg: null, board: false };
  log('tutorial_start');
  go('intro');
}

function endTutorial() {
  store.write(TUT_KEY, true);
  log('tutorial_done');
  S.c = null;
  S.run = null;
  S.tut = { board: true };   // one last bubble on the file picker
  toHome();
}

// What Babica says on each screen, and which element glows.
function coachStep() {
  const t = S.tut, r = S.run;
  if (!t) return null;
  if (S.screen === 'files') return t.board ? { text: 'Zdaj izberi pustolovščino in reši svoj primer!', sel: '.file-card', ok: true } : null;
  if (S.screen === 'board') return null;
  if (t.msg) return { text: t.msg, sel: null, ok: true };
  switch (S.screen) {
    case 'intro': return { text: 'Tvoj prvi primer! Najprej preberi zgodbo.', sel: '[data-act="toStory"]' };
    case 'story': return t.read
      ? { text: 'Ko veš, kdo je bil, tapni tukaj.', sel: '[data-act="know"]' }
      : { text: 'Preberi vse stavke. Kdo je pojedel korenček?', sel: '.rows', ok: true };
    case 'accuse': return { text: 'Kdo je bil? Tapni pravo živalco.', sel: '.suspects' };
    case 'evidence': return r && r.picks.length
      ? { text: 'Tapni »To je dokaz!«', sel: '[data-act="confirm"]' }
      : { text: 'Kateri stavek to dokaže? Tapni ga.', sel: '.rows' };
    case 'reveal': return { text: `Bravo, ${detTitle().toLowerCase()}! Tako se igra. 🎉`, sel: '[data-act="next"]' };
  }
  return null;
}

function coach() {
  document.querySelectorAll('.coach').forEach(el => el.remove());
  document.querySelectorAll('.coach-target').forEach(el => el.classList.remove('coach-target'));
  const step = coachStep();
  if (!step) return;
  const target = step.sel && document.querySelector(step.sel);
  if (target) target.classList.add('coach-target');
  // Put the bubble on the side with more room, so it doesn't cover what to tap.
  const rect = target ? target.getBoundingClientRect() : null;
  const top = rect ? rect.top > innerHeight - rect.bottom : false;
  document.body.insertAdjacentHTML('beforeend', `<div class="coach ${top ? 'top' : 'bottom'}">
    <span class="owl">🦉</span><span class="say">${esc(step.text)}</span>
    ${step.ok ? '<button class="btn" data-coach="ok">V redu</button>' : ''}</div>`);
}

app.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'mkName') ACTIONS.mkName();
});

document.body.addEventListener('click', (e) => {
  if (!e.target.closest('[data-coach="ok"]') || !S.tut) return;
  if (S.tut.msg) S.tut.msg = null;
  else if (S.screen === 'story') S.tut.read = true;
  else if (S.screen === 'files') S.tut = null;
  coach();
});

// Home: a new child first makes the ID card, then plays the practice case, then picks a file.
function toHome() {
  if (!profile()) { S.mk = { step: 1, av: null, g: null, sk: null, name: '' }; go('make'); return; }
  if (!store.read(TUT_KEY, false) && !(S.tut && S.tut.board)) { startTutorial(); return; }
  S.file = null;
  go('files');
}

function toBoard() {
  if (!S.file) { toHome(); return; }
  S.suggest = pickSuggestion();
  go('board');
}

function startCase(n) {
  const [file, no] = S.order[n].split(':');
  S.caseNo = n;
  S.file = file;
  S.c = caseFor(file, Number(no));
  S.run = newRun();
  openCaseScreen();
}

function go(screen) {
  stopAudio();
  stopRing();
  if (screen !== 'board') S.pinNew = null;
  S.screen = screen;
  render();
  if (screen === 'call' && !S.run.answered) {
    let rings = 0;
    sfx('ring');
    ringTimer = setInterval(() => { if (++rings >= 5) stopRing(); else sfx('ring'); }, 1600);
  }
  if (screen === 'reveal') setTimeout(() => sfx('stamp'), 350);
  if (!ADULT.has(screen)) log('screen_enter');
  if (screen === 'thanks' && !S.ended) { S.ended = true; log('session_end'); }
}

// ---------- Back: one step back, for the ← button and for the browser / swipe back.
// Returns what to do, 'stay' (nothing sensible behind this screen) or null (leave the game).
function backTarget() {
  const tut = S.tut && !S.tut.board;
  switch (S.screen) {
    case 'make':
      if (S.mk.step > 1) return () => { S.mk.step--; render(); };
      return profile() ? () => { S.mk = null; toHome(); } : null;
    case 'board': return () => { S.toast = null; toHome(); };
    case 'intro':
      if (tut) return store.read(TUT_KEY, false) ? () => { S.tut = null; S.c = null; toHome(); } : () => { ACTIONS.editCard(); S.mk.step = 4; render(); };
      return S.orderMode === 'board' ? toBoard : 'stay';
    case 'call': return S.orderMode === 'board' ? toBoard : 'stay';
    case 'scene': case 'ask': return () => go('call');
    case 'solve': return S.run.hint ? 'stay' : () => go(S.c.steps[1]);
    case 'story': return () => go('intro');
    case 'accuse': return () => go('story');
    case 'evidence': return S.run.hint ? 'stay' : () => { S.run.picks = []; go('accuse'); };
    case 'reveal': return tut ? endTutorial : S.orderMode === 'board' ? toBoard : 'stay';
    case 'soon': return () => go('more');
    case 'thanks': return KID_MODE ? ACTIONS.backToBoard : 'stay';
    case 'title': return ACTIONS.toSetup;
    case 'debrief': return S.resume ? ACTIONS.resume : ACTIONS.toSetup;
    case 'files': case 'setup': return null;
    default: return 'stay';
  }
}

function goBack(how) {
  const to = backTarget();
  if (typeof to !== 'function') return to;
  if (!ADULT.has(S.screen)) log('nav_back', { how });
  to();
  return 'done';
}

// The browser back pops a spare history entry; the game then steps back itself and adds a
// new one, or really leaves on the first screens. Browsers may skip entries added without
// a tap, so the next tap adds one more.
let tapArmed = false;
const armBack = () => history.pushState({ dp: 'in' }, '');
document.addEventListener('click', () => {
  if (!tapArmed) { armBack(); tapArmed = true; }
}, true);
addEventListener('popstate', () => {
  tapArmed = false;
  if (goBack('browser') === null) history.back(); else armBack();
});

function render() {
  app.className = 'level-' + (S.level || 'B');
  app.innerHTML = T[S.screen]();
  const chat = $('.chat');
  if (chat) chat.scrollTop = chat.scrollHeight;
  if (S.screen === 'story' || S.screen === 'evidence') {
    refreshRows();
    watchScroll();
  }
  coach();
}

function rowsHTML(act) {
  return S.c.sentences.map(s => `<div class="row" data-act="${act}" data-sid="${s.id}">${esc(s.text)}</div>`).join('');
}

function refreshRows() {
  const r = S.run;
  const onEvidence = S.screen === 'evidence';
  document.querySelectorAll('.rows .row[data-sid]').forEach(el => {
    const s = sent(el.dataset.sid);
    el.classList.toggle('heard', r.heard.has(s.id));
    el.classList.toggle('selected', onEvidence && r.picks.includes(s.id));
    el.classList.toggle('dim', onEvidence && (r.assisted ? s.role !== 'evidence' : !!r.highlight && !r.highlight.has(s.id)));
    el.classList.toggle('pulse', onEvidence && r.assisted && s.role === 'evidence');
  });
}

// Logs reaching the end of the text once per case, and scrolling back up after that (a reread).
function watchScroll() {
  const el = $('.rows');
  const r = S.run;
  const check = () => {
    const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    if (atEnd) {
      if (!r.scrolledEnd) log('scroll_end', { fit: el.scrollHeight <= el.clientHeight + 4 });
      r.scrolledEnd = true;
      r.backArmed = true;
      r.maxTop = el.scrollTop;
    } else if (r.backArmed && el.scrollTop < r.maxTop - 80) {
      r.backArmed = false;
      log('scroll_back');
    }
  };
  el.addEventListener('scroll', check, { passive: true });
  requestAnimationFrame(check);
}

// A pair case needs two proof sentences, every other case one.
const need = () => S.c.type === 'pair' ? 2 : 1;

function evFooter() {
  const r = S.run;
  const two = need() === 2;
  return (r.wrong >= 2 || r.badSuspect ? '<button class="btn secondary" data-act="changeSuspect">Zamenjaj osumljenca</button>' : '')
    + (two ? `<span class="pick-count">${r.picks.length} / 2</span>` : '')
    + `<button class="btn" data-act="confirm" ${r.picks.length === need() ? '' : 'disabled'}>${two ? 'To sta dokaza! ✔' : 'To je dokaz! ✔'}</button>`;
}

// Every hint follows a wrong answer: it says so first (✖ Ni prav. / Skoraj!), then what to do.
function hintHTML(h) {
  const almost = h.key === 'pairHalf' || h.key === 'partial';
  return `<div class="hint ${almost ? 'almost' : 'no'}" id="hint"><span class="hi">${almost ? '💡' : '✖'}</span>`
    + `<span class="txt"><b class="verdict">${almost ? UI_AUDIO.almost : UI_AUDIO.no}</b> ${esc(h.text)}</span>${spk(h.clip)}`
    + `<button class="btn" data-act="hintOk">${UI_AUDIO.again}</button></div>`;
}

// The season's corkboard: one slot per case, a pinned card for each solved case that has one.
// S.pinNew = the case just solved: its card flies in, the string to it draws, and the
// detective thinks out loud. From 2 cards on, eyes blink in the vent.
function corkboard(f, cases) {
  const slots = cases.length + (f.soon || 0);
  const pinned = cases.filter(c => c.card && isSolved(c)).length;
  const fresh = cases.find(c => c.id === S.pinNew && c.card);
  const pins = Array.from({ length: slots }, (_, i) => {
    const c = cases[i];
    const s = c && c.card && isSolved(c) ? c.sentences.find(x => x.id === c.card.sid) : null;
    const isNew = fresh && c === fresh;
    return (i ? `<span class="string ${isNew ? 'draw' : ''}"></span>` : '')
      + (s ? `<div class="pincard ${isNew ? 'new' : ''}" data-act="say" data-clip="${c.id}_${s.id}"><span class="ci">${c.card.icon}</span>${esc(s.text)}</div>`
        : '<div class="pincard empty">?</div>');
  }).join('');
  return `<div class="cork"><div class="cork-q">📌 ${esc(f.mystery)}${pinned >= 2 ? '<button class="vent" data-act="vent" aria-label="zračnik"><span class="eyes">👀</span></button>' : ''}</div>
    <div class="pins">${pins}</div>
    ${fresh && fresh.card.think ? `<div class="think" data-act="say" data-clip="${fresh.id}_t">💭 ${esc(fresh.card.think)}</div>` : ''}</div>`;
}

function letterHTML(c) {
  const from = CHARACTERS[c.client];
  return `<div class="letter-wrap"><div class="letter">
    <div class="letter-head">📬 ${esc(UI_AUDIO.letter)}${spk('ui_letter')}</div>
    ${c.letter.map((t, i) => `<div class="row" data-act="say" data-clip="${c.id}_l${i + 1}">${esc(t)}</div>`).join('')}
    <div class="letter-from">${avatar(c.client, 'sm')} ${esc(from.name)}</div>
    <button class="btn big" data-act="letterOk" data-id="${c.id}">V redu</button>
  </div></div>`;
}

// Step cases: what the child should do next (for hints): the alibi of the first suspect not
// crossed off yet, or, when only the culprit is left, the proof.
function elimTarget() {
  const c = S.c, r = S.run;
  const who = c.suspects.find(id => id !== c.culprit && !r.crossed.includes(id));
  if (who) return { who, sid: c.sentences.find(s => s.clears === who).id };
  return { who: c.culprit, sid: c.sentences.find(s => s.role === 'evidence').id };
}

function ladderHint(level) {
  const c = S.c;
  if (level === 1) return { key: 'h1', text: c.h1, clip: c.id + '_h1', level };
  if (level === 2) return { key: 'h2', text: UI_AUDIO.h2, clip: 'ui_h2', level };
  if (need() === 2) return { key: 'h3', text: UI_AUDIO.h3pair, clip: 'ui_h3pair', level };
  return { key: 'h3', text: UI_AUDIO.h3, clip: 'ui_h3', level };
}

function showHint(h) {
  S.run.hint = h;
  log('hint_shown', { hint: h.key, hintLevel: h.level });
  $('.screen').classList.add('locked');
  app.insertAdjacentHTML('beforeend', hintHTML(h));
  $('.footer').innerHTML = evFooter();
  refreshRows();
}

          return `<button class="btn ${S.startAt === i ? '' : 'secondary'}" data-act="startAt" data-n="${i}">${FILES.find(f => f.id === file).icon} ${no} ${c.sticker}</button>`;
        }).join('')}</div>`}
      </section>
      <section class="card">
        <h3>2. Preizkus zvoka</h3>
        <button class="btn secondary" data-act="say" data-clip="ui_test">🔊 Predvajaj »${UI_AUDIO.test}«</button>
        <p class="muted">Vgrajeni posnetki: ${embedded} / ${CLIPS.size}. Slovenski sintetični glas: ${slVoice ? 'da (' + esc(slVoice.name) + ')' : 'ne'}.</p>
        ${embedded < CLIPS.size && !slVoice ? '<p class="warn-text">Ni posnetkov in ni slovenskega glasu – otrok ne bo slišal stavkov. Na iPadu: Nastavitve → Dostopnost → Govorjena vsebina → Glasovi → Slovenščina.</p>' : ''}
      </section>
      <div class="footer">
        <a class="btn secondary" href="../">← Izbira igre</a>
        <button class="btn secondary" data-act="toDebrief">Pregled podatkov (${LOG.length} dogodkov)</button>
        <button class="btn big" data-act="startSession" ${S.age ? '' : 'disabled'}>Začni sejo</button>
      </div>
      <p class="muted">Med igro: drži zgornji levi kot 3 sekunde za pregled.</p>
    </div>`;
  },

  title() {
    return `<div class="screen center">
      <div class="sticker">🔍</div>
      <h1>Detektivska pisarna</h1>
      <button class="btn big" data-act="begin">Začni</button>
    </div>`;
  },

  // New child: three taps to a detective ID card.
  make() {
    const m = S.mk;
    const back = m.step > 1 ? '<button class="btn secondary mk-back" data-act="mkBack">← Nazaj</button>' : '';
    let body;
    if (m.step === 1) {
      body = `<h1>Postani detektiv!</h1><p class="muted">Izberi svojega detektiva.</p>
        <div class="pick-grid">${AVATARS.map((a, i) => `<button class="pick ${m.av === a.e ? 'on' : ''}" data-act="mkAvatar" data-i="${i}">
          <span class="pe">${a.e}</span><span>${a.g === 'f' ? 'detektivka' : 'detektiv'}</span></button>`).join('')}</div>`;
    } else if (m.step === 2) {
      body = `<h1>Izberi pomočnika</h1>
        <div class="pick-grid four">${SIDEKICKS.map(e => `<button class="pick ${m.sk === e ? 'on' : ''}" data-act="mkSidekick" data-e="${e}"><span class="pe">${e}</span></button>`).join('')}</div>`;
    } else if (m.step === 3) {
      body = `<h1>Kako ti je ime?</h1>
        <input id="mkName" class="name-in" type="text" maxlength="12" autocomplete="off" autocapitalize="words" placeholder="tvoje ime" value="${esc(m.name)}">
        <div class="seg"><button class="btn big" data-act="mkName">Naprej</button></div>
        <button class="btn secondary" data-act="mkSkip">Preskoči</button>`;
    } else {
      body = `<h1>To si ti!</h1>${idCard({ id: m.id, av: m.av, g: m.g, sk: m.sk, name: m.name })}
        <button class="btn big" data-act="mkDone">Začni 🔍</button>`;
    }
    return `<div class="screen center make"><div class="mk-top"><span class="steps-dots">${[1, 2, 3, 4].map(i => `<i class="${i <= m.step ? 'on' : ''}"></i>`).join('')}</span>${back}</div>${body}</div>`;
  },

  files() {
    const p = profile();
    return `<div class="screen files-screen">
      <div class="files-card">${idCard(p)}<button class="btn secondary edit" data-act="editCard" aria-label="Uredi izkaznico">✏️</button></div>
      <div class="board-head"><span class="q">🗺️ Izberi pustolovščino</span></div>
      <div class="file-list">${FILES.map(f => {
        const cs = casesIn(f.id), done = cs.filter(isSolved).length, all = cs.length + (f.soon || 0);
        return `<button class="file-card ${fileDone(f.id) ? 'done' : ''} ${f.season ? 'season' : ''}" data-act="openFile" data-file="${f.id}">
          <span class="fi">${f.icon}</span>
          <span class="ft">${f.season ? '<span class="new-tag">NOVO · skrivnost</span>' : ''}<b>${esc(f.title)}</b><span class="cast">${f.cast.map(id => CHARACTERS[id].animal).join(' ')}</span></span>
          <span class="fp">${fileDone(f.id) ? '🏅' : `✔ ${done} / ${all}`}</span></button>`;
      }).join('')}
        <div class="file-soon">Kmalu nove pustolovščine: ⚽ nogomet, 🏝️ Gran Canaria, 🏫 šola …</div></div>
      <div class="footer"><button class="btn secondary" data-act="tutorial">❓ Kako igram?</button>
        <span class="grow"></span><button class="btn secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>`;
  },

  board() {
    const f = FILES.find(x => x.id === S.file);
    const cases = casesIn(S.file);
    const done = cases.filter(isSolved).length;
    const p = profile();
    const soon = f.soon || 0;
    const letter = letterDue(S.file);
    return `<div class="screen">
      <div class="board-head"><span class="q">${f.icon} ${esc(f.title)}</span>
        <span class="count">✔ ${done} / ${cases.length + soon}</span></div>
      ${fileDone(S.file) ? `<div class="trophy">🏅 Pustolovščina rešena! Bravo, ${esc(detName(p))}!</div>` : ''}
      ${S.toast && S.toast !== 'soon' ? `<div class="toast">${esc(S.toast)}</div>` : ''}
      ${soon && done === cases.length ? `<div class="waiting ${S.toast === 'soon' ? 'flash' : ''}"><span>⏳ Primer ${cases.length + 1} pride kmalu! Medtem reši druge pustolovščine.</span>
        <button class="btn" data-act="toFiles">🗺️ Pojdi</button></div>` : ''}
      ${f.season ? corkboard(f, cases) : ''}
      <div class="board">${cases.map(c => {
        const solved = isSolved(c), locked = isLocked(c);
        return `<button class="folder ${solved ? 'solved' : ''} ${locked ? 'locked' : ''} ${c.final ? 'final' : ''} ${c.no === S.suggest ? 'suggest' : ''}" data-act="${locked ? 'lockedCase' : 'openCase'}" data-no="${c.no}">
          <span class="no">${c.no}</span>${solved ? '<span class="tick">✔</span>' : ''}
          <span class="stk">${locked ? '🔒' : c.sticker}</span>${c.final ? '<span class="place">⭐ Veliki primer</span>' : c.place ? `<span class="place">${esc(c.place)}</span>` : ''}
          <span class="fq">${locked ? 'Odpre se, ko rešiš ostale primere.' : esc(c.question)}</span>
          <span class="lvl">${'🔍'.repeat(c.rung)}</span></button>`;
      }).join('')}${Array.from({ length: soon }, (_, i) => `<button class="folder soon" data-act="soonCase">
          <span class="no">${cases.length + i + 1}</span><span class="stk">❓</span><span class="fq">Kmalu nov primer</span></button>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="toFiles">← 🗺️ Pustolovščine</button>
        <span class="grow"></span><button class="btn secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>${letter ? letterHTML(letter) : ''}`;
  },

  // Step 1 of a step case: the phone rings, the client asks for help.
  call() {
    const c = S.c, r = S.run, cl = CHARACTERS[c.client];
    if (!r.answered) {
      return `<div class="screen center call">
        <div class="case-no">Primer ${c.no}${c.place ? ' · ' + esc(c.place) : ''}</div>
        <div class="phone">📞</div>
        <h1>Zvoni!</h1>
        <div class="suspect">${avatar(c.client)}<span>${esc(cl.name)}</span></div>
        <button class="btn big" data-act="answer">Javi se</button>
        ${backTarget() === 'stay' ? '' : '<button class="btn secondary" data-act="back">← Nazaj</button>'}
      </div>`;
    }
    return `<div class="screen center call">
      <div class="caller">${avatar(c.client, 'sm')}<div class="bubble">${c.call.map((t, i) =>
        `<div class="row" data-act="say" data-clip="${c.id}_c${i + 1}">${esc(t)}</div>`).join('')}</div></div>
      ${qbar(c.question, c.id + '_q', 'big')}
      <div class="suspects mini">${c.suspects.map(id => suspectCard(id, false)).join('')}</div>
      <button class="btn big" data-act="toScene">${c.steps[1] === 'ask' ? 'Zasliši osumljence 🗣️' : 'Na kraj dogodka 🔍'}</button>
    </div>`;
  },

  // Step 2 (instead of the scene): question the suspects. Every question gives one answer.
  ask() {
    const c = S.c, r = S.run;
    const all = c.sentences.length, done = r.found.length === all;
    const qs = r.who ? c.sentences.filter(s => s.who === r.who) : [];
    const chat = r.found.map(sent).filter(s => s.who === r.who);
    const open = qs.filter(s => !r.found.includes(s.id));
    const me = profile() ? profile().av : '🕵️';
    const unq = (t) => t.replace(/^»|«$/g, '');
    return `<div class="screen scene ask">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbar(done ? UI_AUDIO.askDone : UI_AUDIO.ask, done ? 'ui_askDone' : 'ui_ask')}
      <div class="suspects mini">${c.suspects.map(id => {
        const left = c.sentences.filter(s => s.who === id && !r.found.includes(s.id)).length;
        return `<button class="suspect ${r.who === id ? 'on' : ''}" data-act="askWho" data-id="${id}">
          ${avatar(id)}<span>${CHARACTERS[id].name}</span>${left ? '' : '<span class="ok">✔</span>'}</button>`;
      }).join('')}</div>
      <div class="chat">${r.who ? `<div class="chat-head">💬 ${CHARACTERS[r.who].name}</div>` : ''}${chat.map(s => `
        <div class="msg me"><span class="mtxt">${esc(s.ask)}</span><span class="mav">${me}</span></div>
        ${r.typing === s.id ? `<div class="msg them"><span class="mav">${CHARACTERS[s.who].animal}</span><span class="mtxt typing"><i></i><i></i><i></i></span></div>`
          : `<div class="msg them"><span class="mav">${CHARACTERS[s.who].animal}</span><span class="mtxt" data-act="listenClue" data-sid="${s.id}">${esc(unq(s.text))}</span></div>`}`).join('')}
      </div>
      ${open.length && !r.typing ? `<div class="qs">${open.map(s => `<button class="qbtn" data-act="askQ" data-sid="${s.id}">${esc(s.ask)}</button>`).join('')}</div>` : ''}
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="pocket-count">👝 ${r.found.length} / ${all}</span>
        <span class="grow"></span><button class="btn big" data-act="toSolve" ${done ? '' : 'disabled'}>Vem, kdo je bil!</button></div>
    </div>`;
  },

  // Step 2: search the scene. Every object hides one sentence; the dark one needs the torch.
  scene() {
    const c = S.c, r = S.run;
    const all = c.sentences.length, done = r.found.length === all;
    return `<div class="screen scene">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${qbar(done ? UI_AUDIO.sceneDone : UI_AUDIO.scene, done ? 'ui_sceneDone' : 'ui_scene')}
      <div class="toolbar-kid">
        <button class="tool ${r.torch ? 'on' : ''}" data-act="torch">🔦 Svetilka</button>
        <span class="pocket-count">👝 ${r.found.length} / ${all}</span>
      </div>
      <div class="objs ${r.torch ? 'torch' : ''}">${c.sentences.map(s => {
        const got = r.found.includes(s.id);
        return `<button class="obj ${got ? 'got' : ''} ${s.dark && !got ? 'dark' : ''}" data-act="openClue" data-sid="${s.id}">
          <span class="oe">${s.dark && !got ? '🌑' : s.obj}</span><span class="ol">${esc(s.label)}</span>${got ? '<span class="ok">✔</span>' : ''}</button>`;
      }).join('')}</div>
      ${r.note ? `<div class="toast">${esc(r.note)}</div>` : ''}
      <div class="rows pocket">${r.found.slice().reverse().map((sid, i) =>
        `<div class="row ${i === 0 && r.fresh ? 'fresh' : ''}" data-act="listenClue" data-sid="${sid}">${esc(sent(sid).text)}</div>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="grow"></span><button class="btn big" data-act="toSolve" ${done ? '' : 'disabled'}>Vem, kdo je bil!</button></div>
    </div>`;
  },

  // Step 3: cross off everyone with an alibi (sentence + face), then prove it.
  solve() {
    const c = S.c, r = S.run;
    const left = c.suspects.filter(id => !r.crossed.includes(id));
    const t = r.assisted || r.highlight ? elimTarget() : null;
    return `<div class="screen solve ${r.hint ? 'locked' : ''}">
      <div class="caseq">❓ ${esc(c.question)}</div>
      ${left.length === 1 ? qbar(UI_AUDIO.lastOne, 'ui_lastOne') : qbar(UI_AUDIO.solve, 'ui_solve')}
      <div class="suspects mini">${c.suspects.map(id => {
        const x = r.crossed.includes(id);
        return `<button class="suspect ${x ? 'crossed' : ''} ${r.assisted && t && t.who === id ? 'pulse' : ''}" data-act="cross" data-id="${id}">
          ${avatar(id)}<span>${CHARACTERS[id].name}</span>${x ? '<span class="xmark">✖</span>' : ''}</button>`;
      }).join('')}</div>
      ${r.note ? `<div class="toast">${esc(r.note)}</div>` : ''}
      <div class="rows">${c.sentences.map(s => `<div class="row ${r.sel === s.id ? 'selected' : ''}
        ${t && t.sid !== s.id ? 'dim' : ''} ${r.assisted && t && t.sid === s.id ? 'pulse' : ''}" data-act="pickClue" data-sid="${s.id}">${sayHTML(s)}</div>`).join('')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button><span class="grow"></span></div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  intro() {
    const c = S.c;
    return `<div class="screen center">
      <div class="case-no">${S.c.no ? 'Primer ' + S.c.no : '🎓 Vaja'}${c.place ? ' · ' + esc(c.place) : ''}</div>
      <div class="sticker">${c.sticker}</div>
      ${qbar(c.question, c.id + '_q', 'big')}
      <div class="suspects">${c.suspects.map(id => suspectCard(id, false)).join('')}</div>
      <button class="btn big" data-act="toStory">Beri zgodbo</button>
      ${backTarget() === 'stay' ? '' : '<button class="btn secondary" data-act="back">← Nazaj</button>'}
    </div>`;
  },

  story() {
    return `<div class="screen">
      ${qbar(S.c.question, S.c.id + '_q')}
      <div class="rows">${rowsHTML('listen')}</div>
      <div class="footer"><button class="btn secondary" data-act="back" aria-label="Nazaj">←</button>
        <span class="grow"></span><button class="btn big" data-act="know">Vem, kdo je bil!</button></div>
    </div>`;
  },

  accuse() {
    return `<div class="screen center">
      ${qbar(UI_AUDIO.accuse, 'ui_accuse', 'big')}
      <div class="suspects">${S.c.suspects.map(id => suspectCard(id, true)).join('')}</div>
      <button class="btn secondary" data-act="reread">📖 Še enkrat preberi</button>
    </div>`;
  },

  evidence() {
    const r = S.run;
    return `<div class="screen ${r.hint ? 'locked' : ''}">
      <div class="qbar">${avatar(r.suspect, 'sm')}${need() === 2
        ? `<span class="q">${UI_AUDIO.evidencePair}</span>${spk('ui_evidencePair')}`
        : `<span class="q">${UI_AUDIO.evidence}</span>${spk('ui_evidence')}`}</div>
      <div class="rows">${rowsHTML('select')}</div>
      <div class="footer">${evFooter()}</div>
    </div>${r.hint ? hintHTML(r.hint) : ''}`;
  },

  // Solved: a newspaper with the case closed, the culprit's excuse, the explanation, and for a
  // season the new card for the corkboard.
  reveal() {
    const c = S.c, r = S.run, p = profile();
    const f = FILES.find(x => x.id === c.file);
    const me = p && S.orderMode === 'board';
    const sub = me ? (c.caught ? `${detName()} je ${ga('ujel', 'ujela')} ${c.caught}!` : `Bravo, ${detName()}!`) : '';
    const card = c.card && sent(c.card.sid);
    return `<div class="screen center reveal">
      <div class="paper">
        <div class="mast">${esc(f ? f.paper : 'DETEKTIVSKE NOVICE')}</div>
        <div class="qbar"><span class="stamp slam">${UI_AUDIO.solved}</span>${spk('ui_solved')}</div>
        <div class="pic">${me ? `<span class="avatar sm" style="background:#fff">${p.av}</span>` : ''}${avatar(c.culprit, 'sm caught')}<b>${esc(CHARACTERS[c.culprit].name)}</b></div>
        ${me ? `<div class="kudos">${esc(sub)}</div>` : ''}
      </div>
      ${r && r.rankUp ? `<div class="rankup">${ga('Napredoval', 'Napredovala')} si! Zdaj si ${esc(rankName(r.rankUp))}.</div>` : ''}
      ${c.excuse ? `<div class="excuse" data-act="say" data-clip="${c.id}_x">${avatar(c.culprit, 'sm')}<span>»${esc(c.excuse)}«</span></div>` : ''}
      <div class="rows reveal-rows">${c.reveal.map((t, i) => `<div class="row" data-act="say" data-clip="${c.id}_r${i + 1}">${esc(t)}</div>`).join('')}</div>
      ${card ? `<div class="pinned" data-act="say" data-clip="ui_newCard"><span class="pin">📌</span><span class="ci">${c.card.icon}</span>
        <span><b>${UI_AUDIO.newCard}</b><br>${esc(card.text)}</span></div>` : `<div class="sticker">${c.sticker}</div>`}
      <button class="btn big" data-act="next">Naprej</button>
    </div>`;
  },

  more() {
    return `<div class="screen center">
      ${qbar(UI_AUDIO.more, 'ui_more', 'big')}
      <div class="seg"><button class="btn big" data-act="moreYes">Da!</button>
      <button class="btn big secondary" data-act="moreNo">Dovolj za danes</button></div>
    </div>`;
  },

  soon() {
    return `<div class="screen center">
      <div class="sticker">🚧</div>
      ${qbar(UI_AUDIO.soon, 'ui_soon', 'big')}
      <button class="btn big" data-act="toThanks">V redu</button>
    </div>`;
  },

  thanks() {
    return `<div class="screen center">
      <div class="sticker">🏅</div>
      ${qbar(UI_AUDIO.thanks, 'ui_thanks', 'big')}
      ${KID_MODE ? '<button class="btn secondary" data-act="backToBoard">🗂️ Nazaj na primere</button>' : ''}
    </div>`;
  },

  debrief() {
    const sessions = analyzeAll();
    const counted = sessions.filter(s => !s.pilot);
    return `<div class="screen adult">
      <div class="toolbar">
        <h1>Pregled</h1><span class="grow"></span>
        ${S.session && S.resume && !S.ended ? '<button class="btn" data-act="resume">Nadaljuj igro</button>' : ''}
        <button class="btn secondary" data-act="toSetup">Nova seja</button>
        <button class="btn secondary" data-act="exportLog">Izvozi JSON</button>
        <button class="btn danger" data-act="wipe">Izbriši vse</button>
      </div>
      ${storeOk ? '' : '<p class="warn-text">Shranjevanje na napravo ne deluje – takoj izvozi JSON.</p>'}
      <h2>Povzetek po starosti</h2>
      ${['6-7', '8-9'].map(age => groupHTML(age, counted.filter(s => s.age === age))).join('')}
      <h2>Seje (${sessions.length})</h2>
      ${sessions.slice().reverse().map(sessionHTML).join('') || '<p class="muted">Ni podatkov.</p>'}
      <p class="muted">Ponovno branje = ponovno poslušanje stavka, pomik nazaj gor ali »Še enkrat preberi«.
      Ugibanje = potrditev manj kot 4 s po vstopu/namigu ali 3 potrditve v 15 s.
      Izid: rešeno = največ 1 namig; s pomočjo = 2–3 namigi; vodeno = 4. napačen poskus.</p>
    </div>`;
  },
};

// ---------------------------------------------------------------------------
// Actions (all taps go through data-act)
// ---------------------------------------------------------------------------
const ACTIONS = {
  age(el) { S.age = el.dataset.age; render(); },
  pilot(el) { S.pilot = el.checked; },
  startAt(el) { S.startAt = Number(el.dataset.n); render(); },
  orderMode(el) { S.orderMode = el.dataset.mode; render(); },
  resetBoard() {
    if (!confirm('Nov otrok: počistim izkaznico in vse kljukice? Zapisi v pregledu ostanejo.')) return;
    store.write(PLAYED_KEY, []);
    store.write(TUT_KEY, false);   // a new child also gets the practice case
    store.write(PROFILE_KEY, null); // and makes their own ID card
    newPlayer();                    // and is a new anonymous player
    render();
  },
  openFile(el) {
    S.tut = null;
    S.file = el.dataset.file;
    S.toast = null;
    log('file_open', { file: S.file });
    toBoard();
  },
  toFiles() { S.toast = null; toHome(); },
  back() { goBack('button'); },
  // the waiting note says it already; without one (earlier cases unsolved) a toast does
  vent(el) {
    sfx('beep');
    el.classList.remove('peek');
    void el.offsetWidth;
    el.classList.add('peek');
    log('vent_tap');
  },
  soonCase() {
    const cases = casesIn(S.file);
    S.toast = cases.every(isSolved) ? 'soon' : '⏳ Ta primer še ni napisan. Pride kmalu!';
    render();
  },
  lockedCase() {
    S.toast = '🔒 Veliki primer se odpre, ko rešiš ostale primere te pustolovščine.';
    render();
  },
  openCase(el) {
    S.tut = null;
    S.toast = null;
    if (S.c) log('more_yes');
    playCase(Number(el.dataset.no));
  },
  editCard() {
    const p = profile();
    S.mk = { step: 1, av: p.av, g: p.g, sk: p.sk, name: p.name || '', id: p.id };
    go('make');
  },
  mkBack() { S.mk.step--; render(); },
  mkAvatar(el) {
    const a = AVATARS[Number(el.dataset.i)];
    Object.assign(S.mk, { av: a.e, g: a.g, step: 2 });
    render();
  },
  mkSidekick(el) { Object.assign(S.mk, { sk: el.dataset.e, step: 3 }); render(); },
  mkName() {
    S.mk.name = cleanName($('#mkName').value || '');
    S.mk.id = S.mk.id || String(1000 + Math.floor(Math.random() * 9000));
    S.mk.step = 4;
    render();
  },
  mkSkip() { S.mk.name = ''; S.mk.id = S.mk.id || String(1000 + Math.floor(Math.random() * 9000)); S.mk.step = 4; render(); },
  mkDone() {
    const m = S.mk;
    store.write(PROFILE_KEY, { av: m.av, g: m.g, sk: m.sk, name: m.name, id: m.id });
    log('profile_saved', { gender: m.g, named: !!m.name }); // the name itself is never logged
    S.mk = null;
    toHome();
  },
  tutorial() { startTutorial(); },
  startSession() {
    const n = store.read(CHILD_KEY, 0) + 1;
    store.write(CHILD_KEY, n);
    Object.assign(S, {
      session: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      child: 'O' + pad(n), level: KID_MODE ? KID_LEVEL : S.age === '6-7' ? 'A' : 'B', ended: false, resume: null, c: null, run: null,
    });
    S.order = S.orderMode === 'fixed' ? caseOrder() : [];
    S.started = 0;
    log('session_start', { pilot: S.pilot, orderMode: S.orderMode, order: S.order, kid: KID_MODE });
    go('title');
  },
  toDebrief() { go('debrief'); },
  backToBoard() { S.ended = false; log('session_resume'); toBoard(); },
  toSetup() {
    if (S.session && !S.ended) log('session_end', { abandoned: true });
    Object.assign(S, { session: null, ended: false, resume: null, c: null, run: null, level: null, pilot: false, startAt: 0, order: [] });
    go('setup');
  },
  resume() { const to = S.resume; S.resume = null; go(to); },
  timeline(el) { S.open = S.open === el.dataset.key ? null : el.dataset.key; render(); },
  exportLog() {
    const blob = new Blob([JSON.stringify({ app: 'detektivska-pisarna', version: 1, exported: new Date().toISOString(), progress: progressSnapshot(), events: LOG }, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `detektiv-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  },
  wipe() {
    if (!confirm('Izbrišem vse zapise na tej napravi? Najprej izvozi JSON.')) return;
    LOG = [];
    store.write(LOG_KEY, LOG);
    render();
  },

  say(el) {
    play(el.dataset.clip, CLIPS.get(el.dataset.clip) || '', el);
    if (!ADULT.has(S.screen)) log('listen_prompt', { clip: el.dataset.clip });
  },
  begin() { if (S.orderMode === 'board') toHome(); else startCase(0); },
  toStory() { go('story'); },
  listen(el) {
    const s = sent(el.dataset.sid);
    play(S.c.id + '_' + s.id, s.text, el);
    log('listen', { sentenceId: s.id, role: s.role });
    S.run.heard.add(s.id);
    refreshRows();
  },
  know() {
    if (!S.run.scrolledEnd) log('accuse_early');
    go('accuse');
  },
  reread() { log('back_to_story'); go('story'); },
  pick(el) {
    if (S.tut && el.dataset.id !== S.c.culprit) {
      S.tut.msg = 'Hmm, ni še prav. Kdo je pojedel korenček? Preberi še enkrat.';
      coach();
      return;
    }
    S.run.suspect = el.dataset.id;
    S.run.picks = [];
    log('suspect_pick', { suspectId: el.dataset.id });
    go('evidence');
  },
  select(el) {
    const r = S.run;
    if (r.hint) return;
    const s = sent(el.dataset.sid);
    // tap again to take a pick back; a new pick past the limit replaces the oldest
    if (r.picks.includes(s.id)) r.picks = r.picks.filter(id => id !== s.id);
    else r.picks = [...r.picks, s.id].slice(-need());
    play(S.c.id + '_' + s.id, s.text, el);
    log('evidence_select', { sentenceId: s.id, role: s.role });
    r.heard.add(s.id);
    refreshRows();
    $('.footer').innerHTML = evFooter();
    coach();
  },
  confirm() {
    const r = S.run, c = S.c;
    if (r.picks.length !== need() || r.hint) return;
    const ss = r.picks.map(sent);
    const hits = ss.filter(x => x.role === 'evidence');
    const isEvidence = hits.length === need();
    const rightSuspect = r.suspect === c.culprit;
    const solved = isEvidence && (rightSuspect || r.assisted);
    const miss = ss.find(x => x.role !== 'evidence');
    if (S.tut) {
      // Practice: no hint ladder and no tick on the board, just a gentle nudge.
      if (solved) { go('reveal'); return; }
      r.picks = [];
      refreshRows();
      $('.footer').innerHTML = evFooter();
      S.tut.msg = 'To ni ta stavek. Poišči, kje piše, kdo je pojedel korenček.';
      coach();
      return;
    }
    log('evidence_confirm', {
      sentenceId: (miss || ss[0]).id, sentenceIds: r.picks, role: miss ? miss.role : 'evidence',
      suspectId: r.suspect, correct: solved, suspectCorrect: rightSuspect,
    });
    if (solved) {
      log('case_done', { assisted: r.assisted, wrong: r.wrong });
      markSolved(S.c);
      go('reveal');
      return;
    }
    r.wrong++;
    // a pair with one right proof keeps that one picked, so the child looks for the other
    r.picks = isEvidence ? [] : hits.map(x => x.id);
    let h;
    if (r.assisted || r.wrong >= 4) {
      if (!r.assisted) { r.assisted = true; log('assisted'); }
      h = need() === 2 ? { key: 'assist', text: UI_AUDIO.assistPair, clip: 'ui_assistPair', level: 4 }
        : { key: 'assist', text: UI_AUDIO.assist, clip: 'ui_assist', level: 4 };
    } else if (isEvidence) {
      r.badSuspect = true;
      h = { key: 'wrongSuspect', text: UI_AUDIO.wrongSuspect, clip: 'ui_wrongSuspect', level: 0 };
    } else if (hits.length) {
      h = { key: 'pairHalf', text: UI_AUDIO.pairHalf, clip: 'ui_pairHalf', level: 0 };
    } else if (miss.role === 'partial') {
      h = c.type === 'alibi' ? { key: 'partial', text: UI_AUDIO.partialAlibi, clip: 'ui_partialAlibi', level: 0 }
        : { key: 'partial', text: UI_AUDIO.partial, clip: 'ui_partial', level: 0 };
    } else {
      r.ladder = Math.min(r.ladder + 1, 3);
      h = ladderHint(r.ladder);
      if (r.ladder >= 2) r.highlight = new Set(r.ladder === 2 ? c.h2 : c.h3);
    }
    showHint(h);
  },
  hintOk() {
    S.run.hint = null;
    stopAudio();
    const h = $('#hint');
    if (h) h.remove();
    $('.screen').classList.remove('locked');
    log('hint_dismiss');
  },
  // ---- step cases
  answer() {
    S.run.answered = true;
    log('call_answer');
    render();
    play(S.c.id + '_c1', S.c.call[0], $('.bubble .row'));
  },
  toScene() { go(S.c.steps[1]); },
  askWho(el) {
    const r = S.run;
    r.who = el.dataset.id;
    r.note = null;
    sfx('click');
    render();
  },
  // the question goes out, the suspect "types" for a moment, then the answer arrives
  askQ(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.typing || r.found.includes(s.id)) return;
    r.found.push(s.id);
    r.heard.add(s.id);
    r.typing = s.id;
    sfx('click');
    log('ask_q', { suspectId: s.who, sentenceId: s.id, role: s.role, n: r.found.length });
    render();
    setTimeout(() => {
      if (S.screen !== 'ask' || r.typing !== s.id) return;
      r.typing = null;
      sfx('pop');
      render();
      play(S.c.id + '_' + s.id, s.text, document.querySelector(`.msg [data-sid="${s.id}"]`));
    }, 900);
  },
  torch() {
    const r = S.run;
    r.torch = !r.torch;
    r.note = null;
    sfx('click');
    log('tool_use', { tool: 'torch', on: r.torch });
    render();
  },
  openClue(el) {
    const r = S.run, s = sent(el.dataset.sid);
    if (r.found.includes(s.id)) { play(S.c.id + '_' + s.id, s.text); return; }
    if (s.dark && !r.torch) {
      r.note = UI_AUDIO.dark;
      sfx('nope');
      log('clue_dark', { sentenceId: s.id });
      render();
      play('ui_dark', UI_AUDIO.dark);
      return;
    }
    r.found.push(s.id);
    r.fresh = true;
    r.note = null;
    r.heard.add(s.id);
    sfx('pop');
    log('clue_open', { sentenceId: s.id, role: s.role, n: r.found.length });
    render();
    play(S.c.id + '_' + s.id, s.text, $('.pocket .row'));
  },
  listenClue(el) {
    const s = sent(el.dataset.sid);
    play(S.c.id + '_' + s.id, s.text, el);
    log('listen', { sentenceId: s.id, role: s.role });
  },
  toSolve() {
    S.run.note = null;
    S.run.fresh = false;
    go('solve');
  },
  pickClue(el) {
    const r = S.run;
    if (r.hint) return;
    const s = sent(el.dataset.sid);
    r.sel = r.sel === s.id ? null : s.id;
    r.note = null;
    log('evidence_select', { sentenceId: s.id, role: s.role });
    render();
    if (r.sel) play(S.c.id + '_' + s.id, s.text, document.querySelector(`.rows [data-sid="${s.id}"]`));
  },
  // A clue + a face: an alibi crosses the suspect off, the proof + the culprit solves the case.
  cross(el) {
    const r = S.run, c = S.c, id = el.dataset.id;
    if (r.hint || r.crossed.includes(id)) return;
    if (!r.sel) {
      r.note = UI_AUDIO.pickFirst;
      render();
      play('ui_pickFirst', UI_AUDIO.pickFirst);
      return;
    }
    const s = sent(r.sel);
    const proof = s.role === 'evidence' && id === c.culprit;
    const alibi = s.role === 'clear' && s.clears === id;
    log('evidence_confirm', { sentenceId: s.id, sentenceIds: [s.id], role: s.role, suspectId: id, correct: proof || alibi, suspectCorrect: id === c.culprit, kind: proof ? 'proof' : 'cross' });
    r.sel = null;
    if (alibi) {
      r.crossed.push(id);
      r.highlight = null;
      sfx('stamp');
      render();
      const x = document.querySelector(`.suspect[data-id="${id}"]`);
      if (x) x.classList.add('justcrossed');
      return;
    }
    if (proof) {
      r.crossed = c.suspects.filter(x => x !== c.culprit);
      log('case_done', { assisted: r.assisted, wrong: r.wrong });
      markSolved(c);
      sfx('tada');
      go('reveal');
      return;
    }
    r.wrong++;
    sfx('nope');
    let h;
    if (r.assisted || r.wrong >= 4) {
      if (!r.assisted) { r.assisted = true; log('assisted'); }
      h = { key: 'assist', text: UI_AUDIO.elimAssist, clip: 'ui_elimAssist', level: 4 };
    } else if (r.wrong === 3) {
      r.highlight = true;
      h = { key: 'h2', text: UI_AUDIO.elimLook, clip: 'ui_elimLook', level: 2 };
    } else if (r.wrong === 2) {
      h = { key: 'h1', text: c.h1, clip: c.id + '_h1', level: 1 };
    } else if (s.who === id && s.role !== 'clear') {
      h = { key: 'selfClaim', text: UI_AUDIO.selfClaim, clip: 'ui_selfClaim', level: 0 };
    } else if (s.role === 'clear' || s.role === 'evidence') {
      h = { key: 'notWho', text: UI_AUDIO.notWho, clip: 'ui_notWho', level: 0 };
    } else {
      h = { key: 'notThis', text: UI_AUDIO.notThis, clip: 'ui_notThis', level: 0 };
    }
    r.hint = h;
    log('hint_shown', { hint: h.key, hintLevel: h.level });
    render();
  },
  letterOk(el) {
    const mail = store.read(LETTER_KEY, { pending: [], read: [] });
    const id = el.dataset.id;
    store.write(LETTER_KEY, { pending: mail.pending.filter(x => x.id !== id), read: [...mail.read, id] });
    log('letter_read', { letter: id });
    render();
  },
  changeSuspect() {
    log('suspect_change');
    S.run.picks = [];
    go('accuse');
  },
  next() {
    if (S.tut) { endTutorial(); return; }
    if (S.c && S.c.card) S.pinNew = S.c.id;
    if (S.orderMode === 'board') toBoard(); else go('more');
  },
  moreYes() {
    if (S.caseNo < S.order.length - 1) { log('more_yes'); startCase(S.caseNo + 1); }
    else { log('fake_door'); go('soon'); }
  },
  moreNo() { log('more_no'); go('thanks'); },
  toThanks() { go('thanks'); },
};

  const el = e.target.closest('[data-act]');
