<html lang="sl">
<head>
<meta charset="utf-8">

<title>Detektivska pisarna</title>
<style>
:root {
  /* iOS blurs a strip below the status bar (Safari 26), so the top inset gets half again as much room. */
  --safe-top: calc(env(safe-area-inset-top) * 1.5);
  --bg: #fdf6e9; --ink: #2b2a33; --muted: #6b6876; --card: #fff; --line: #e6dcc8;
  --accent: #3d6fd8; --accent-ink: #fff; --heard: #eef3ff; --sel: #ffe9a8; --sel-line: #e0a800;
  --good: #dff3e6; --warn: #fff1cc; --bad: #fbe0dc; --danger: #c0392b;
  --row-font: 24px;
}
/* In the Safari browser (not from the home screen) the inset is 0, but the blur still reaches about 30 px
   into the page; a phone held upright always keeps that much room on top. */
@media (pointer: coarse) and (orientation: portrait) { :root { --safe-top: max(calc(env(safe-area-inset-top) * 1.5), 32px); } }
.level-A { --row-font: 30px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
}
input { -webkit-user-select: text; user-select: text; font: inherit; }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }   /* a slam animation never widens the page */
.screen {
  flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 900px; margin: 0 auto;
  padding: calc(16px + var(--safe-top)) max(24px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
/* Centred screens scroll when the content is taller than the screen (small phones), instead of cutting off the top. */
.center { justify-content: flex-start; align-items: center; text-align: center; gap: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.center > :first-child { margin-top: auto; }
.center > :last-child { margin-bottom: auto; }
h1 { font-size: 40px; margin: .2em 0; }
h2 { font-size: 28px; margin: 1em 0 .4em; }
h3 { margin: 0 0 .5em; }
.muted { color: var(--muted); }
.btn {
  appearance: none; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-size: 24px; font-weight: 600; padding: 14px 28px; min-height: 60px; cursor: pointer;
}
.btn:disabled { opacity: .35; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.btn.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: var(--card); color: var(--danger); border: 2px solid var(--danger); }
.btn.big { font-size: 32px; padding: 20px 48px; }
.spk {
  appearance: none; border: 2px solid var(--line); background: var(--card); border-radius: 50%;
  width: 56px; height: 56px; flex: none; font-size: 26px; cursor: pointer;
}
.spk.playing { border-color: var(--accent); }
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.qbar .q { font-size: 28px; font-weight: 700; }
.center .qbar { justify-content: center; }
.qbar.big .q { font-size: 40px; }
.case-no { color: var(--muted); font-weight: 600; }
.rows {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 12px;
}
.row {
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px;
  min-height: 56px; font-size: var(--row-font); line-height: 1.35; display: flex; align-items: center;
  cursor: pointer; text-align: left; transition: opacity .2s; flex: none;
}
.row.heard { background: var(--heard); }
.row.playing { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 111, 216, .25); }
.row.selected { background: var(--sel); border-color: var(--sel-line); }
.row.dim { opacity: .3; }
.pick-count { font-weight: 700; color: var(--muted); }
.row.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(224, 168, 0, .45); } }
.footer { display: flex; gap: 12px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding-top: 12px; }
.locked .rows, .locked .footer { pointer-events: none; }
.locked .footer { opacity: .4; }
.suspects { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.suspect {
  appearance: none; font: inherit; color: inherit; background: var(--card); border: 2px solid var(--line);
  border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  min-width: 140px; font-size: 24px; font-weight: 600;
}
button.suspect { cursor: pointer; }
.avatar { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; }
.avatar.sm { width: 56px; height: 56px; font-size: 32px; flex: none; }
.sticker { font-size: 88px; line-height: 1; }
.stamp {
  font-size: 40px; font-weight: 800; color: var(--danger); border: 6px solid var(--danger);
  border-radius: 12px; padding: 6px 22px; transform: rotate(-5deg);
}
.reveal-rows { flex: none; width: 100%; max-width: 720px; }
.board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.board-head .q { font-size: 30px; font-weight: 800; }
.board-head .count { margin-left: auto; font-size: 22px; font-weight: 700; color: var(--muted); }
.board {
  flex: 1; min-height: 170px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; align-content: start;
  grid-auto-rows: max-content;   /* a short board (big text, small phone) scrolls; its rows never squash a folder below its text */
  background: #d9b48a; border: 10px solid #a8763f; border-radius: 18px;
}
.folder {
  appearance: none; font: inherit; color: inherit; cursor: pointer; position: relative; text-align: center;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 6px 16px 14px 14px; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 170px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
}
.folder .no { position: absolute; top: 6px; left: 10px; font-weight: 800; color: var(--muted); font-size: 16px; }
.folder .stk { font-size: 52px; line-height: 1.1; }
.folder .fq { font-size: 18px; font-weight: 600; line-height: 1.25; }
.folder .place { font-size: 14px; font-weight: 700; color: #1f7a8c; background: #dff4f7; border-radius: 8px; padding: 0 6px; }
.folder .lvl { font-size: 15px; letter-spacing: 1px; margin-top: auto; }
.folder.solved { background: #e9f6ec; border-color: #9fd3ad; }
.folder.solved .stk { opacity: .55; }
.folder .tick {
  position: absolute; top: 34px; right: 8px; font-size: 22px; font-weight: 900; color: var(--danger);
  border: 3px solid var(--danger); border-radius: 8px; padding: 0 6px; transform: rotate(-8deg); background: rgba(255, 255, 255, .8);
}
.folder.suggest { border-color: var(--sel-line); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(224, 168, 0, .45); } }
/* first-time tutorial: Babica (owl) coach bubble + the thing to tap glows */
.coach {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 20px)); z-index: 20;
  display: flex; gap: 12px; align-items: center; background: #fff; border: 3px solid var(--accent); border-radius: 20px;
  padding: 10px 14px; font-size: 22px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); animation: coachIn .3s ease-out;
}
.coach.top { top: calc(10px + var(--safe-top)); }
.coach.bottom { bottom: calc(10px + env(safe-area-inset-bottom)); }
.coach .owl { font-size: 44px; line-height: 1; flex: none; }
.coach .say { flex: 1; }
.coach .btn { flex: none; }
@keyframes coachIn { from { opacity: 0; transform: translateX(-50%) scale(.9); } }
.coach-target { outline: 4px solid var(--sel-line); outline-offset: 4px; border-radius: 16px; animation: pulse 1.1s ease-in-out infinite; }
/* the rest of the screen dims around the target, a thick ring breathes and a finger bounces at it */
.coach-spot { position: fixed; z-index: 19; pointer-events: none; border-radius: 18px; border: 5px solid #ffc400;
  box-shadow: 0 0 0 100vmax rgba(20, 24, 40, .45); animation: ring-breathe 1s ease-in-out infinite; }
@keyframes ring-breathe { 50% { border-color: #ff8a00; outline: 6px solid rgba(255, 196, 0, .5); outline-offset: 4px; } }
.coach-hand { position: fixed; z-index: 21; pointer-events: none; font-size: 54px; line-height: 1; transform: translateX(-50%);
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .35)); animation: hand-up .8s ease-in-out infinite; }
.coach-hand.down { animation-name: hand-down; }
@keyframes hand-up { 50% { margin-top: -14px; } }
@keyframes hand-down { 50% { margin-top: 14px; } }
@media (prefers-reduced-motion: reduce) { .coach-spot, .coach-hand { animation: none; } }
/* Detective ID card */
.idcard {
  width: min(440px, 100%); background: linear-gradient(135deg, #fffaf0, #f3e6c9); border: 2px solid #d9c08f;
  border-radius: 16px; padding: 10px 14px 12px; text-align: left; box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
}
.id-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: #8a6a2f; }
.id-body { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
.id-photo { font-size: 64px; line-height: 1; background: #fff; border: 2px solid #e2cfa4; border-radius: 12px; padding: 4px 8px; }
.id-text { display: flex; flex-direction: column; gap: 2px; font-size: 17px; }
.id-text b { font-size: 24px; }
.id-stamps { display: flex; gap: 8px; }
.stamp-slot { font-size: 22px; width: 38px; height: 38px; border: 2px dashed #d9c08f; border-radius: 50%; display: flex; align-items: center; justify-content: center; filter: grayscale(1); opacity: .35; }
.stamp-slot.got { filter: none; opacity: 1; border: 2px solid var(--danger); transform: rotate(-8deg); background: #fff; }
.files-screen { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 12px; }
.files-card { position: relative; display: flex; justify-content: center; }
.who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; width: 100%; max-width: 720px; margin: 12px 0; }
.who-card { appearance: none; font: inherit; color: inherit; cursor: pointer; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.who-card .who-av { font-size: 56px; line-height: 1.1; }
.who-card .rank, .who-card .muted { font-size: 15px; color: var(--muted); }
.who-card.add { border-style: dashed; }
.files-card .edit { position: absolute; bottom: 10px; right: max(10px, calc(50% - 210px)); min-height: 40px; padding: 4px 10px; font-size: 18px; }
.file-list { display: flex; flex-direction: column; gap: 10px; }
.file-card {
  appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 18px; padding: 12px 16px; box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
}
.file-card.hero { padding: 16px 18px; border-width: 3px; box-shadow: 0 5px 0 rgba(0, 0, 0, .14); }
.file-card.hero .fi { font-size: 60px; }
.file-card .go { align-self: flex-start; margin-top: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 22px; border-radius: 14px; padding: 6px 18px; }
.shelf { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.shelf-head { font-weight: 800; font-size: 18px; color: #8a6a2f; }
.medals { display: flex; flex-wrap: wrap; gap: 10px; }
.medal { appearance: none; font: inherit; cursor: pointer; position: relative; width: 64px; height: 64px; border-radius: 16px; background: #e9f6ec; border: 2px solid #9fd3ad; box-shadow: 0 3px 0 rgba(0, 0, 0, .12); font-size: 34px; display: flex; align-items: center; justify-content: center; }
.medal .mm { position: absolute; right: -6px; bottom: -6px; font-size: 22px; }
.medal.arrive { animation: arrive .8s .3s both; }
@keyframes arrive { from { transform: translateY(-120px) scale(1.6); opacity: 0; } 70% { transform: translateY(6px) scale(.95); opacity: 1; } }
.file-card .fi { font-size: 48px; line-height: 1; }
.file-card .ft { flex: 1; display: flex; flex-direction: column; }
.file-card .ft b { font-size: 22px; }
.file-card .cast { font-size: 24px; letter-spacing: 2px; }
.file-card .fp { font-weight: 800; color: var(--muted); font-size: 18px; white-space: nowrap; }
.soon-head { font-weight: 800; font-size: 18px; color: var(--muted); margin-top: 6px; }
.file-card.teaser { cursor: default; background: #f6f3ee; border: 2px dashed #cfc6b6; box-shadow: none; }
.file-card.teaser .fi { filter: saturate(.7); }
.file-card .tz { font-size: 17px; color: var(--muted); }
.file-card .when { font-weight: 800; font-size: 17px; color: #8a6a2f; background: #fff3cf; border-radius: 12px; padding: 4px 10px; white-space: nowrap; }
.file-card.teaser.wiggle { animation: wiggle .4s; }
@keyframes wiggle { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.folder.final { background: #fff0f6; border-color: #f0b8d0; }
.folder.locked { cursor: pointer; }
.folder.locked .stk { filter: grayscale(1); opacity: .6; }
.folder.locked .fq { color: var(--muted); font-weight: 500; }
.caseq { font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 6px; }
.toast { background: var(--warn); border: 2px solid var(--sel-line); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; }
.kudos { font-size: 22px; font-weight: 800; color: var(--accent); }
/* ID card maker */
.make { gap: 16px; }
.mk-top { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; min-height: 44px; }
.mk-back { min-height: 44px; padding: 4px 14px; font-size: 18px; }
.steps-dots { display: flex; gap: 8px; }
.steps-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.steps-dots i.on { background: var(--accent); }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(90px, 140px)); gap: 12px; justify-content: center; }
.pick-grid.four { grid-template-columns: repeat(4, minmax(70px, 120px)); }
.pick {
  appearance: none; font: inherit; color: var(--muted); cursor: pointer; background: var(--card); border: 3px solid var(--line);
  border-radius: 18px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; font-weight: 600;
}
.pick.on { border-color: var(--accent); background: var(--heard); }
.pick .pe { font-size: 56px; line-height: 1.1; }
.name-in { font-size: 28px; padding: 10px 16px; border: 3px solid var(--line); border-radius: 16px; width: min(320px, 100%); text-align: center; background: #fff; }
.name-in:focus { outline: none; border-color: var(--accent); }
.trophy .btn { min-height: 40px; padding: 4px 12px; font-size: 17px; margin-left: 6px; }
.trophy { background: var(--good); border-radius: 14px; padding: 8px 14px; font-weight: 700; margin-bottom: 10px; text-align: center; }
.hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
  width: min(860px, calc(100% - 32px)); background: #fffbe9; border: 3px solid var(--sel-line); border-radius: 20px;
  padding: 14px 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
  font-size: 26px; z-index: 10;
}
.hint .txt { flex: 1; }
.hint .hi { font-size: 34px; line-height: 1; }
.hint.no { border-color: #d9534f; background: #fff1f0; }
.hint.no .hi, .hint.no .verdict { color: #c9302c; }
.hint.tip { border-color: var(--sel-line); }
.hint .verdict { display: block; font-size: 1.1em; }
/* »Najprej navodilo«: the step's instruction card, the truth after UGOVOR, the message card */
.brief-wrap { position: fixed; inset: 0; background: rgba(43, 42, 51, .45); display: flex; align-items: center; justify-content: center; z-index: 25;
  padding: calc(16px + var(--safe-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
.brief { background: #fffdf3; border: 3px solid var(--sel-line); border-radius: 22px; padding: 18px; width: min(560px, 100%); max-height: 100%; overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); animation: briefin .35s both; }
.brief .btitle { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; }
.brief .bi { font-size: 44px; line-height: 1; }
.brief .row { margin: 0; }
.brief .bhow { background: #fff6d6; border-color: var(--sel-line); font-weight: 600; }
.brief .btn.big { align-self: stretch; }
.brief.truth { border-color: #7a5cd6; }
.brief.truth .bnote { font-size: calc(var(--row-font, 20px) + 2px); }
@keyframes briefin { from { transform: translateY(24px) scale(.96); opacity: 0; } }
.note-back { position: fixed; inset: 0; z-index: 19; background: rgba(43, 42, 51, .25); }
.hint.note { z-index: 20; animation: notein .3s both; }
.hint.note .txt { font-weight: 600; }
.hint.good { border-color: #6fc287; background: #effaf2; }
.brief-wrap.later, .brief-wrap.later .brief { animation-delay: 1.6s; }
.brief-wrap.later { animation: fadein .3s 1.6s both; }
.brief.excuse-card { border-color: var(--danger); }
.brief.excuse-card .btitle .avatar { flex: none; }
.brief.excuse-card .bnote { font-size: calc(var(--row-font, 20px) + 2px); font-style: italic; }
.row.used { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--danger); opacity: .55; pointer-events: none; }
@keyframes notein { from { transform: translateX(-50%) translateY(24px); opacity: 0; } }
.hint.note.nudge { animation: nudge .45s; }
@keyframes nudge { 20%, 60% { transform: translateX(calc(-50% - 10px)); } 40%, 80% { transform: translateX(calc(-50% + 10px)); } }
.qbar .bq, .row.wnote { cursor: pointer; }
.row.wnote { position: relative; }
.qbar .bq::after, .row.wnote::after { content: '?'; display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em;
  margin-left: 8px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .7em; font-weight: 800; vertical-align: middle; }
.row.wnote::after { position: absolute; right: -8px; top: -8px; margin: 0; box-shadow: 0 0 0 3px var(--bg); }
/* step cases: phone call, scene search, crossing off */
.phone { font-size: 96px; line-height: 1; animation: ring .5s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.caller { display: flex; gap: 12px; align-items: flex-start; width: 100%; max-width: 640px; text-align: left; }
.bubble { flex: 1; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 3px solid var(--accent); border-radius: 4px 20px 20px 20px; padding: 8px; }
.bubble .row { border: 0; min-height: 0; padding: 4px 8px; }
.suspects.mini { gap: 8px; flex-wrap: nowrap; }
.suspects.mini .suspect { min-width: 0; padding: 8px 10px; font-size: 18px; gap: 4px; position: relative; flex: 1 1 0; max-width: 150px; }
.suspects.mini .avatar { width: 60px; height: 60px; font-size: 34px; }
.suspect.crossed { opacity: .55; background: #eee; }
.suspect.crossed .avatar { filter: grayscale(1); }
.suspect .xmark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; color: var(--danger); font-weight: 900; }
.suspect.justcrossed .xmark { animation: slam .35s cubic-bezier(.2, 1.6, .4, 1); }
.suspect.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.toolbar-kid { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.tool { appearance: none; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 6px 14px; }
.tool.on { background: #fff6c2; border-color: var(--sel-line); box-shadow: 0 0 18px rgba(255, 210, 0, .7); }
.tool.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.pocket-count { margin-left: auto; font-weight: 800; color: var(--muted); }
.ask .suspect.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.ask .suspect .ok { position: absolute; top: 4px; right: 6px; color: #2e9d57; font-weight: 800; }
.ask .suspect { position: relative; }
.chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px; }
.chat-head { text-align: center; color: var(--muted); font-weight: 700; font-size: 16px; }
.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.me { justify-content: flex-end; }
.msg .mav { font-size: 28px; line-height: 1; flex: none; }
.msg .mtxt { max-width: 75%; padding: 8px 14px; border-radius: 20px; font-size: var(--row-font, 24px); }
.msg:last-child .mtxt { animation: fadein .25s both; }
.msg.me .mtxt { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.them .mtxt { background: #fff; border: 2px solid var(--line); border-bottom-left-radius: 4px; cursor: pointer; }
.typing i { display: inline-block; width: 8px; height: 8px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-5px); opacity: .4; } }
.qs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin: 4px 0 8px; flex: none; }
.qbtn { appearance: none; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer; background: #fff; color: var(--accent); border: 3px solid var(--accent); border-radius: 20px; padding: 8px 14px; }
.row .who { font-weight: 700; color: var(--muted); }
.nm { font-weight: 800; }
.objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 8px; flex: none; }
.obj {
  appearance: none; font: inherit; color: inherit; cursor: pointer; position: relative; background: #fff3cf; border: 2px solid #e2c98f;
  border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
}
.obj .oe { font-size: 40px; line-height: 1.1; }
.obj .ol { font-size: 14px; font-weight: 700; color: var(--muted); }
.obj.got { background: #e9f6ec; border-color: #9fd3ad; }
.obj.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.obj .ok { position: absolute; top: 2px; right: 6px; color: #2e8b57; font-weight: 900; }
.obj.dark { background: #2b2a33; border-color: #111; }
.obj.dark .ol { color: #aaa; }
.objs.torch .obj.dark { box-shadow: 0 0 0 4px rgba(255, 220, 0, .8), 0 0 24px rgba(255, 220, 0, .8); }
.pocket .row.fresh { animation: drop .4s ease-out; }
@keyframes drop { from { transform: translateY(-16px) scale(1.05); background: var(--sel); } }
/* solved: newspaper + stamp slam, excuse, rank-up, pinned card */
.paper { background: #fbf8f1; border: 2px solid #cfc6b0; border-radius: 6px; padding: 8px 16px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(520px, 100%); animation: spin-in .6s ease-out; }
@keyframes spin-in { from { transform: rotate(-200deg) scale(.1); opacity: 0; } }
.paper .mast { font-family: Georgia, "Times New Roman", serif; font-weight: 900; letter-spacing: 2px; font-size: 20px; border-bottom: 3px double #2b2a33; width: 100%; text-align: center; }
.paper .qbar { margin: 4px 0 0; }
.paper .pic { display: flex; align-items: center; gap: 8px; font-size: 20px; }
.stamp.slam { animation: slam .45s .25s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { from { transform: rotate(-8deg) scale(3); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
.avatar.caught { animation: blush 1.2s ease-in-out .9s 2; }
@keyframes blush { 25% { transform: rotate(-10deg); box-shadow: 0 0 0 6px #ffb3b3; } 75% { transform: rotate(10deg); } }
.rankup { background: #fff0c2; border: 3px solid var(--sel-line); border-radius: 14px; padding: 6px 14px; font-weight: 800; animation: slam .45s 1s both; }
.excuse { display: flex; align-items: center; gap: 10px; font-style: italic; font-size: 20px; cursor: pointer; }
.pinned { display: flex; align-items: center; gap: 10px; background: #e8c9a0; border: 3px solid #a8763f; border-radius: 12px; padding: 8px 14px; text-align: left; position: relative; cursor: pointer; animation: drop .5s 1.2s both; }
.pinned .pin, .pincard::before { font-size: 22px; }
.pinned .ci { font-size: 36px; }
/* season corkboard + letters */
.cork { background: #d9b48a; border: 6px solid #a8763f; border-radius: 14px; padding: 6px 10px 10px; margin-bottom: 10px; flex: none; }
.cork-q { font-weight: 800; font-size: 20px; margin-bottom: 6px; }
.pins { display: flex; align-items: center; overflow-x: auto; }
.pincard { flex: none; width: 120px; min-height: 76px; background: #fffdf3; border-radius: 4px; padding: 14px 8px 6px; font-size: 14px; position: relative;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transform: rotate(-2deg); cursor: pointer; }
.pincard::before { content: '📌'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
.pincard .ci { display: block; font-size: 24px; }
.pincard.empty { background: rgba(255, 255, 255, .35); border: 2px dashed #8a6a2f; box-shadow: none; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #8a6a2f; transform: none; cursor: default; }
.pincard.empty::before { content: none; }
.string { flex: none; width: 16px; height: 3px; background: var(--danger); }
.string.draw { transform-origin: left; animation: draw .5s .5s ease-out both; }
.pincard.new { animation: flyin .7s ease-out both; }
@keyframes draw { from { transform: scaleX(0); } }
@keyframes flyin { from { transform: translateY(-120px) rotate(-25deg) scale(1.4); opacity: 0; } }
.think { margin-top: 8px; background: #fff; border-radius: 16px; padding: 6px 12px; font-weight: 600; font-size: 18px; animation: fadein .4s 1s both; cursor: pointer; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
.cork-q { display: flex; align-items: center; gap: 8px; }
.vent { appearance: none; margin-left: auto; width: 54px; height: 30px; border-radius: 6px; border: 3px solid #6b5333; cursor: pointer; position: relative;
  background: repeating-linear-gradient(0deg, #3b2f22 0 4px, #6b5333 4px 8px); }
.vent .eyes { font-size: 16px; animation: blink 4s infinite; display: inline-block; }
@keyframes blink { 0%, 60%, 100% { opacity: 0; } 66%, 90% { opacity: 1; } 93% { opacity: .2; } }
.vent.peek .eyes { animation: none; opacity: 1; }
.vent.peek::after { content: attr(data-say); position: absolute; top: -26px; right: -6px; background: #fff; border-radius: 10px; padding: 0 6px; font-size: 14px; font-weight: 700; animation: fadein .2s both; }
.waiting { background: var(--good); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex: none; }
.waiting span { flex: 1; }
.waiting .btn { padding: 8px 14px; font-size: 18px; }
.waiting.flash { animation: pulse .5s ease-in-out 2; }
/* security camera (call screen) and the vent guess (corkboard) */
.film { width: min(440px, 100%); background: #1d2433; color: #fff; border-radius: 16px; padding: 8px 10px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .2); }
.film-top { display: flex; justify-content: space-between; font: 700 14px ui-monospace, monospace; opacity: .85; }
.film-top .rec { color: #ff5a5a; animation: rec 1.4s steps(2) infinite; }
@keyframes rec { 50% { opacity: .25; } }
.film-pic { font-size: 64px; line-height: 1.3; padding: 6px 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 5px); border-radius: 10px; cursor: pointer; animation: fadein .4s both; }
.film-pic.blur { filter: blur(4px) grayscale(1); }
.film .row { background: #fff; color: var(--ink, #222); margin: 6px 0 8px; }
.film-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.film-nav .steps-dots { flex: 1; }
.film-nav .steps-dots i { background: #4a5468; }
.film-nav .steps-dots i.on { background: #ffc400; }
.guess { margin-top: 8px; background: #fff; border-radius: 14px; padding: 6px 8px; }
.guess .row { margin: 0 0 6px; border: 0; padding: 4px 6px; font-weight: 700; }
.guess-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.guess-opts .btn { flex: 1 1 auto; padding: 8px 10px; font-size: 18px; }
.guess.done { font-weight: 700; font-size: 17px; padding: 6px 12px; }
/* 🔐 code lock */
.padlock { position: relative; padding-top: 54px; }
.padlock .shackle { position: absolute; top: 0; left: 50%; width: 120px; height: 90px; margin-left: -60px; border: 16px solid #9aa3b2; border-bottom: 0; border-radius: 60px 60px 0 0; transition: transform .4s ease-out; transform-origin: 104px 90px; }
.padlock.open .shackle { transform: translateY(-18px) rotate(25deg); }
.lockbody { position: relative; display: flex; gap: 10px; background: linear-gradient(#f2c14e, #d79a1e); border-radius: 22px; padding: 16px 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); }
.wheel { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 14px; border: 3px solid #a87410; }
.wbtn { appearance: none; border: 0; background: none; font-size: 26px; width: 64px; height: 52px; cursor: pointer; color: #6b4d0e; }
.wbtn:disabled { opacity: .3; }
.digit { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; padding: 2px 0; }
.padlock.open .lockbody { background: linear-gradient(#bfe8c8, #6fc287); }
.padlock.shake { animation: wobble .4s; }
@keyframes wobble { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.toast.good { background: var(--good); }
/* 🕐 timeline: numbered slots, the mixed cards below */
.twrap { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 560px; }
.tslots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tslot { display: flex; align-items: center; gap: 8px; min-height: 40px; border-radius: 14px; }
.tslot.empty { border: 3px dashed var(--line); }
.tslot.good .tcard { background: var(--good); border-color: #6fc287; }
.tn { flex: 0 0 34px; height: 34px; margin-left: 4px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; display: grid; place-items: center; }
.tdeck { display: flex; flex-direction: column; gap: 6px; }
.tcard { appearance: none; flex: 1; display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; font-size: 20px; font-weight: 600; color: var(--ink); background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 8px 12px; cursor: pointer; }
.tcard .te { font-size: 26px; }
.tcard:disabled { cursor: default; }
.tdeck .tcard { box-shadow: 0 3px 0 var(--line); }
.orderstep.done .wnote { display: none; }
/* five cards and five slots: tighter, so »Preveri« stays on an iPhone 14 */
.orderstep.many .tslot { min-height: 32px; }
.orderstep.many .tcard { padding: 5px 10px; font-size: 18px; }
.orderstep.many .tcard .te { font-size: 22px; }
.orderstep.many .tslots, .orderstep.many .tdeck { gap: 4px; }
/* the final case: the mystery face turns into the real one; the guess is checked */
.unmask { position: relative; display: inline-flex; }
.unmask .mask { position: absolute; inset: 0; animation: maskoff .5s .6s both; }
.unmask .real { animation: unmask .8s .9s both; }
@keyframes maskoff { to { transform: scale(1.6); opacity: 0; } }
@keyframes unmask { from { transform: scale(.2) rotate(-300deg); opacity: 0; } to { transform: none; opacity: 1; } }
.guess.answer { font-weight: 600; }
.guess.answer .row { font-size: 19px; }
.guess.answer.right { background: var(--good); }
.gres { padding: 2px 6px 4px; }
.reveal .guess.answer { width: 100%; max-width: 560px; margin: 0; }
/* 🔤 word search */
.wnote { margin: 0 0 8px; font-weight: 600; }
.wwrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-start; }
.wgrid { --cell: min(72px, calc((100vw - 48px) / var(--n)), calc((100dvh - 330px) / var(--n))); display: grid; grid-template-columns: repeat(var(--n), max(40px, var(--cell))); gap: 4px; touch-action: manipulation; }
.wcell { appearance: none; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-size: clamp(22px, calc(var(--cell) * .5), 34px); font-weight: 800; line-height: 1; font-family: inherit; color: var(--ink); cursor: pointer; padding: 0; }
.wcell.hl { background: #fff4c2; border-color: var(--sel-line); }
.wcell.sel { background: var(--sel); border-color: var(--sel-line); transform: scale(1.08); }
.wcell.got { background: #c9efd3; border-color: #5cb97a; }
.wcell.pulse, .tcard.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.wlist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 340px; }
.wword { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 20px; letter-spacing: 1px; }
.wword.got { background: #c9efd3; border-color: #5cb97a; text-decoration: line-through; }
/* 🔤 riddles instead of words: a riddle and its dashes; found, the word replaces the dashes */
.wlist.riddles { flex-direction: column; flex-wrap: nowrap; max-width: 420px; width: 100%; }
.wword.riddle { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 12px; font-size: 17px; font-weight: 600; letter-spacing: 0; text-align: left; cursor: pointer; }
.wword.riddle .wd { font-weight: 800; letter-spacing: 2px; white-space: nowrap; }
.wword.riddle.got { text-decoration: none; }
.riddled .wgrid { --cell: min(72px, calc((100vw - 48px) / var(--n)), calc((100dvh - 520px) / var(--n))); }
/* 🔤 the geslo: the letters left over glow, then spell a sentence in a strip under the grid */
.wcell.left { background: #fff4c2; border-color: var(--sel-line); animation: glowcell .5s both; }
@keyframes glowcell { from { background: #fff; transform: scale(1); } 60% { transform: scale(1.15); } }
.geslo { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: center; max-width: 360px; font-size: 26px; font-weight: 900; letter-spacing: 2px; }
.geslo .gw { white-space: nowrap; }
.geslo .gl { display: inline-block; animation: flyin .4s both; color: #8a5a00; }
/* ✉️ cipher: the key, the message in cells (symbol over letter), the letter tiles */
.ckey { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
.cchip { display: flex; flex-direction: column; align-items: center; min-width: 46px; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 4px; font-size: 22px; line-height: 1.15; }
.cchip b { font-size: 20px; }
.cchip.hl { background: #fff4c2; border-color: var(--sel-line); animation: pulse 1.1s ease-in-out infinite; }
.cmsg { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; max-width: 620px; }
.cword { display: flex; gap: 3px; align-items: flex-end; }
.ccell { appearance: none; font: inherit; color: inherit; cursor: pointer; width: 44px; display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 0; }
.ccell .cs { font-size: 22px; line-height: 1.2; }
.cipherstep > .footer, .tornstep > .footer { margin-top: auto; align-self: stretch; flex-wrap: nowrap; }
.ccell .cl { font-size: 26px; font-weight: 900; min-height: 34px; line-height: 34px; border-top: 2px dashed var(--line); width: 80%; }
.ccell.ring { border-color: var(--sel-line); background: var(--sel); box-shadow: 0 0 0 3px rgba(224, 168, 0, .45); }
.ccell.got { background: #c9efd3; border-color: #5cb97a; }
.cplain { font-size: 26px; font-weight: 900; align-self: flex-end; padding-bottom: 4px; }
.ctiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
.ctile { appearance: none; font: inherit; width: 52px; height: 52px; border-radius: 12px; border: 3px solid var(--accent); background: #fff; color: var(--accent); font-size: 26px; font-weight: 900; cursor: pointer; }
.ctile:disabled { opacity: .3; }
.ctile.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.ctile.wobble, .row.wobble { animation: wobble .3s; }
.cdone, .tdone { font-weight: 700; background: var(--good); border-color: #6fc287; }
/* 📜 torn note: slots along one line, torn paper strips */
.pslots, .pdeck { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; }
.pslots { background: #efe3c8; border: 2px solid #d9c08f; border-radius: 12px; padding: 10px; width: 100%; }
.pdeck { padding-top: 4px; }
.pslot { min-width: 88px; min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 800; color: var(--muted); }
.pslot.empty { border: 3px dashed var(--line); }
.strip { appearance: none; font: inherit; font-size: 24px; font-weight: 700; color: var(--ink); cursor: pointer; background: #fffdf3; border: 0; padding: 10px 18px; min-height: 52px;
  box-shadow: inset 0 0 0 2px #cdb98d; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25)); clip-path: polygon(0 0, 100% 0, 96% 20%, 100% 40%, 96% 60%, 100% 80%, 96% 100%, 0 100%, 4% 80%, 0 60%, 4% 40%, 0 20%); }
.pslot.good .strip { background: var(--good); }
.strip.pulse { animation: pulse 1.1s ease-in-out infinite; background: var(--sel); }
.tornstep.done .wnote { display: none; }
/* ❗ UGOVOR: claims as speech bubbles, the sentences below (beside them on a landscape phone) */
.liestep { gap: 0; }
.lwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.lleft { flex: none; display: flex; flex-direction: column; gap: 8px; }
.claims { display: flex; flex-direction: column; gap: 8px; }
.claim { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
  background: #fff; border: 3px solid var(--accent); border-radius: 4px 20px 20px 20px; padding: 8px 12px; min-height: 60px; font-size: var(--row-font); line-height: 1.3; }
.claim .who { display: block; font-size: 16px; color: var(--muted); }
.claim .who i { font-style: normal; background: var(--heard); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
.claim.selected { background: var(--sel); border-color: var(--sel-line); }
.claim.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.claim.caught { border-color: var(--danger); background: #fff5f3; cursor: default; }
.cav { position: relative; flex: none; }
.blush { position: absolute; right: -10px; bottom: -8px; font-size: 24px; }
.blush.pop { animation: slam .4s .6s both; }
.lstamp { position: absolute; right: -4px; top: -20px; font-size: 16px; border-width: 3px; padding: 0 8px; background: #fff; pointer-events: none; }
.claim.caught { padding-top: 14px; }
.liestep .lnote { min-height: 44px; display: flex; align-items: center; margin-bottom: 8px; }
.liestep.shake { animation: wobble .3s 2; }
.row.broke { border-color: var(--danger); animation: flashred .6s 2; }
@keyframes flashred { 50% { background: var(--bad); } }
.ltruth .mtxt { border-color: #6fc287; background: var(--good); }
.liestep .toast { margin: 0; }
.row .ltag { margin-left: auto; flex: none; padding-left: 8px; font-size: 14px; font-weight: 900; color: var(--danger); transform: rotate(-6deg); }
.row .ltag.truth { color: inherit; font-size: 20px; transform: none; }
.row.proof { border-color: #5cb97a; background: var(--good); }
/* 🧭 Preveri sled: a clue card with an arrow to a face; explained, it flips, a blue stamp lands, the arrow bends away */
.herringstep { gap: 0; }
.hclues { display: flex; flex-direction: column; gap: 8px; }
.hclue { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; display: flex; align-items: center; gap: 8px; width: 100%;
  background: #fff; border: 3px dashed #4a78c8; border-radius: 16px; padding: 8px 12px; min-height: 60px; font-size: var(--row-font); line-height: 1.3; }
.hclue .htxt { flex: 1; }
.hclue .harrow { flex: none; font-size: 28px; transition: transform .6s; }
.hclue .harrow.bent { transform: rotate(-120deg); opacity: .6; }
.hclue .hface { position: relative; flex: none; }
.hclue .phew { position: absolute; right: 0; bottom: -8px; font-size: 22px; animation: slam .4s .6s both; }
.hclue.selected { background: var(--sel); border-color: var(--sel-line); border-style: solid; }
.hclue.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
.hclue.flipped { border-style: solid; border-color: #4a78c8; background: #eef4ff; padding-top: 22px; margin-top: 8px; cursor: default; }
.hclue.flip { animation: hflip .6s; }
@keyframes hflip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.hstamp { position: absolute; right: 10px; top: -14px; font-size: 13px; border-width: 3px; padding: 0 8px; background: #fff; color: #2f5fb3; border-color: #2f5fb3; pointer-events: none; }
.row .ltag.herr { color: #2f5fb3; font-size: 12px; }
/* ⏰ Kdaj?: three time bands; a sentence from before or after gets the referee's yellow card */
.whenstep { gap: 0; }
.kdwrap { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
.wbands { display: flex; flex-direction: column; gap: 6px; flex: none; }
.wband { cursor: pointer; display: flex; flex-direction: column; gap: 6px; background: #f2f2f6; border: 3px solid #cfcfdc; border-radius: 16px; padding: 6px 10px; min-height: 48px; }
.wband .wlab { font-weight: 900; font-size: 16px; letter-spacing: 1px; color: var(--muted); }
.wband .wdeed { letter-spacing: 0; font-weight: 700; color: var(--ink); }
.wband.during { background: #e9f6ec; border-color: #6fc287; }
.wband.during .wlab { color: #2e7d4f; }
.wband.armed { border-style: dashed; border-color: var(--sel-line); }
.wband.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }

// no = play order (1, 2, 3, …). type = the reasoning step, and rung follows from it (RUNG):
//   fact 1      the answer is written in one sentence
//   trace 2     a trace, and knowing whose it is (a blue tongue → blueberries)
//   slip 3      the culprit says something only the culprit could know
//   alibi 4     the culprit says where they were, and a sentence shows it isn't true
//   pair 5      two sentences only prove it together; the child picks both
// twist: the culprit is not one of the people (an animal of the place). Use it once per file.
// sentences: [id, text, role?]; role is evidence | partial | distractor (default neutral).
// partial = the culprit's own claim (slip and alibi). h2 = block highlighted at hint 2
// (3 sentences, 4 for a pair), h3 = candidates at hint 3 (2, 3 for a pair).
//   elim 2      investigation steps: search the scene, cross off everyone who has an alibi, prove it
// A step case (steps) adds to sentences a 4th item: obj (the emoji it hides behind), label,
// clears (the suspect this alibi rules out, role clear), dark (needs the 🔦 torch).
// In an ask step (questioning) a sentence is an answer instead: who says it and ask, the question.
// client + call = who phones for help; film = security-camera frames [emoji, caption, 'blur'?]
// the child steps through on the call screen before the scene; words = a word search (step 'words')
// whose words name the objects to search; lock = a code lock (step 'lock'): wheels, »Odpri«, no auto-check;
// order = a timeline (step 'order'): cards [emoji, text] in the right order, shown mixed;
// cipher = a coded note (step 'cipher'): key { symbol: 'LETTER' }, missing (a symbol shown as ?), extra (decoy tiles);
// torn = a torn note (step 'torn'): parts in the right order; words.geslo = the sentence the letters left over spell.
// A puzzle gives a sentence (gives / geslo): that sentence has from: '<step>' and lands in the pocket when it is solved.
// lie = ❗ UGOVOR (step 'lie', just before solve): claims (💬, each with who), claim (the one that isn't true),
// breaks (sets of 1–2 sentences that show it), truth (from: 'lie', what the liar then says), hmm (near misses
// [claim, sentence, note]), h1. A step case may have two proofs (a pair): one names the culprit, one names nobody.
// herring = 🧭 Preveri sled (step 'herring', just before solve, never with lie): clues (1–2 sentences, each with an
// arrow to the face in points), explains ({ clue: sets of 1–2 sentences that say why it doesn't count }; a clue not in
// explains is true and is the proof), hmm, h1. Without the step, points: '<id>' on a sentence marks the obvious
// suspect it points at: using it against that face in solve gets »Preveč lahko?«.
// when = ⏰ Kdaj? (step 'when', just before solve, never with lie or herring): deed (the deed's time, as the
// question says it), cards ({ sentence: 'before' | 'during' | 'after' }), h1. A card from before or after gets
// the yellow card and, used in solve, »Napačen čas!«; without the step, when: 'before' | 'after' on a sentence
// does the same. rub = a scene object that needs the 🖍️ pencil (at most one). witnesses = people who answer in
// ask but are not suspects (👁️). The final's client may be a suspect (he calls for help himself).
// card = the sentence pinned to the season's corkboard

// caught = the culprit in the accusative (newspaper); excuse = the culprit's funny excuse;
// letter = a thank-you that arrives on the next visit.

// Every audio clip the app can play: [clipId, text]. Recordings go in audio/<clipId>.m4a.
function clipList() {
  const out = Object.entries(UI_AUDIO).map(([k, t]) => ['ui_' + k, t]);
  for (const c of [TUTORIAL, ...CASES]) {
    out.push([c.id + '_q', c.question]);
    (c.call || []).forEach((t, i) => out.push([`${c.id}_c${i + 1}`, t]));
    (c.film || []).forEach((f, i) => out.push([`${c.id}_f${i + 1}`, f[1]]));
    if (c.words) out.push([c.id + '_wn', c.words.note], [c.id + '_wh', c.words.h1], ...c.words.find.filter(f => f[2]).map((f, i) => [`${c.id}_wc${i + 1}`, f[2]]));
    if (c.lock) out.push([c.id + '_kn', c.lock.note], [c.id + '_kh1', c.lock.h1], [c.id + '_kh2', c.lock.h2]);
    if (c.order) {
      out.push([c.id + '_on', c.order.note], [c.id + '_oh1', c.order.h1], [c.id + '_oh2', c.order.h2], [c.id + '_od', c.order.done]);
      c.order.cards.forEach((k, i) => out.push([`${c.id}_o${i + 1}`, k[1]]));
    }
    if (c.cipher) out.push([c.id + '_cn', c.cipher.note], [c.id + '_ch1', c.cipher.h1], ...(c.cipher.h2 ? [[c.id + '_ch2', c.cipher.h2]] : []));
    if (c.torn) out.push([c.id + '_pn', c.torn.note], [c.id + '_ph1', c.torn.h1], [c.id + '_ph2', c.torn.h2]);
    if (c.herring) {
      if (c.herring.h1) out.push([c.id + '_hh1', c.herring.h1]);
      (c.herring.hmm || []).forEach((m, i) => out.push([`${c.id}_hm${i + 1}`, m[2]]));
    }
    if (c.when && c.when.h1) out.push([c.id + '_th1', c.when.h1]);
    if (c.lie) {
      if (c.lie.h1) out.push([c.id + '_lh1', c.lie.h1]);
      (c.lie.hmm || []).forEach((m, i) => out.push([`${c.id}_lm${i + 1}`, m[2]]));
    }
    for (const s of c.sentences) out.push([c.id + '_' + s.id, s.text]);
    for (const s of c.sentences) if (s.ask) out.push([`${c.id}_${s.id}q`, s.ask]);
    out.push([c.id + '_h1', c.h1]);
    c.reveal.forEach((t, i) => out.push([`${c.id}_r${i + 1}`, t]));
    if (c.excuse) out.push([c.id + '_x', c.excuse]);
    if (c.card && c.card.think) out.push([c.id + '_t', c.card.think]);
    (c.letter || []).forEach((t, i) => out.push([`${c.id}_l${i + 1}`, t]));
  }
  for (const f of FILES) if (f.guess) {
    out.push([f.id + '_gq', f.guess.q]);
    for (const [id, , t] of f.guess.options) out.push([`${f.id}_g_${id}`, t]);
    if (f.guess.q2) out.push([f.id + '_gq2', f.guess.q2]);
    if (f.answer) out.push([f.id + '_a', f.answer.text]);
    if (f.book) out.push([f.id + '_bq', f.book.q]);
    if (f.cup) out.push([f.id + '_uq', f.cup.q], [f.id + '_uc', f.cup.cheer]);
  }
  return out;
}

const SAVE_VERSION_KEY = 'dp_save_version';

function newPlayerId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function newPlayer() {

  return p;
}

function migrateSave() {
  const from = store.read(SAVE_VERSION_KEY, 1);
  if (from < 2) {
    // forest case numbers → "gozd:N"
    const played = store.read('dp_played_v1', []);
    store.write('dp_played_v1', played.map(k => typeof k === 'number' ? `gozd:${k}` : k));
  }
  if (from < 3) {
    // the adventures were rewritten as a reasoning ladder: keep ticks of cases that kept their
    // story and number, drop the rest (the forest cases were removed; their keys stay unused)
    const keep = ['vesolje:1', 'vesolje:2', 'vesolje:4', 'kmetija:1', 'kmetija:2', 'kmetija:4'];
    const played = store.read('dp_played_v1', []);
    store.write('dp_played_v1', played.filter(k => keep.includes(k) || String(k).startsWith('gozd:')));
  }
  if (from < 4 && store.read('dp_profile_v1', null) && !store.read('dp_detectives_v1', null)) {
    // the one child so far becomes the first detective; their data stays where it is
    store.write('dp_detectives_v1', { active: 'd1', list: [{ key: 'd1', data: null }] });
  }
  if (from !== SAVE_VERSION) store.write(SAVE_VERSION_KEY, SAVE_VERSION);
  playerInfo(); // make sure this device has an anonymous player id
}

// ---------------------------------------------------------------------------
// Audio: embedded clip → audio/<id>.m4a → Slovenian speechSynthesis voice
// ---------------------------------------------------------------------------
const player = new Audio();
let playToken = 0;
let playingEl = null;
let slVoice = null;

function loadVoices() {
  const had = !!slVoice;
  try { slVoice = speechSynthesis.getVoices().find(v => /^sl/i.test(v.lang)) || null; } catch (e) { slVoice = null; }
  if (S.screen === 'setup' || had !== !!slVoice) render();
}

// 🔊 buttons only when something can actually be heard (recordings or a Slovenian voice).
const canSpeak = () => Object.keys(AUDIO).length > 0 || !!slVoice;

function markPlaying(el) {
  if (playingEl) playingEl.classList.remove('playing');
  playingEl = el;
  if (el) el.classList.add('playing');
}

function stopAudio() {
  playToken++;
  try { player.pause(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  markPlaying(null);
}

function play(id, text, el) {
  stopAudio();
  const tok = playToken;
  let fellBack = false;
  markPlaying(el);
  const done = () => { if (tok === playToken) markPlaying(null); };
  const speak = () => {
    if (tok !== playToken || fellBack) return;
    fellBack = true;
    if (!slVoice) { setTimeout(done, 800); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = slVoice; u.lang = slVoice.lang; u.rate = 0.9;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  };
  // Without an embedded recording, speak right away: iPad Safari only allows speech inside the tap itself.
  if (!AUDIO[id] && slVoice) { speak(); return; }
  player.onended = done;
  player.onerror = speak;
  player.src = AUDIO[id] || `audio/${id}.m4a`;
  const p = player.play();
  if (p && p.catch) p.catch(speak);
}

// Start screen order, worked out from the saves so nothing moves unless the child did something:
// one hero (the adventure played last that still has a case to solve; else the first adventure
// for a new detective, the newest unstarted one for the others), then started, then unstarted,
// then ones waiting for new cases. Finished adventures go on the medal shelf.
function fileOrder() {
  const started = (f) => casesIn(f.id).some(isSolved);
  const open = (f) => casesIn(f.id).some(c => !isSolved(c));
  const keys = solvedKeys();
  const last = [...keys].reverse().map(k => FILES.find(f => f.id === k.split(':')[0])).find(f => f && open(f));
  const fresh = FILES.filter(f => !started(f));
  const hero = last || (keys.length ? fresh[fresh.length - 1] : fresh[0]);
  const rest = FILES.filter(f => f !== hero && !fileDone(f.id));
  const cards = [...(hero ? [[hero, true]] : []),
    ...[rest.filter(f => started(f) && open(f)), rest.filter(f => !started(f)), rest.filter(f => started(f) && !open(f))].flat().map(f => [f, false])];
  return { cards, shelf: FILES.filter(f => fileDone(f.id)) };
}
// A medal that is new since this screen was last shown flies onto the shelf.
function shelfHTML(shelf) {
  if (!shelf.length) return '';
  const pid = (profile() || {}).id, seen = S.shelfSeen && S.shelfSeen.pid === pid && S.shelfSeen.ids;
  S.shelfSeen = { pid, ids: shelf.map(f => f.id) };
  return `<div class="shelf"><div class="shelf-head">🏅 Moje medalje</div><div class="medals">${shelf.map(f =>
    `<button class="medal ${seen && !seen.includes(f.id) ? 'arrive' : ''}" data-act="openFile" data-file="${f.id}" aria-label="${esc(f.title)}"><span class="mi">${f.icon}</span><span class="mm">🏅</span></button>`).join('')}</div></div>`;
}

// Case board: the child picks any case of the file. Solved cases get a tick, and one
// unsolved case glows as a suggestion: a random one among the easiest still open.
function pickSuggestion() {
  const open = casesIn(S.file).filter(c => !isSolved(c) && !isLocked(c));
  if (!open.length) return null;
  const easiest = Math.min(...open.map(c => c.rung));
  const pool = open.filter(c => c.rung === easiest);
  return pool[Math.floor(Math.random() * pool.length)].no;
}

function playCase(no) {
  S.caseNo = S.started++;
  S.c = caseFor(S.file, no);
  S.run = newRun();
  log('case_pick', { file: S.file, no, suggested: no === S.suggest, solvedBefore: isSolved(S.c) });
  openCaseScreen();
}

// A step case starts with the client's phone call, every other case with the intro.
const openCaseScreen = () => go(S.c.steps ? 'call' : 'intro');

// Bookkeeping when a case is solved: the tick, a rank-up to celebrate, the client's letter.
function markSolved(c) {
  const played = solvedKeys();
  const before = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  if (!played.includes(caseKey(c))) store.write(PLAYED_KEY, [...played, caseKey(c)]);
  const after = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  if (rankFor(after) !== rankFor(before)) S.run.rankUp = rankFor(after);
  const mail = store.read(LETTER_KEY, { pending: [], read: [] });
  if (c.letter && !mail.read.includes(c.id) && !mail.pending.some(x => x.id === c.id)) {
    store.write(LETTER_KEY, { ...mail, pending: [...mail.pending, { id: c.id, session: S.session }] });
  }
}

// ---------- Ranks: earned by solved cases, never lost
const RANKS = [
  { n: 0, i: '🔰', m: 'Vajenec', f: 'Vajenka' },
  { n: 3, i: '🕵️', m: 'Detektiv', f: 'Detektivka' },
  { n: 6, i: '⭐', m: 'Višji detektiv', f: 'Višja detektivka' },
  { n: 10, i: '🎖️', m: 'Inšpektor', f: 'Inšpektorica' },
  { n: 15, i: '👑', m: 'Glavni inšpektor', f: 'Glavna inšpektorica' },
];
const rankFor = (n) => RANKS.filter(r => n >= r.n).pop();
const rankName = (r, p = profile()) => `${r.i} ${p && p.g === 'f' ? r.f : r.m}`;
// verb forms for the child: ga('ujel', 'ujela')
const ga = (m, f) => (profile() || {}).g === 'f' ? f : m;

// ---------- Letters: a client's thank-you arrives on the next visit (a later session)
const LETTER_KEY = 'dp_letters_v1';
function letterDue(file) {
  const mail = store.read(LETTER_KEY, { pending: [], read: [] });
  const due = mail.pending.find(x => x.session !== S.session && caseById(x.id) && caseById(x.id).file === file);
  return due ? caseById(due.id) : null;
}

// ---------- Little sounds made on the fly (no files): ring, pop, stamp, nope, tada
let actx = null;
let ringTimer = null;
function sfx(name) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const tone = (freq, start, dur, type = 'sine', vol = 0.12) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0 + start);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
    };
    if (name === 'ring') [0, .18, .5, .68].forEach(s => tone(880, s, .14, 'square', .05));
    if (name === 'pop') tone(660, 0, .12, 'triangle');
    if (name === 'click') tone(1400, 0, .05, 'square', .06);
    if (name === 'stamp') { tone(90, 0, .25, 'sine', .35); tone(140, 0, .12, 'triangle', .15); }
    if (name === 'nope') { tone(220, 0, .15, 'sine', .1); tone(180, .12, .2, 'sine', .1); }
    if (name === 'beep') { tone(1760, 0, .08, 'square', .05); tone(1760, .14, .08, 'square', .05); }
    if (name === 'lock') { tone(1200, 0, .04, 'square', .08); tone(600, .09, .06, 'square', .08); tone(300, .2, .18, 'triangle', .12); }
    if (name === 'whistle') { tone(2900, 0, .12, 'square', .04); tone(2900, .18, .32, 'square', .04); }
    if (name === 'tada') [523, 659, 784, 1047].forEach((f, i) => tone(f, .12 + i * .1, .3, 'triangle', .1));
  } catch (e) { /* no sound is fine */ }
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; }

// ---------- Detective ID card: avatar (also sets detektiv / detektivka), sidekick, optional name
const PROFILE_KEY = 'dp_profile_v1';
const AVATARS = [
  { e: '🕵🏻‍♂️', g: 'm' }, { e: '🕵🏽‍♂️', g: 'm' }, { e: '🕵🏿‍♂️', g: 'm' },
  { e: '🕵🏻‍♀️', g: 'f' }, { e: '🕵🏽‍♀️', g: 'f' }, { e: '🕵🏿‍♀️', g: 'f' },
];
const SIDEKICKS = ['🐶', '🐱', '🦉', '🦊'];
const profile = () => store.read(PROFILE_KEY, null);
const detTitle = (p = profile()) => (p && p.g === 'f' ? 'Detektivka' : 'Detektiv');
const detName = (p = profile()) => detTitle(p) + (p && p.name ? ' ' + p.name : '');
// Slovenian plural after a number: 1 rešen primer, 2 rešena primera, 3–4 rešeni primeri, 5+ rešenih primerov.
const solvedLabel = (n) => n % 100 === 1 ? `${n} rešen primer` : n % 100 === 2 ? `${n} rešena primera`
  : (n % 100 === 3 || n % 100 === 4) ? `${n} rešeni primeri` : `${n} rešenih primerov`;
const cleanName = (v) => v.replace(/[^\p{L} '-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 12)
  .replace(/^\p{L}/u, ch => ch.toUpperCase());

function idCard(p) {
  const n = solvedKeys().filter(k => ALL_KEYS.includes(k)).length;
  return `<div class="idcard">
    <div class="id-top"><span>🔍 DETEKTIVSKA IZKAZNICA</span><span>št. ${esc(p.id)}</span></div>
    <div class="id-body">
      <span class="id-photo">${p.av}</span>
      <div class="id-text"><b>${esc(detName(p))}</b>
        <span class="rank">${rankName(rankFor(n), p)}</span>
        <span>Pomočnik: ${p.sk} · ✔ ${solvedLabel(n)}</span></div>
    </div>
    <div class="id-stamps">${FILES.map(f => `<span class="stamp-slot ${fileDone(f.id) ? 'got' : ''}" title="${esc(f.title)}">${f.icon}</span>`).join('')}</div>
  </div>`;
}

// ---- First-time tutorial: a guided practice case before the board ----
const TUT_KEY = 'dp_tutorial_done';

function startTutorial() {
  S.c = TUTORIAL;
  S.run = newRun();
  S.tut = { read: false, msg: null, board: false };
  log('tutorial_start');
  go('intro');
}

function endTutorial() {
  store.write(TUT_KEY, true);
  log('tutorial_done');
  S.c = null;
  S.run = null;
  S.tut = { board: true };   // one last bubble on the file picker
  toHome();
}

// What Babica says on each screen, and which element glows.
function coachStep() {
  const t = S.tut, r = S.run;
  // the first UGOVOR ever: the owl shows the two taps (a finger only when there is one claim to point at)
  if (briefOpen() || truthOpen() || excuseOpen() || (stepCase() && r.note)) return null;
  if (S.screen === 'lie' && r && r.lcoach && !r.caught && !r.hint) {
    const one = S.c.lie.claims.length === 1;
    return r.lcoach === 1 ? { text: UI_AUDIO.coachLie1, sel: one ? '.claim' : '.claims', point: one }
      : { text: UI_AUDIO.coachLie2, sel: '.liestep .rows', point: false };
  }
  if (!t) return null;
  if (S.screen === 'files') return t.board ? { text: 'Zdaj izberi pustolovščino in reši svoj primer!', sel: '.file-card', ok: true } : null;
  if (S.screen === 'board') return null;
  if (t.msg) return { text: t.msg, sel: null, ok: true };
  switch (S.screen) {
    case 'intro': return { text: 'Tvoj prvi primer! Najprej preberi zgodbo.', sel: '[data-act="toStory"]' };
    case 'story': return t.read
      ? { text: 'Ko veš, kdo je bil, tapni tukaj.', sel: '[data-act="know"]' }
      : { text: 'Preberi vse stavke. Kdo je pojedel korenček?', sel: '.rows', ok: true, point: false };
    // a group (the animals, the sentences) gets the spotlight but no finger: it would point at one answer
    case 'accuse': return { text: 'Kdo je bil? Tapni pravo živalco.', sel: '.suspects', point: false };
    case 'evidence': return r && r.picks.length
      ? { text: 'Tapni »To je dokaz!«', sel: '[data-act="confirm"]' }
      : { text: 'Kateri stavek to dokaže? Tapni ga.', sel: '.rows', point: false };
    case 'reveal': return { text: `Bravo, ${detTitle().toLowerCase()}! Tako se igra. 🎉`, sel: '[data-act="next"]' };
  }
  return null;
}

function coach() {
  document.querySelectorAll('.coach, .coach-spot, .coach-hand').forEach(el => el.remove());
  document.querySelectorAll('.coach-target').forEach(el => el.classList.remove('coach-target'));
  const step = coachStep();
  if (!step) return;
  const target = step.sel && document.querySelector(step.sel);
  if (target) {
    target.classList.add('coach-target');
    document.body.insertAdjacentHTML('beforeend', '<div class="coach-spot"></div>'
      + (step.point === false ? '' : '<div class="coach-hand">👆</div>'));
    placeSpot();
  }
  // Put the bubble on the side with more room, so it doesn't cover what to tap.
  const rect = target ? target.getBoundingClientRect() : null;
  const top = rect ? rect.top > innerHeight - rect.bottom : false;
  document.body.insertAdjacentHTML('beforeend', `<div class="coach ${top ? 'top' : 'bottom'}">
    <span class="owl">🦉</span><span class="say">${esc(step.text)}</span>
    ${step.ok ? '<button class="btn" data-coach="ok">V redu</button>' : ''}</div>`);
}

// The spotlight and the finger follow the target when the screen scrolls or turns.
function placeSpot() {
  const t = document.querySelector('.coach-target'), spot = $('.coach-spot'), hand = $('.coach-hand');
  if (!t || !spot) return;
  const r = t.getBoundingClientRect(), pad = 8;
  Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px' });
  if (!hand) return;
  // below the target pointing up, or above it pointing down when there is no room below
  const below = innerHeight - r.bottom > 80 || r.top < 80;
  hand.textContent = below ? '👆' : '👇';
  hand.classList.toggle('down', !below);
  hand.style.left = Math.min(Math.max(r.left + r.width / 2, 34), innerWidth - 34) + 'px';
  hand.style.top = (below ? Math.min(r.bottom + 6, innerHeight - 60) : r.top - 62) + 'px';
}
addEventListener('scroll', placeSpot, { capture: true, passive: true });
addEventListener('resize', placeSpot);

app.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'mkName') ACTIONS.mkName();
});

document.body.addEventListener('click', (e) => {
  if (!e.target.closest('[data-coach="ok"]') || !S.tut) return;
  if (S.tut.msg) S.tut.msg = null;
  else if (S.screen === 'story') S.tut.read = true;
  else if (S.screen === 'files') S.tut = null;
  coach();
});

// ---- Several children on one device: one detective each ----
// The active detective's data lives in the usual keys (ID card, solved cases, practice, letters,
// anonymous player id), so the game reads it as before. The others wait in DETECTIVES_KEY as
// copies of those keys and swap in when picked. Nothing leaves the device.
const DETECTIVES_KEY = 'dp_detectives_v1';
const GUESS_KEY = 'dp_guess_v1';   // { fileId: the option the child guessed now, 'fileId:first', 'fileId:again' }
const UGOVOR_KEY = 'dp_ugovor_v1'; // the detective has shouted UGOVOR once (the owl and the shout come only the first time)
const KID_KEYS = [PROFILE_KEY, PLAYED_KEY, TUT_KEY, LETTER_KEY, PLAYER_KEY, GUESS_KEY, UGOVOR_KEY];
const raw = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} },
};
function detectives() {
  const d = store.read(DETECTIVES_KEY, null) || { active: null, list: [] };
  if (!d.active && profile()) { d.active = 'd1'; d.list = [{ key: 'd1', data: null }]; store.write(DETECTIVES_KEY, d); }
  return d;
}
const snapshot = () => Object.fromEntries(KID_KEYS.map(k => [k, raw.get(k)]));
const nextKey = (d) => 'd' + (Math.max(0, ...d.list.map(x => Number(x.key.slice(1)) || 0)) + 1);
// put the active detective away (or drop them, if they never finished their ID card)
function stashActive(d) {
  if (!d.active) return;
  if (profile()) d.list = d.list.map(x => x.key === d.active ? { ...x, data: snapshot() } : x);
  else d.list = d.list.filter(x => x.key !== d.active);
}
function switchDetective(key) {
  const d = detectives();
  if (key === d.active) return;
  stashActive(d);
  const to = d.list.find(x => x.key === key);
  for (const k of KID_KEYS) raw.set(k, to.data && to.data[k] != null ? to.data[k] : null);
  d.active = key;
  store.write(DETECTIVES_KEY, d);
}
function newDetective() {
  const d = detectives();
  stashActive(d);
  for (const k of KID_KEYS) raw.set(k, null);
  newPlayer();
  d.active = nextKey(d);
  d.list.push({ key: d.active, data: null });
  store.write(DETECTIVES_KEY, d);
}
// the picker's cards: the active detective from the live keys, the others from their copies
function detectiveCards() {
  const d = detectives();
  return d.list.map(x => {
    const live = x.key === d.active;
    const read = (k, def) => { const v = live ? raw.get(k) : x.data && x.data[k]; try { return v ? JSON.parse(v) : def; } catch (e) { return def; } };
    const p = read(PROFILE_KEY, null);
    const n = read(PLAYED_KEY, []).filter(k => ALL_KEYS.includes(k)).length;
    return p && { key: x.key, p, n, live };
  }).filter(Boolean);
}

// Home: a new child first makes the ID card, then plays the practice case, then picks a file.
function toHome() {
  if (!profile()) { S.mk = { step: 1, av: null, g: null, sk: null, name: '' }; go('make'); return; }
  if (!store.read(TUT_KEY, false) && !(S.tut && S.tut.board)) { startTutorial(); return; }
  S.file = null;
  go('files');
}

function toBoard() {
  if (!S.file) { toHome(); return; }
  S.suggest = pickSuggestion();
  go('board');
}

function startCase(n) {
  const [file, no] = S.order[n].split(':');
  S.caseNo = n;
  S.file = file;
  S.c = caseFor(file, Number(no));
  S.run = newRun();
  openCaseScreen();
}

function go(screen) {
  stopAudio();
  stopRing();
  if (screen !== 'board') S.pinNew = null;
  S.screen = screen;
  render();
  if (screen === 'call' && !S.run.answered) {
    let rings = 0;
    sfx('ring');
    ringTimer = setInterval(() => { if (++rings >= 5) stopRing(); else sfx('ring'); }, 1600);
  }
  if (screen === 'reveal') setTimeout(() => sfx('stamp'), 350);
  if (!ADULT.has(screen)) log('screen_enter');
  if (screen === 'thanks' && !S.ended) { S.ended = true; log('session_end'); }
}

// ---------- Back: one step back, for the ← button and for the browser / swipe back.
// Returns what to do, 'stay' (nothing sensible behind this screen) or null (leave the game).
function backTarget() {
  const tut = S.tut && !S.tut.board;
  switch (S.screen) {
    case 'make':
      if (S.mk.step > 1) return () => { S.mk.step--; render(); };
      if (profile()) return () => { S.mk = null; toHome(); };
      return detectiveCards().length ? () => { S.mk = null; go('who'); } : null;
    case 'board': return () => { S.toast = null; toHome(); };
    case 'who': return profile() ? toHome : 'stay';
    case 'intro':
      if (tut) return store.read(TUT_KEY, false) ? () => { S.tut = null; S.c = null; toHome(); } : () => { ACTIONS.editCard(); S.mk.step = 4; render(); };
      return S.orderMode === 'board' ? toBoard : 'stay';
    case 'call': return S.orderMode === 'board' ? toBoard : 'stay';
    case 'scene': case 'ask': case 'words': case 'lock': case 'order': case 'cipher': case 'torn': return S.run.hint ? 'stay' : () => go(stepNext(-1));
    case 'lie': return S.run.hint || S.run.lphase === 'shout' || S.run.lphase === 'stamp' ? 'stay' : () => go(stepNext(-1));
    case 'herring': case 'when': return S.run.hint ? 'stay' : () => go(stepNext(-1));
    case 'solve': return S.run.hint ? 'stay' : () => go(stepNext(-1));
    case 'story': return () => go('intro');
    case 'accuse': return () => go('story');
    case 'evidence': return S.run.hint ? 'stay' : () => { S.run.picks = []; go('accuse'); };
    case 'reveal': return tut ? endTutorial : S.orderMode === 'board' ? toBoard : 'stay';
    case 'book': return S.run && S.run.fromBoard ? toBoard : () => go('reveal');
    case 'soon': return () => go('more');
    case 'thanks': return KID_MODE ? ACTIONS.backToBoard : 'stay';
    case 'title': return ACTIONS.toSetup;
    case 'debrief': return S.resume ? ACTIONS.resume : ACTIONS.toSetup;
    case 'files': case 'setup': return null;
    default: return 'stay';
  }
}

function goBack(how) {
  const to = backTarget();
  if (typeof to !== 'function') return to;
  if (!ADULT.has(S.screen)) log('nav_back', { how });
  to();
  return 'done';
}

// The browser back pops a spare history entry; the game then steps back itself and adds a
// new one, or really leaves on the first screens. Browsers may skip entries added without
// a tap, so the next tap adds one more.
let tapArmed = false;
const armBack = () => history.pushState({ dp: 'in' }, '');
document.addEventListener('click', () => {
  if (!tapArmed) { armBack(); tapArmed = true; }
}, true);
addEventListener('popstate', () => {
  tapArmed = false;
  if (goBack('browser') === null) history.back(); else armBack();
});

function render() {
  app.className = 'level-' + (S.level || 'B');
  const keep = $('.kdwrap'), keepTop = keep ? keep.scrollTop : 0;   // ⏰: a tap must not jump the bands back to the top
  app.innerHTML = T[S.screen]();
  if (keep && $('.kdwrap')) $('.kdwrap').scrollTop = keepTop;
  if (briefOpen()) app.insertAdjacentHTML('beforeend', briefHTML());
  else if (truthOpen()) app.insertAdjacentHTML('beforeend', truthHTML());
  else if (excuseOpen()) app.insertAdjacentHTML('beforeend', excuseHTML());
  else if (stepCase() && S.run.note && !S.run.hint) app.insertAdjacentHTML('beforeend', noteHTML());
  const chat = $('.chat');
  if (chat) chat.scrollTop = chat.scrollHeight;
  const pin = $('.pincard.new'), pins = $('.pins');   // the card that flies in is in view
  if (pin) pins.scrollLeft += Math.max(0, pin.getBoundingClientRect().right - pins.getBoundingClientRect().right + 12);
  if (S.screen === 'story' || S.screen === 'evidence') {
    refreshRows();
    watchScroll();
  }
  coach();
}

function rowsHTML(act) {
  return S.c.sentences.map(s => `<div class="row" data-act="${act}" data-sid="${s.id}">${names(s.text)}</div>`).join('');
}

function refreshRows() {
  const r = S.run;
  const onEvidence = S.screen === 'evidence';
  document.querySelectorAll('.rows .row[data-sid]').forEach(el => {
    const s = sent(el.dataset.sid);
    el.classList.toggle('heard', r.heard.has(s.id));
    el.classList.toggle('selected', onEvidence && r.picks.includes(s.id));
    el.classList.toggle('dim', onEvidence && (r.assisted ? s.role !== 'evidence' : !!r.highlight && !r.highlight.has(s.id)));
    el.classList.toggle('pulse', onEvidence && r.assisted && s.role === 'evidence');
  });
}

// Logs reaching the end of the text once per case, and scrolling back up after that (a reread).
function watchScroll() {
  const el = $('.rows');
  const r = S.run;
  const check = () => {
    const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    if (atEnd) {
      if (!r.scrolledEnd) log('scroll_end', { fit: el.scrollHeight <= el.clientHeight + 4 });
      r.scrolledEnd = true;
      r.backArmed = true;
      r.maxTop = el.scrollTop;
    } else if (r.backArmed && el.scrollTop < r.maxTop - 80) {
      r.backArmed = false;
      log('scroll_back');
    }
  };
  el.addEventListener('scroll', check, { passive: true });
  requestAnimationFrame(check);
}

// A pair case needs two proof sentences, every other case one.
const need = () => S.c.type === 'pair' ? 2 : 1;

function evFooter() {
  const r = S.run;

// Where each word of a word search sits: { WORD: { cells: [grid indexes], down, n } }, → and ↓ only.
function wordSpots(w) {
  const rows = w.grid.map(r => [...r]), n = rows[0].length, out = {};
  for (const [, word] of w.find) {
    const L = [...word];
    for (let y = 0; y < rows.length && !out[word]; y++) for (let x = 0; x < n && !out[word]; x++) {
      for (const down of [false, true]) {
        const cells = L.map((_, k) => down ? (y + k) * n + x : y * n + x + k);
        if ((down ? y + L.length <= rows.length : x + L.length <= n) && L.every((ch, k) => rows[down ? y + k : y][down ? x : x + k] === ch)) { out[word] = { cells, down, n }; break; }
      }
    }
  }
  return out;
}

// A new message during a step comes as a card at the bottom; the screen waits for »V redu«.

    ${spk(hmm >= 0 ? `${S.c.id}_lm${hmm + 1}` : 'ui_' + key)}<button class="btn" data-act="noteOk">V redu</button></div>`;

const qbarB = (text, clip) => `<div class="qbar"><span class="q bq" data-act="brief">${esc(text)}</span>${spk(clip)}</div>`;

// Where a sentence of a step case is found: a puzzle or UGOVOR gives it (from), an answer in the
// questioning (ask), or else an object in the scene. A step counts only its own sentences.
const stepOf = (s) => s.from || (s.ask ? 'ask' : 'scene');
const own = (step) => S.c.sentences.filter(s => stepOf(s) === step);
function deliver(sid) {
  if (!S.run.found.includes(sid)) S.run.found.push(sid);
}
const unq = (t) => t.replace(/^»|«$/g, '');
// ⏰ a sentence about another time than the deed's: a ⏰ card from before or after, or when: on the sentence
const wrongTime = (s, c = S.c) => ['before', 'after'].includes(c.when ? c.when.cards[s.id] : s.when);
// the time words of a sentence, marked (the ⏰ step's second hint); tags are left alone
const TIME_RE = /(?<!\p{L})(?:(?:ob|pred|med|po|od|do)\s+\p{L}+|medtem ko|potem ko|preden|šele|zjutraj|opoldne|zvečer|ponoči|potem)(?!\p{L})/giu;
const timeMark = (html) => html.split(/(<[^>]+>)/).map(p => p[0] === '<' ? p : p.replace(TIME_RE, '<mark class="tw">$&</mark>')).join('');
const liarOf = (c = S.c) => c.lie && c.sentences.find(s => s.id === c.lie.claim).who;

// The lie is caught: the first time ever the child shouts UGOVOR (a big red button), then the stamp
// slams onto the claim, the liar blushes and "types", and the truth arrives and goes into the pocket.
function lieCatch() {
  const r = S.run, liar = liarOf();
  r.caught = true;
  r.lbroke = r.lrows;
  r.lrows = [];
  r.note = null;
  log('lie_done', { wrong: r.lwrong, assisted: r.lassisted, liar, liarIsCulprit: liar === S.c.culprit });
  if (store.read(UGOVOR_KEY, false)) { lieStamp(); return; }
  r.lphase = 'shout';
  render();
  play('ui_lieShout', UI_AUDIO.lieShout, $('.shout .row'));
}
function lieStamp() {
  const r = S.run, c = S.c, s = sent(c.lie.truth);
  r.lphase = 'stamp';
  render();
  sfx('stamp');
  play('ui_lieStamp', UI_AUDIO.lieStamp);
  const scr = $('.liestep');
  if (scr && !matchMedia('(prefers-reduced-motion: reduce)').matches) scr.classList.add('shake');
  setTimeout(() => {
    if (S.screen !== 'lie' || S.run !== r || r.lphase !== 'stamp') return;
    r.lphase = 'done';
    deliver(s.id);
    sfx('pop');
    render();
  }, 1700);
}

// ✉️ The coded note is the sentence it gives, in capitals, word by word: a letter has its symbol (e), the rest shows plain.
function cipherCells(k) {
  const sym = Object.fromEntries(Object.entries(k.key).map(([e, l]) => [l, e]));
  return sent(k.gives).text.toUpperCase().split(' ').map(w => [...w].map(ch => /\p{L}/u.test(ch) ? { ch, e: sym[ch] } : { ch }));
}
