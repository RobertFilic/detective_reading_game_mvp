<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Detektiv">
<meta name="theme-color" content="#fdf6e9">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<title>Detektivska pisarna</title>
<style>
:root {
  --bg: #fdf6e9; --ink: #2b2a33; --muted: #6b6876; --card: #fff; --line: #e6dcc8;
  --accent: #3d6fd8; --accent-ink: #fff; --heard: #eef3ff; --sel: #ffe9a8; --sel-line: #e0a800;
  --good: #dff3e6; --warn: #fff1cc; --bad: #fbe0dc; --danger: #c0392b;
  --row-font: 24px;
}
.level-A { --row-font: 30px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
}
input { -webkit-user-select: text; user-select: text; font: inherit; }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.screen {
  flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 900px; margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
/* Centred screens scroll when the content is taller than the screen (small phones), instead of cutting off the top. */
.center { justify-content: flex-start; align-items: center; text-align: center; gap: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.center > :first-child { margin-top: auto; }
.center > :last-child { margin-bottom: auto; }
h1 { font-size: 40px; margin: .2em 0; }
h2 { font-size: 28px; margin: 1em 0 .4em; }
h3 { margin: 0 0 .5em; }
.muted { color: var(--muted); }
.btn {
  appearance: none; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-size: 24px; font-weight: 600; padding: 14px 28px; min-height: 60px; cursor: pointer;
}
.btn:disabled { opacity: .35; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.btn.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: var(--card); color: var(--danger); border: 2px solid var(--danger); }
.btn.big { font-size: 32px; padding: 20px 48px; }
.spk {
  appearance: none; border: 2px solid var(--line); background: var(--card); border-radius: 50%;
  width: 56px; height: 56px; flex: none; font-size: 26px; cursor: pointer;
}
.spk.playing { border-color: var(--accent); }
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.qbar .q { font-size: 28px; font-weight: 700; }
.center .qbar { justify-content: center; }
.qbar.big .q { font-size: 40px; }
.case-no { color: var(--muted); font-weight: 600; }
.rows {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 12px;
}
.row {
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px;
  min-height: 56px; font-size: var(--row-font); line-height: 1.35; display: flex; align-items: center;
  cursor: pointer; text-align: left; transition: opacity .2s; flex: none;
}
.row.heard { background: var(--heard); }
.row.playing { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 111, 216, .25); }
.row.selected { background: var(--sel); border-color: var(--sel-line); }
.row.dim { opacity: .3; }
.row.pulse { animation: pulse 1.1s ease-in-out infinite; border-color: var(--sel-line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(224, 168, 0, .45); } }
.footer { display: flex; gap: 12px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding-top: 12px; }
.locked .rows, .locked .footer { pointer-events: none; }
.locked .footer { opacity: .4; }
.suspects { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.suspect {
  appearance: none; font: inherit; color: inherit; background: var(--card); border: 2px solid var(--line);
  border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  min-width: 140px; font-size: 24px; font-weight: 600;
}
button.suspect { cursor: pointer; }
.avatar { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; }
.avatar.sm { width: 56px; height: 56px; font-size: 32px; flex: none; }
.sticker { font-size: 88px; line-height: 1; }
.stamp {
  font-size: 40px; font-weight: 800; color: var(--danger); border: 6px solid var(--danger);
  border-radius: 12px; padding: 6px 22px; transform: rotate(-5deg);
}
.reveal-rows { flex: none; width: 100%; max-width: 720px; }
.board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.board-head .q { font-size: 30px; font-weight: 800; }
.board-head .count { margin-left: auto; font-size: 22px; font-weight: 700; color: var(--muted); }
.board {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; align-content: start;
  background: #d9b48a; border: 10px solid #a8763f; border-radius: 18px;
}
.folder {
  appearance: none; font: inherit; color: inherit; cursor: pointer; position: relative; text-align: center;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 6px 16px 14px 14px; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 170px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
}
.folder .no { position: absolute; top: 6px; left: 10px; font-weight: 800; color: var(--muted); font-size: 16px; }
.folder .stk { font-size: 52px; line-height: 1.1; }
.folder .fq { font-size: 18px; font-weight: 600; line-height: 1.25; }
.folder .place { font-size: 14px; font-weight: 700; color: #1f7a8c; background: #dff4f7; border-radius: 8px; padding: 0 6px; }
.folder .lvl { font-size: 15px; letter-spacing: 1px; margin-top: auto; }
.folder.solved { background: #e9f6ec; border-color: #9fd3ad; }
.folder.solved .stk { opacity: .55; }
.folder .tick {
  position: absolute; top: 34px; right: 8px; font-size: 22px; font-weight: 900; color: var(--danger);
  border: 3px solid var(--danger); border-radius: 8px; padding: 0 6px; transform: rotate(-8deg); background: rgba(255, 255, 255, .8);
}
.folder.suggest { border-color: var(--sel-line); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(224, 168, 0, .45); } }
/* first-time tutorial: Babica (owl) coach bubble + the thing to tap glows */
.coach {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 20px)); z-index: 20;
  display: flex; gap: 12px; align-items: center; background: #fff; border: 3px solid var(--accent); border-radius: 20px;
  padding: 10px 14px; font-size: 22px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); animation: coachIn .3s ease-out;
}
.coach.top { top: calc(10px + env(safe-area-inset-top)); }
.coach.bottom { bottom: calc(10px + env(safe-area-inset-bottom)); }
.coach .owl { font-size: 44px; line-height: 1; flex: none; }
.coach .say { flex: 1; }
.coach .btn { flex: none; }
@keyframes coachIn { from { opacity: 0; transform: translateX(-50%) scale(.9); } }
.coach-target { outline: 4px solid var(--sel-line); outline-offset: 4px; border-radius: 16px; animation: pulse 1.1s ease-in-out infinite; }
/* Detective ID card */
.idcard {
  width: min(440px, 100%); background: linear-gradient(135deg, #fffaf0, #f3e6c9); border: 2px solid #d9c08f;
  border-radius: 16px; padding: 10px 14px 12px; text-align: left; box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
}
.id-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: #8a6a2f; }
.id-body { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
.id-photo { font-size: 64px; line-height: 1; background: #fff; border: 2px solid #e2cfa4; border-radius: 12px; padding: 4px 8px; }
.id-text { display: flex; flex-direction: column; gap: 2px; font-size: 17px; }
.id-text b { font-size: 24px; }
.id-stamps { display: flex; gap: 8px; }
.stamp-slot { font-size: 22px; width: 38px; height: 38px; border: 2px dashed #d9c08f; border-radius: 50%; display: flex; align-items: center; justify-content: center; filter: grayscale(1); opacity: .35; }
.stamp-slot.got { filter: none; opacity: 1; border: 2px solid var(--danger); transform: rotate(-8deg); background: #fff; }
.files-screen { overflow-y: auto; -webkit-overflow-scrolling: touch; gap: 12px; }
.files-card { position: relative; display: flex; justify-content: center; }
.files-card .edit { position: absolute; bottom: 10px; right: max(10px, calc(50% - 210px)); min-height: 40px; padding: 4px 10px; font-size: 18px; }
.file-list { display: flex; flex-direction: column; gap: 10px; }
.file-card {
  appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left;
  background: #fff3cf; border: 2px solid #e2c98f; border-radius: 18px; padding: 12px 16px; box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
}
.file-card.done { background: #e9f6ec; border-color: #9fd3ad; }
.file-card .fi { font-size: 48px; line-height: 1; }
.file-card .ft { flex: 1; display: flex; flex-direction: column; }
.file-card .ft b { font-size: 22px; }
.file-card .cast { font-size: 24px; letter-spacing: 2px; }
.file-card .fp { font-weight: 800; color: var(--muted); font-size: 18px; white-space: nowrap; }
.file-soon { color: var(--muted); text-align: center; font-size: 16px; padding: 4px; }
.folder.final { background: #fff0f6; border-color: #f0b8d0; }
.folder.locked { cursor: pointer; }
.folder.locked .stk { filter: grayscale(1); opacity: .6; }
.folder.locked .fq { color: var(--muted); font-weight: 500; }
.toast { background: var(--warn); border: 2px solid var(--sel-line); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; }
.kudos { font-size: 22px; font-weight: 800; color: var(--accent); }
/* ID card maker */
.make { gap: 16px; }
.mk-top { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; min-height: 44px; }
.mk-back { min-height: 44px; padding: 4px 14px; font-size: 18px; }
.steps-dots { display: flex; gap: 8px; }
.steps-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.steps-dots i.on { background: var(--accent); }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(90px, 140px)); gap: 12px; justify-content: center; }
.pick-grid.four { grid-template-columns: repeat(4, minmax(70px, 120px)); }
.pick {
  appearance: none; font: inherit; color: var(--muted); cursor: pointer; background: var(--card); border: 3px solid var(--line);
  border-radius: 18px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; font-weight: 600;
}
.pick.on { border-color: var(--accent); background: var(--heard); }
.pick .pe { font-size: 56px; line-height: 1.1; }
.name-in { font-size: 28px; padding: 10px 16px; border: 3px solid var(--line); border-radius: 16px; width: min(320px, 100%); text-align: center; background: #fff; }
.name-in:focus { outline: none; border-color: var(--accent); }
.trophy { background: var(--good); border-radius: 14px; padding: 8px 14px; font-weight: 700; margin-bottom: 10px; text-align: center; }
.hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
  width: min(860px, calc(100% - 32px)); background: #fffbe9; border: 3px solid var(--sel-line); border-radius: 20px;
  padding: 14px 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
  font-size: 26px; z-index: 10;
}
.hint .txt { flex: 1; }

/* Phones: portrait (narrow) */
@media (max-width: 600px) {
  :root { --row-font: 20px; }
  .level-A { --row-font: 23px; }
  .screen { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .center { gap: 14px; }
  h1 { font-size: 30px; }
  .qbar { gap: 8px; margin-bottom: 8px; }
  .qbar .q { font-size: 21px; }
  .qbar.big .q { font-size: 27px; }
  .btn { font-size: 20px; padding: 12px 20px; min-height: 52px; }
  .btn.big { font-size: 24px; padding: 14px 28px; }
  .spk { width: 44px; height: 44px; font-size: 20px; }
  .row { padding: 8px 12px; min-height: 48px; border-radius: 12px; }
  .rows { gap: 6px; }
  .suspects { gap: 10px; }
  .suspect { min-width: 96px; padding: 10px 12px; font-size: 19px; border-radius: 16px; }
  .avatar { width: 64px; height: 64px; font-size: 36px; }
  .avatar.sm { width: 40px; height: 40px; font-size: 24px; }
  .sticker { font-size: 56px; }
  .stamp { font-size: 28px; border-width: 4px; padding: 4px 14px; }
  .board-head .q { font-size: 23px; }
  .board-head .count { font-size: 17px; }
  .board { grid-template-columns: repeat(2, 1fr); padding: 8px; gap: 8px; border-width: 6px; border-radius: 14px; }
  .folder { min-height: 128px; padding: 10px 6px 8px; gap: 4px; }
  .folder .stk { font-size: 38px; }
  .folder .fq { font-size: 15px; }
  .folder .no { font-size: 14px; top: 4px; left: 8px; }
  .folder .tick { font-size: 16px; top: 24px; right: 6px; border-width: 2px; }
  .folder .place { font-size: 12px; }
  .hint { flex-wrap: wrap; font-size: 20px; padding: 12px 14px; gap: 8px 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 20px); }
  .hint .txt { flex: 1 1 calc(100% - 40px); }
  .hint .spk { margin-left: auto; }
  .reveal { gap: 10px; }
  .kudos { font-size: 19px; }
  .footer .btn.secondary { font-size: 17px; padding: 8px 14px; min-height: 46px; }
  .pick .pe { font-size: 44px; }
  .pick-grid { gap: 8px; }
  .id-photo { font-size: 52px; }
  .id-text b { font-size: 20px; }
  .file-card { padding: 10px 12px; gap: 10px; }
  .file-card .fi { font-size: 38px; }
  .file-card .ft b { font-size: 19px; }
  .file-card .cast { font-size: 20px; }
  .coach { font-size: 18px; padding: 8px 10px; gap: 8px; }
  .coach .owl { font-size: 34px; }
  .reveal .sticker { display: none; }
  .reveal .suspect { flex-direction: row; padding: 6px 14px; }
  .reveal .avatar { width: 44px; height: 44px; font-size: 26px; }
  .reveal .row { min-height: 0; padding: 6px 12px; font-size: 19px; }
}

/* Phones: landscape (short) */
@media (max-height: 500px) {
  .screen { padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .center { gap: 10px; }
  h1 { font-size: 28px; }
  .qbar.big .q { font-size: 26px; }
  .sticker { font-size: 44px; }
  .avatar { width: 56px; height: 56px; font-size: 32px; }
  .suspect { padding: 8px 12px; }
  .btn.big { font-size: 22px; padding: 10px 26px; min-height: 48px; }
  .hint { font-size: 20px; padding: 10px 14px; }
  .folder { min-height: 120px; }
  /* Solved screen: the explanation scrolls, "Naprej" stays on screen. */
  .reveal { overflow: hidden; gap: 6px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .reveal .stamp { font-size: 24px; border-width: 4px; padding: 2px 14px; }
  .reveal > :first-child, .reveal > :last-child { margin-top: 0; margin-bottom: 0; }
  .reveal .sticker, .reveal .suspect { display: none; }
  .reveal .reveal-rows { flex: 1 1 auto; min-height: 0; padding-bottom: 4px; }
  .reveal .row { min-height: 0; padding: 6px 12px; font-size: 19px; }
}

#gate { position: fixed; top: 0; left: 0; width: 64px; height: 64px; z-index: 40; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: flex; align-items: center; justify-content: center; z-index: 50; }
#modal[hidden] { display: none; }
.modal-box { background: var(--card); border-radius: 20px; padding: 24px; width: min(420px, calc(100% - 32px)); }
.modal-box input { width: 100%; font-size: 28px; padding: 10px; border: 2px solid var(--line); border-radius: 12px; }

/* adult screens */
.adult { overflow-y: auto; font-size: 17px; max-width: 1100px; }
.adult .btn { font-size: 18px; min-height: 48px; padding: 10px 18px; border-radius: 12px; }
.adult .btn.big { font-size: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.seg { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.warn-text { color: #8a5a00; }
.tag { background: var(--warn); border-radius: 6px; padding: 1px 6px; font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); white-space: nowrap; }
tr.clickable { cursor: pointer; }
.c-good { background: var(--good); } .c-warn { background: var(--warn); } .c-bad { background: var(--bad); }
.timeline { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
.timeline .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.verdict { font-weight: 700; padding: 1px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="gate" aria-hidden="true"></div>
<div id="modal" hidden></div>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Case data. tools/cases.mjs reads everything between the CASES markers, so
// keep this block free of DOM access.
// ---------------------------------------------------------------------------
// CASES-BEGIN
const LEVEL_RULES = {
  A: { sentences: [7, 9], maxWords: 8, suspects: 3, distractors: [1, 1] },
  B: { sentences: [9, 11], maxWords: 14, suspects: 4, distractors: [1, 2] },
};

// animal = the picture on the card (an animal or a person); re = the name in any case form,
// used by tools/cases.mjs to check that the evidence names the culprit.
const CHARACTERS = {
  bine: { name: 'Bine', animal: '🐰', color: '#d6e6ff', re: 'Bine(ta|tu|tom)?' },
  zala: { name: 'Zala', animal: '🦊', color: '#ffdcc6', re: 'Zal(a|o|e|i)' },
  jure: { name: 'Jure', animal: '🐻', color: '#ead8c4', re: 'Jure(ta|tu|tom)?' },
  neza: { name: 'Neža', animal: '🐿️', color: '#f1e2c8', re: 'Než(a|o|e|i)' },
  babica: { name: 'Babica', animal: '🦉', color: '#e4e1f6', re: 'Babic(a|o|e|i)' },
  // 🚀 Vesoljska postaja Zvezdica
  maja: { name: 'Maja', animal: '👩🏼‍🚀', color: '#dbe4ff', re: 'Maj(a|o|e|i)' },
  tim: { name: 'Tim', animal: '👨🏽‍🚀', color: '#e2f2e6', re: 'Tim(a|u|om)?' },
  ela: { name: 'Ela', animal: '👩🏿‍🚀', color: '#f6e2f0', re: 'El(a|o|e|i)' },
  robi: { name: 'Robi', animal: '🤖', color: '#e6e9ee', re: 'Robi(ja|ju|jem)?' },
  // 🐄 Pri babici na kmetiji
  nik: { name: 'Nik', animal: '👦🏻', color: '#dff0ff', re: 'Nik(a|u|om)?' },
  pia: { name: 'Pia', animal: '👧🏼', color: '#ffe3ea', re: 'Pi(a|o|e|ji)' },
  dedek: { name: 'Dedek', animal: '👴🏻', color: '#efe6d8', re: 'Ded(ek|ka|ku|kom)' },
  jan: { name: 'Jan', animal: '👨🏽‍🌾', color: '#e8f3d8', re: 'Jan(a|u|om)?' },
};

// Case files (mape): one place, one cast. Every case has file + no (1, 2, … within the file).
// The original animal cases are the forest file. A case marked final opens when the
// other cases of its file are solved. docs/CASE_FILES.md has the backlog of themes.
const FILES = [
  { id: 'vesolje', icon: '🚀', title: 'Vesoljska postaja', cast: ['maja', 'tim', 'ela', 'robi'] },
  { id: 'kmetija', icon: '🐄', title: 'Pri babici na kmetiji', cast: ['nik', 'pia', 'dedek', 'jan'] },
  { id: 'gozd', icon: '🌲', title: 'Gozdna mapa', cast: ['bine', 'zala', 'jure', 'neza'] },
];

// Every line the child can hear outside the stories. Clip id = "ui_" + key.
const UI_AUDIO = {
  test: 'Ali me slišiš?',
  accuse: 'Kdo je bil?',

// Audio: embedded clip → audio/<id>.m4a → Slovenian speechSynthesis voice
// ---------------------------------------------------------------------------
const player = new Audio();
let playToken = 0;
let playingEl = null;
let slVoice = null;

function loadVoices() {
  const had = !!slVoice;
  try { slVoice = speechSynthesis.getVoices().find(v => /^sl/i.test(v.lang)) || null; } catch (e) { slVoice = null; }
  if (S.screen === 'setup' || had !== !!slVoice) render();
}

// 🔊 buttons only when something can actually be heard (recordings or a Slovenian voice).
const canSpeak = () => Object.keys(AUDIO).length > 0 || !!slVoice;

function markPlaying(el) {
  if (playingEl) playingEl.classList.remove('playing');
  playingEl = el;
  if (el) el.classList.add('playing');
}

function stopAudio() {
  playToken++;
  try { player.pause(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  markPlaying(null);
}

function play(id, text, el) {
  stopAudio();
  const tok = playToken;
  let fellBack = false;
  markPlaying(el);
  const done = () => { if (tok === playToken) markPlaying(null); };
  const speak = () => {
    if (tok !== playToken || fellBack) return;
    fellBack = true;
    if (!slVoice) { setTimeout(done, 800); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = slVoice; u.lang = slVoice.lang; u.rate = 0.9;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  };
  // Without an embedded recording, speak right away: iPad Safari only allows speech inside the tap itself.
  if (!AUDIO[id] && slVoice) { speak(); return; }
  player.onended = done;
  player.onerror = speak;
  player.src = AUDIO[id] || `audio/${id}.m4a`;
  const p = player.play();
  if (p && p.catch) p.catch(speak);
}

// The case to play for file + number: the child's level, or level A when a themed file
// has only one version.
function caseFor(file, no) {
  return CASES.find(c => c.file === file && c.no === no && c.level === S.level)
    || CASES.find(c => c.file === file && c.no === no && c.level === 'A');
}
const casesIn = (file) => [...new Set(CASES.filter(c => c.file === file).map(c => c.no))].sort((a, b) => a - b).map(no => caseFor(file, no));
const caseKey = (c) => `${c.file}:${c.no}`;

// "Po vrsti": the forest file, from the chosen case to the last.
function caseOrder() {
  return casesIn('gozd').map(c => c.no).filter(no => no > S.startAt);
}

// Solved cases on this device, as "file:no" (older saves held forest numbers only).
function solvedKeys() {
  return store.read(PLAYED_KEY, []).map(k => typeof k === 'number' ? `gozd:${k}` : k);
}
const isSolved = (c) => solvedKeys().includes(caseKey(c));
// A final case opens when the rest of its file is solved.
const isLocked = (c) => !!c.final && casesIn(c.file).some(x => !x.final && !isSolved(x));
const fileDone = (file) => casesIn(file).every(isSolved);
const ALL_KEYS = FILES.flatMap(f => casesIn(f.id).map(caseKey));

// Case board: the child picks any case of the file. Solved cases get a tick, and one
// unsolved case glows as a suggestion: a random one among the easiest still open.
function pickSuggestion() {
  const open = casesIn(S.file).filter(c => !isSolved(c) && !isLocked(c));
  if (!open.length) return null;
  const easiest = Math.min(...open.map(c => c.rung));
  const pool = open.filter(c => c.rung === easiest);
  return pool[Math.floor(Math.random() * pool.length)].no;
}

function playCase(no) {

}

// What Babica says on each screen, and which element glows.
function coachStep() {
  const t = S.tut, r = S.run;
  if (!t) return null;
  if (S.screen === 'files') return t.board ? { text: 'Zdaj izberi mapo in reši svoj primer!', sel: '.file-card', ok: true } : null;
  if (S.screen === 'board') return null;
  if (t.msg) return { text: t.msg, sel: null, ok: true };
  switch (S.screen) {
    case 'intro': return { text: 'Tvoj prvi primer! Najprej preberi zgodbo.', sel: '[data-act="toStory"]' };
    case 'story': return t.read
      ? { text: 'Ko veš, kdo je bil, tapni tukaj.', sel: '[data-act="know"]' }
      : { text: 'Preberi vse stavke. Kdo je pojedel korenček?', sel: '.rows', ok: true };
    case 'accuse': return { text: 'Kdo je bil? Tapni pravo živalco.', sel: '.suspects' };
    case 'evidence': return r && r.selected
      ? { text: 'Tapni »To je dokaz!«', sel: '[data-act="confirm"]' }
      : { text: 'Kateri stavek to dokaže? Tapni ga.', sel: '.rows' };
    case 'reveal': return { text: `Bravo, ${detTitle().toLowerCase()}! Tako se igra. 🎉`, sel: '[data-act="next"]' };
  }
  return null;
}

function coach() {
  document.querySelectorAll('.coach').forEach(el => el.remove());
  document.querySelectorAll('.coach-target').forEach(el => el.classList.remove('coach-target'));
  const step = coachStep();
  if (!step) return;
  const target = step.sel && document.querySelector(step.sel);
  if (target) target.classList.add('coach-target');
  // Put the bubble on the side with more room, so it doesn't cover what to tap.
  const rect = target ? target.getBoundingClientRect() : null;
  const top = rect ? rect.top > innerHeight - rect.bottom : false;
  document.body.insertAdjacentHTML('beforeend', `<div class="coach ${top ? 'top' : 'bottom'}">
    <span class="owl">🦉</span><span class="say">${esc(step.text)}</span>
    ${step.ok ? '<button class="btn" data-coach="ok">V redu</button>' : ''}</div>`);
}

// Logs reaching the end of the text once per case, and scrolling back up after that (a reread).
function watchScroll() {
  const el = $('.rows');
  const r = S.run;
  const check = () => {
    const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    if (atEnd) {
      if (!r.scrolledEnd) log('scroll_end', { fit: el.scrollHeight <= el.clientHeight + 4 });
      r.scrolledEnd = true;
      r.backArmed = true;
      r.maxTop = el.scrollTop;
    } else if (r.backArmed && el.scrollTop < r.maxTop - 80) {
      r.backArmed = false;
      log('scroll_back');
    }
  };
  el.addEventListener('scroll', check, { passive: true });
  requestAnimationFrame(check);
}

// ---------------------------------------------------------------------------
// Actions (all taps go through data-act)
// ---------------------------------------------------------------------------
const ACTIONS = {
  age(el) { S.age = el.dataset.age; render(); },
  pilot(el) { S.pilot = el.checked; },
  startAt(el) { S.startAt = Number(el.dataset.n); render(); },
  orderMode(el) { S.orderMode = el.dataset.mode; render(); },
  resetBoard() {
    if (!confirm('Nov otrok: počistim izkaznico in vse kljukice? Zapisi v pregledu ostanejo.')) return;
    store.write(PLAYED_KEY, []);
    store.write(TUT_KEY, false);   // a new child also gets the practice case
    store.write(PROFILE_KEY, null); // and makes their own ID card
    render();
  },
  openFile(el) {
    S.tut = null;
    S.file = el.dataset.file;
    S.toast = null;
    log('file_open', { file: S.file });
    toBoard();
  },
  toFiles() { S.toast = null; toHome(); },
  lockedCase() {
    S.toast = '🔒 Veliki primer se odpre, ko rešiš ostale primere v tej mapi.';
    render();
  },
  openCase(el) {
    S.tut = null;
    S.toast = null;
    if (S.c) log('more_yes');
    playCase(Number(el.dataset.no));
  },
  editCard() {
    const p = profile();
    S.mk = { step: 1, av: p.av, g: p.g, sk: p.sk, name: p.name || '', id: p.id };
    go('make');
  },
  mkBack() { S.mk.step--; render(); },
  mkAvatar(el) {
    const a = AVATARS[Number(el.dataset.i)];
    Object.assign(S.mk, { av: a.e, g: a.g, step: 2 });
    render();
  },
  mkSidekick(el) { Object.assign(S.mk, { sk: el.dataset.e, step: 3 }); render(); },
  mkName() {
    S.mk.name = cleanName($('#mkName').value || '');
    S.mk.id = S.mk.id || String(1000 + Math.floor(Math.random() * 9000));
    S.mk.step = 4;
    render();
  },
  mkSkip() { S.mk.name = ''; S.mk.id = S.mk.id || String(1000 + Math.floor(Math.random() * 9000)); S.mk.step = 4; render(); },
  mkDone() {
    const m = S.mk;
    store.write(PROFILE_KEY, { av: m.av, g: m.g, sk: m.sk, name: m.name, id: m.id });
    log('profile_saved', { gender: m.g, named: !!m.name }); // the name itself is never logged
    S.mk = null;
    toHome();
  },
  tutorial() { startTutorial(); },
  startSession() {
    const n = store.read(CHILD_KEY, 0) + 1;
    store.write(CHILD_KEY, n);
    Object.assign(S, {
      session: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      child: 'O' + pad(n), level: KID_MODE ? KID_LEVEL : S.age === '6-7' ? 'A' : 'B', ended: false, resume: null, c: null, run: null,
    });
    S.order = S.orderMode === 'fixed' ? caseOrder() : [];
    S.started = 0;
    log('session_start', { pilot: S.pilot, orderMode: S.orderMode, order: S.order, kid: KID_MODE });
    go('title');
  },
  toDebrief() { go('debrief'); },
  backToBoard() { S.ended = false; log('session_resume'); toBoard(); },
  toSetup() {
    if (S.session && !S.ended) log('session_end', { abandoned: true });
    Object.assign(S, { session: null, ended: false, resume: null, c: null, run: null, level: null, pilot: false, startAt: 0, order: [] });
    go('setup');
  },
  resume() { const to = S.resume; S.resume = null; go(to); },
  timeline(el) { S.open = S.open === el.dataset.key ? null : el.dataset.key; render(); },
  exportLog() {
    const blob = new Blob([JSON.stringify({ app: 'detektivska-pisarna', version: 1, exported: new Date().toISOString(), events: LOG }, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `detektiv-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  },
  wipe() {
    if (!confirm('Izbrišem vse zapise na tej napravi? Najprej izvozi JSON.')) return;
    LOG = [];
    store.write(LOG_KEY, LOG);
    render();
  },

  say(el) {
    play(el.dataset.clip, CLIPS.get(el.dataset.clip) || '', el);
    if (!ADULT.has(S.screen)) log('listen_prompt', { clip: el.dataset.clip });
  },
  begin() { if (S.orderMode === 'board') toHome(); else startCase(0); },
  toStory() { go('story'); },
  listen(el) {
    const s = sent(el.dataset.sid);
    play(S.c.id + '_' + s.id, s.text, el);
    log('listen', { sentenceId: s.id, role: s.role });
    S.run.heard.add(s.id);
    refreshRows();
  },
  know() {
    if (!S.run.scrolledEnd) log('accuse_early');
    go('accuse');
  },
  reread() { log('back_to_story'); go('story'); },
  pick(el) {
    if (S.tut && el.dataset.id !== S.c.culprit) {
      S.tut.msg = 'Hmm, ni še prav. Kdo je pojedel korenček? Preberi še enkrat.';
      coach();
      return;
    }
    S.run.suspect = el.dataset.id;
    S.run.selected = null;
    log('suspect_pick', { suspectId: el.dataset.id });
    go('evidence');
  },
  select(el) {
    const r = S.run;
    if (r.hint) return;
    const s = sent(el.dataset.sid);
    r.selected = s.id;
    play(S.c.id + '_' + s.id, s.text, el);
    log('evidence_select', { sentenceId: s.id, role: s.role });
    r.heard.add(s.id);
    refreshRows();
    $('.footer').innerHTML = evFooter();
    coach();
  },
  confirm() {
    const r = S.run, c = S.c;
    if (!r.selected || r.hint) return;
    const s = sent(r.selected);
    const isEvidence = s.role === 'evidence';
    const rightSuspect = r.suspect === c.culprit;
    const solved = isEvidence && (rightSuspect || r.assisted);
    if (S.tut) {
      // Practice: no hint ladder and no tick on the board, just a gentle nudge.
      if (solved) { go('reveal'); return; }
      r.selected = null;
      refreshRows();
      $('.footer').innerHTML = evFooter();
      S.tut.msg = 'To ni ta stavek. Poišči, kje piše, kdo je pojedel korenček.';
      coach();
      return;
    }
    log('evidence_confirm', { sentenceId: s.id, role: s.role, suspectId: r.suspect, correct: solved, suspectCorrect: rightSuspect });
    if (solved) {
      log('case_done', { assisted: r.assisted, wrong: r.wrong });
      const played = solvedKeys();
      if (!played.includes(caseKey(S.c))) store.write(PLAYED_KEY, [...played, caseKey(S.c)]);
      go('reveal');
      return;
    }
    r.wrong++;
    r.selected = null;
    let h;
    if (r.assisted || r.wrong >= 4) {
      if (!r.assisted) { r.assisted = true; log('assisted'); }
      h = { key: 'assist', text: UI_AUDIO.assist, clip: 'ui_assist', level: 4 };
    } else if (isEvidence) {
      h = { key: 'wrongSuspect', text: UI_AUDIO.wrongSuspect, clip: 'ui_wrongSuspect', level: 0 };
    } else if (s.role === 'partial') {
      h = { key: 'partial', text: UI_AUDIO.partial, clip: 'ui_partial', level: 0 };
    } else {
      r.ladder = Math.min(r.ladder + 1, 3);
      h = ladderHint(r.ladder);
      if (r.ladder >= 2) r.highlight = new Set(r.ladder === 2 ? c.h2 : c.h3);
    }
    showHint(h);
  },
  hintOk() {
    S.run.hint = null;
    stopAudio();
    const h = $('#hint');
    if (h) h.remove();
    $('.screen').classList.remove('locked');
    log('hint_dismiss');
  },
  changeSuspect() {
    log('suspect_change');
    S.run.selected = null;
    go('accuse');
  },
  next() {
    if (S.tut) { endTutorial(); return; }
    if (S.orderMode === 'board') toBoard(); else go('more');
  },
  moreYes() {
    if (S.caseNo < S.order.length - 1) { log('more_yes'); startCase(S.caseNo + 1); }
    else { log('fake_door'); go('soon'); }
  },
  moreNo() { log('more_no'); go('thanks'); },
  toThanks() { go('thanks'); },
};

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});

// ---------------------------------------------------------------------------
// Adult gate: hold the top-left corner for 3 s, then solve a sum.
// ---------------------------------------------------------------------------
const gate = document.getElementById('gate');
const modal = document.getElementById('modal');
let gateTimer = null;
gate.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clearTimeout(gateTimer);
  gateTimer = setTimeout(openGate, 3000);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => gate.addEventListener(t, () => clearTimeout(gateTimer)));

function openGate() {
  const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
  modal.dataset.answer = String(a + b);
  modal.innerHTML = `<div class="modal-box">
    <p>Za odrasle: koliko je ${a} + ${b}?</p>
    <input id="gateIn" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <div class="footer"><button class="btn secondary" data-m="cancel">Prekliči</button><button class="btn" data-m="ok">Odpri</button></div>
  </div>`;
  modal.hidden = false;
  $('#gateIn').focus();
}

modal.addEventListener('click', (e) => {
  const m = e.target.closest('[data-m]');
  if (!m) return;
  if (m.dataset.m === 'cancel') { modal.hidden = true; return; }
  const input = $('#gateIn');
  if (input.value.trim() !== modal.dataset.answer) { input.value = ''; return; }
  modal.hidden = true;
  if (S.session && !S.ended && !ADULT.has(S.screen)) {
    S.resume = S.screen;
    log('adult_gate');
  }
  go('debrief');
});

// ---------------------------------------------------------------------------
// Debrief metrics
// ---------------------------------------------------------------------------
function analyzeAll() {
  const bySession = new Map();
  for (const e of LOG) {
    if (!bySession.has(e.session)) bySession.set(e.session, []);
    bySession.get(e.session).push(e);
  }
  return [...bySession.values()].map(analyzeSession);
}

function newMetrics(id) {
  const c = caseById(id);
  return {
    id, no: c ? c.no : 0, pos: null, rung: c ? c.rung : 0, time: {}, heard: new Set(), confirmTs: [],
    listens: 0, rereads: 0, confirms: 0, wrong: 0, distractorWrong: 0, partialWrong: 0,
    hints: 0, maxHint: 0, assisted: false, guess: 0, firstLatency: null, firstEvidence: null,
    anchor: null, early: 0, suspectChanges: 0, done: false, more: null,
  };
}

const BOUNDARY = new Set(['screen_enter', 'adult_gate', 'session_end']);

function analyzeSession(evs) {
  const first = evs[0];
  const cases = new Map();
  const M = (id) => { if (!cases.has(id)) cases.set(id, newMetrics(id)); return cases.get(id); };
  let open = null;
  for (const e of evs) {
    if (BOUNDARY.has(e.type) && open) {
      if (open.case) { const t = M(open.case).time; t[open.screen] = (t[open.screen] || 0) + (e.ts - open.ts); }
      open = null;
    }
    if (e.type === 'screen_enter') open = e;
    if (!e.case) continue;
    const m = M(e.case);
    if (m.pos == null && e.pos != null) m.pos = e.pos;
    switch (e.type) {
      case 'screen_enter':
        if (e.screen === 'evidence') { m.anchor = e.ts; if (m.firstEvidence == null) m.firstEvidence = e.ts; }
        break;
      case 'listen':
      case 'evidence_select':
        m.listens++;
        if (m.heard.has(e.sentenceId)) m.rereads++;
        m.heard.add(e.sentenceId);
        break;
      case 'scroll_back':
      case 'back_to_story':
        m.rereads++;
        break;
      case 'accuse_early': m.early++; break;
      case 'suspect_change': m.suspectChanges++; break;
      case 'evidence_confirm': {
        m.confirms++;
        if (m.firstLatency == null && m.firstEvidence != null) m.firstLatency = e.ts - m.firstEvidence;
        const recent = m.confirmTs.filter(t => e.ts - t <= 15000).length;
        if ((m.anchor != null && e.ts - m.anchor < 4000) || recent >= 2) m.guess++;
        m.confirmTs.push(e.ts);
        if (!e.correct) {
          m.wrong++;
          if (e.role === 'distractor') m.distractorWrong++;
          if (e.role === 'partial') m.partialWrong++;
        }
        break;
      }
      case 'hint_shown': m.hints++; m.maxHint = Math.max(m.maxHint, e.hintLevel || 0); break;
      case 'hint_dismiss': m.anchor = e.ts; break;
      case 'assisted': m.assisted = true; break;
      case 'case_done': m.done = true; break;
      case 'more_yes': m.more = 'yes'; break;
      case 'more_no': m.more = 'no'; break;
      case 'fake_door': m.more = 'door'; break;
    }
  }
  const list = [...cases.values()].filter(m => m.no).sort((a, b) => (a.pos || a.no) - (b.pos || b.no));
  for (const m of list) {
    m.outcome = !m.done ? 'unfinished' : m.assisted ? 'assisted' : m.hints <= 1 ? 'clean' : m.hints <= 3 ? 'helped' : 'assisted';
  }
  const stop = list.find(m => !m.done || m.more === 'no');
  return {
    session: first.session, child: first.child, age: first.age, level: first.level, start: first.ts,
    pilot: !!(evs.find(e => e.type === 'session_start') || {}).pilot,
    events: evs, cases: list,
    doneCount: list.filter(m => m.done).length,
    // Q3 is about the first three cases played (by position, so replays count):
    // finished all three, then chose another one.
    firstThree: evs.filter(e => e.type === 'case_done' && (e.pos || 0) <= 3).length,
    wantMore: evs.some(e => (e.type === 'more_yes' && e.pos >= 3) || e.type === 'fake_door'),
    stoppedAtRung: stop ? stop.rung : null,
  };
}

const solvedOk = (m) => m.outcome === 'clean' || m.outcome === 'helped';

function verdict(n, success, fail) {
  if (!n) return '<span class="verdict">–</span>';
  const [label, cls] = success ? ['uspeh', 'c-good'] : fail ? ['neuspeh', 'c-bad'] : ['nejasno', 'c-warn'];
  return `<span class="verdict ${cls}">${label}</span>${n < 4 ? ' <span class="tag">premalo otrok (n&lt;4)</span>' : ''}`;
}

function groupHTML(age, ss) {
  const n = ss.length;
  const attempts = ss.flatMap(s => s.cases);
  const frac = (a, b) => b ? a / b : null;
  const rereadKids = ss.filter(s => s.cases.filter(m => m.rereads > 0).length >= 2).length;
  const confirms = sum(attempts, 'confirms'), guesses = sum(attempts, 'guess');
  const guessRate = frac(guesses, confirms);
  const heavyGuessers = ss.filter(s => { const c = sum(s.cases, 'confirms'); return c && sum(s.cases, 'guess') / c > 0.5; }).length;
  const okShare = frac(attempts.filter(solvedOk).length, attempts.length);
  const finished = ss.filter(s => s.firstThree === 3).length;
  const wantMore = ss.filter(s => s.wantMore).length;
  const wrong = sum(attempts, 'wrong'), distractorWrong = sum(attempts, 'distractorWrong');
  const distractorShare = frac(distractorWrong, wrong);

  const rungRows = [1, 2, 3].map(r => {
    const ms = attempts.filter(m => m.rung === r);
    const share = frac(ms.filter(solvedOk).length, ms.length);
    const stops = ss.filter(s => s.stoppedAtRung === r).length;
    const tooHard = ms.length ? (share < 0.5 || stops >= 2) : null;
    const count = (o) => ms.filter(m => m.outcome === o).length;
    return `<tr><td>${r}. ${['dejstvo', 'sklepanje', 'protislovje'][r - 1]}</td><td>${ms.length}</td>
      <td>${count('clean')} / ${count('helped')} / ${count('assisted')} / ${count('unfinished')}</td>
      <td>${pct(share)}</td><td>${stops}</td>
      <td class="${tooHard == null ? '' : tooHard ? 'c-bad' : 'c-good'}">${tooHard == null ? '–' : tooHard ? 'pretežko' : 'ok'}</td></tr>`;
  }).join('');
  const r4 = distractorShare == null ? null : distractorShare > 0.5;

  return `<section class="card">
    <h3>${age} let · n = ${n}</h3>
    <div class="tablewrap"><table>
      <tr><th>Vprašanje</th><th>Meritev</th><th>Ocena</th></tr>
      <tr><td>V1 Ponovno bere ali ugiba?</td>
        <td>${rereadKids}/${n} otrok ponovno bere v ≥ 2 primerih · ugibanja ${pct(guessRate)} potrditev · ${heavyGuessers}/${n} otrok ugiba &gt; 50 %</td>
        <td>${verdict(n, frac(rereadKids, n) >= 0.8 && guessRate < 0.25, frac(heavyGuessers, n) >= 0.6)}</td></tr>
      <tr><td>V2 Najde dokazni stavek?</td>
        <td>${pct(okShare)} primerov rešenih z ≤ 3 namigi (${attempts.length} poskusov)</td>
        <td>${verdict(n, okShare >= 0.7, okShare < 0.4)}</td></tr>
      <tr><td>V3 Konča in želi še?</td>
        <td>${finished}/${n} končalo prve 3 · ${wantMore}/${n} po 3. primeru tapnilo »Še en primer«<br><span class="muted">»brez nenačrtovane pomoči« preveri na listu opazovalca</span></td>
        <td>${verdict(n, frac(finished, n) >= 0.8 && frac(wantMore, n) >= 0.6, frac(finished, n) <= 0.4 || frac(wantMore, n) <= 0.2)}</td></tr>
    </table></div>
    <h3 style="margin-top:12px">V4 Lestvica spretnosti</h3>
    <div class="tablewrap"><table>
      <tr><th>Stopnja</th><th>Poskusi</th><th>rešeno / s pomočjo / vodeno / ni rešeno</th><th>Rešeno z ≤ 3 namigi</th><th>Odnehali tu</th><th>Ocena</th></tr>
      ${rungRows}
      <tr><td>4. motilci</td><td>${wrong} napačnih</td><td>${distractorWrong} na motilcu</td><td>${pct(distractorShare)} napačnih je motilcev</td><td></td>
        <td class="${r4 == null ? '' : r4 ? 'c-bad' : 'c-good'}">${r4 == null ? '–' : r4 ? 'pretežko' : 'ok'}</td></tr>
    </table></div>
  </section>`;
}

const OUTCOME = {
  clean: ['rešeno', 'c-good'], helped: ['s pomočjo', 'c-warn'],
  assisted: ['vodeno', 'c-bad'], unfinished: ['ni rešeno', 'c-bad'],
};
const MORE = { yes: 'da', no: 'ne', door: 'da (vrata)' };

function sessionHTML(s) {
  const rows = s.cases.map(m => {
    const key = s.session + '|' + m.id;
    const guessCls = !m.confirms ? '' : m.guess === 0 ? 'c-good' : m.guess / m.confirms > 0.5 ? 'c-bad' : 'c-warn';
    const [outLabel, outCls] = OUTCOME[m.outcome];
    const row = `<tr class="clickable" data-act="timeline" data-key="${key}">
      <td>${m.pos || m.no}. ${m.id} <span class="muted">(st. ${m.rung})</span></td>
      <td class="${outCls}">${outLabel}</td>
      <td>${fmtDur(m.time.story || 0)} / ${fmtDur(m.time.evidence || 0)}</td>
      <td>${m.listens}</td>
      <td class="${m.rereads ? 'c-good' : 'c-warn'}">${m.rereads}</td>
      <td>${m.firstLatency == null ? '–' : fmtDur(m.firstLatency)}</td>
      <td class="${m.distractorWrong ? 'c-warn' : ''}">${m.wrong} (${m.distractorWrong} motilec, ${m.partialWrong} delni)</td>
      <td>${m.hints} (max ${m.maxHint})</td>
      <td class="${guessCls}">${m.guess}/${m.confirms}</td>
      <td class="${m.early ? 'c-warn' : ''}">${m.early ? 'da' : 'ne'}</td>
      <td>${MORE[m.more] || '–'}</td>
    </tr>`;
    return row + (S.open === key ? `<tr><td colspan="11">${timelineHTML(s, m.id)}</td></tr>` : '');
  }).join('');
  return `<section class="card">
    <p><b>${esc(s.child)}</b> · ${esc(s.age)} let · raven ${esc(s.level)} · ${fmtDate(s.start)}
      ${s.pilot ? '<span class="tag">pilot</span>' : ''} · rešenih ${s.doneCount} · želi še: ${s.wantMore ? 'da' : 'ne'}</p>
    <div class="tablewrap"><table>
      <tr><th>Primer</th><th>Izid</th><th>Čas zgodba / dokaz</th><th>Poslušanja</th><th>Ponovna branja</th><th>1. potrditev</th>
        <th>Napačne</th><th>Namigi</th><th>Ugibanja</th><th>Prezgodaj</th><th>Še?</th></tr>
      ${rows || '<tr><td colspan="11" class="muted">Ni začetih primerov.</td></tr>'}
    </table></div>
  </section>`;
}

const EVENT_LABEL = {
  screen_enter: 'zaslon', listen: 'posluša', listen_prompt: 'posluša navodilo', scroll_end: 'konec besedila',
  scroll_back: 'pomik nazaj', accuse_early: 'obtoži pred koncem', suspect_pick: 'izbere osumljenca',
  back_to_story: 'še enkrat preberi', evidence_select: 'izbere stavek', evidence_confirm: 'potrdi dokaz',
  hint_shown: 'namig', hint_dismiss: 'zapre namig', assisted: 'vodeno', suspect_change: 'zamenja osumljenca',
  case_done: 'primer rešen', case_pick: 'izbere primer na tabli', more_yes: 'še en primer', more_no: 'dovolj', fake_door: 'vrata »nov primer«',
  adult_gate: 'odrasli pregled', session_end: 'konec seje', session_start: 'začetek seje',
};

function timelineHTML(s, caseId) {
  const evs = s.events.filter(e => e.case === caseId);
  const t0 = evs.length ? evs[0].ts : 0;
  const c = caseById(caseId);
  const detail = (e) => {
    const parts = [];
    if (e.type === 'screen_enter') parts.push(e.screen);
    if (e.sentenceId && c) { const st = c.sentences.find(x => x.id === e.sentenceId); parts.push('»' + esc(st ? st.text : e.sentenceId) + '«'); }
    if (e.role && e.role !== 'neutral') parts.push('[' + e.role + ']');
    if (e.type === 'evidence_confirm') parts.push(e.correct ? '✔' : '✘');
    if (e.suspectId) parts.push(esc(CHARACTERS[e.suspectId] ? CHARACTERS[e.suspectId].name : e.suspectId));
    if (e.hint) parts.push(e.hint);
    if (e.clip) parts.push(e.clip);
    return parts.join(' · ');
  };
  return `<ol class="timeline">${evs.map(e => `<li><span class="t">${fmtDur(e.ts - t0)}</span> <b>${EVENT_LABEL[e.type] || e.type}</b> ${detail(e)}</li>`).join('')}</ol>`;
}

// ---------------------------------------------------------------------------
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (KID_MODE) {
  Object.assign(S, { age: '7-8', orderMode: 'board', pilot: false });
  ACTIONS.startSession();
  toHome(); // "Igraj!" on the start page was the start button: ID card / practice / files
} else {
  render();
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
</script>
